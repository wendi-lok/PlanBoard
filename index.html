<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlanBoard · 项目计划管理</title>
<style>
/* ============ 设计令牌 ============ */
:root{
  --bg:#f4f5f7; --panel:#ffffff; --panel-2:#fafbfc; --panel-3:#f0f1f4;
  --border:#e4e6eb; --border-2:#eef0f3;
  --text:#171a20; --text-2:#4d5563; --muted:#8b92a1;
  --accent:#4f46e5; --accent-2:#6366f1; --accent-soft:#eeeefe;
  --danger:#dc2f36; --danger-soft:#fdeeef;
  --ok:#0d9f6e; --ok-soft:#e8f7f1;
  --warn:#d98014; --warn-soft:#fdf3e3;
  --info:#2f7ff0; --info-soft:#eaf2fe;
  --radius:9px; --radius-lg:14px;
  --shadow-sm:0 1px 2px rgba(16,24,40,.06);
  --shadow:0 4px 16px rgba(16,24,40,.09);
  --shadow-lg:0 18px 50px rgba(16,24,40,.18);
  --edge-shade:rgba(79,70,229,.28);
  --gutter:16px;
  /* 依赖线：浅色底上用偏深的石板蓝，再配一圈浅色描边（halo），保证任何底色都看得清 */
  --dep:#55647c; --dep-halo:rgba(255,255,255,.9);
  --row-hover:rgba(23,26,32,.035);
  /* 框选：只能是一层「极淡的水洗」，绝不能挡住下面的任务信息 */
  --marquee-fill:rgba(79,70,229,.07); --marquee-line:rgba(79,70,229,.9);
}
html[data-theme="dark"]{
  --bg:#0d1015; --panel:#151a21; --panel-2:#1a2029; --panel-3:#212932;
  --border:#262e39; --border-2:#2b3440;
  --text:#e9edf3; --text-2:#adb6c3; --muted:#79849a;
  --accent:#6d63ff; --accent-2:#8b83ff; --accent-soft:#1d2040;
  --danger:#ff5f63; --danger-soft:#2c1a1d;
  --ok:#2dc492; --ok-soft:#122b23;
  --warn:#eaa93b; --warn-soft:#2c2416;
  --info:#4f9dff; --info-soft:#132235;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --shadow:0 4px 16px rgba(0,0,0,.35);
  --shadow-lg:0 18px 50px rgba(0,0,0,.55);
  --edge-shade:rgba(109,99,255,.36);
  /* 深色底上用偏亮的蓝灰，halo 换成深色描边 */
  --dep:#b3c2d8; --dep-halo:rgba(9,12,17,.78);
  --row-hover:rgba(255,255,255,.045);
  --marquee-fill:rgba(129,120,255,.13); --marquee-line:rgba(155,148,255,.95);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
  font-size:14px;line-height:1.5;background:var(--bg);color:var(--text);
  overflow:hidden;-webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--muted);border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-corner{background:transparent}
#app{display:flex;flex-direction:column;height:100vh;width:100%}
.spacer{flex:1 1 auto;min-width:0}

/* ============ 顶栏 ============ */
.topbar{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;
  height:54px;padding:0 14px;background:var(--panel);
  border-bottom:1px solid var(--border);position:relative;z-index:30;
}
.brand{display:flex;align-items:center;gap:8px;padding-right:12px;border-right:1px solid var(--border-2);flex:0 0 auto}
.brand-mark{
  width:26px;height:26px;border-radius:8px;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--accent),#8b7cf6);color:#fff;font-weight:700;font-size:14px;
  box-shadow:0 2px 6px rgba(79,70,229,.35);
}
.brand-name{font-weight:650;font-size:15px;letter-spacing:-.2px}
.brand-sub{font-size:11px;color:var(--muted);padding-left:2px;display:none}
@media(min-width:1080px){.brand-sub{display:block}}
.proj-chips{display:flex;align-items:center;gap:6px;overflow-x:auto;overflow-y:hidden;max-width:38vw;padding:2px 0;scrollbar-width:none}
.proj-chips::-webkit-scrollbar{display:none}
.chip{
  display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:999px;
  border:1px solid var(--border);background:var(--panel);font-size:12.5px;color:var(--text-2);
  cursor:pointer;white-space:nowrap;transition:.14s;flex:0 0 auto;
}
.chip:hover{background:var(--panel-3);color:var(--text)}
.chip.on{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:600}
.chip .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.chip .cnt{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip.on .cnt{color:var(--accent);opacity:.75}
.search{position:relative;width:190px;flex:0 0 auto}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);opacity:.5;pointer-events:none}
.search .inp{padding-left:30px;height:32px}
@media(max-width:900px){.search{display:none}}

/* ============ Word 式菜单栏 ============ */
.menubar{display:flex;align-items:center;gap:1px;flex:0 0 auto;padding-left:2px}
.mb-wrap{position:relative}
.mb-item{
  border:0;background:transparent;color:var(--text-2);font-size:13px;font-weight:500;
  height:30px;padding:0 10px;border-radius:7px;cursor:pointer;transition:.12s;white-space:nowrap;
}
.mb-item:hover{background:var(--panel-3);color:var(--text)}
.mb-wrap.open .mb-item{background:var(--accent-soft);color:var(--accent)}
.mb-wrap.open .menu.mbmenu{display:block;animation:pop .13s ease-out}
.menu.mbmenu{position:absolute;top:calc(100% + 5px);left:0;right:auto;min-width:252px;max-height:70vh;overflow:auto}
.menu-item .kbd{margin-left:auto;padding-left:16px;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.menu-item .sw{margin-left:auto;font-size:10.5px;color:var(--accent);font-weight:600;padding-left:12px}
.menu-item[disabled]{opacity:.42;cursor:default}
.menu-item[disabled]:hover{background:transparent}

/* ============ 浏览器式项目标签页 ============ */
.tabbar{
  flex:0 0 auto;display:flex;align-items:flex-end;gap:4px;height:41px;padding:6px 12px 0;
  background:var(--panel-2);border-bottom:1px solid var(--border);z-index:24;
  overflow-x:auto;overflow-y:hidden;
}
.tabbar::-webkit-scrollbar{height:0}
.tabbar .spacer{flex:1 1 auto;min-width:12px}
.ptab{
  display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 8px 0 11px;
  border:1px solid var(--border);border-bottom:0;border-radius:10px 10px 0 0;background:var(--panel-3);
  font-size:12.5px;color:var(--text-2);cursor:pointer;white-space:nowrap;flex:0 0 auto;
  position:relative;top:1px;max-width:236px;transition:background .12s,color .12s;
}
.ptab:hover{background:var(--panel);color:var(--text)}
.ptab.on{background:var(--panel);color:var(--text);font-weight:600;box-shadow:0 -1px 0 var(--border) inset}
.ptab.on::after{content:'';position:absolute;left:1px;right:1px;bottom:-1px;height:2px;background:var(--panel)}
.ptab .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.ptab .nm{overflow:hidden;text-overflow:ellipsis;max-width:142px}
.ptab .cnt{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.ptab .dirty{width:6px;height:6px;border-radius:50%;background:var(--warn);flex:0 0 auto}
.ptab .x{
  width:18px;height:18px;border-radius:5px;border:0;background:transparent;color:var(--muted);
  cursor:pointer;font-size:11px;line-height:1;display:grid;place-items:center;flex:0 0 auto;padding:0;
}
.ptab .x:hover{background:var(--danger-soft);color:var(--danger)}
.ptab .exp{
  width:18px;height:18px;border-radius:5px;border:0;background:transparent;color:var(--muted);
  cursor:pointer;font-size:9px;line-height:1;display:grid;place-items:center;flex:0 0 auto;padding:0;
}
.ptab .exp:hover{background:var(--accent-soft);color:var(--accent)}
.ptab .exp.on{background:var(--accent-soft);color:var(--accent)}
.ptab.on .exp{color:var(--accent)}

/* —— 项目任务总览：贴在标签页下面的展开面板 —— */
.float-menu.outline-pop{min-width:404px;max-width:min(580px,92vw);padding:0;overflow:hidden;max-height:78vh}
.outline-pop .po-body{max-height:56vh}
.po-head{display:flex;align-items:center;gap:8px;padding:11px 13px 8px;font-size:13px}
.po-head .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.po-head b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.po-head .po-sum{margin-left:auto;font-size:11.5px;color:var(--muted);flex:0 0 auto;font-variant-numeric:tabular-nums}
.po-bar{height:4px;background:var(--panel-3);margin:0 13px 9px;border-radius:99px;overflow:hidden}
.po-bar i{display:block;height:100%;border-radius:99px}
.po-body{overflow:auto;padding:0 6px 6px;border-top:1px solid var(--border-2)}
.po-row{
  display:flex;align-items:center;gap:7px;padding:5px 7px;border-radius:7px;font-size:12.5px;
  cursor:pointer;min-width:0;
}
.po-row:hover{background:var(--panel-3)}
.po-row.selrow{background:var(--accent-soft)}
.po-row.selrow .po-t{color:var(--accent);font-weight:600}
.po-tw{
  width:16px;height:16px;flex:0 0 auto;border:0;background:transparent;color:var(--muted);
  cursor:pointer;font-size:9px;line-height:1;padding:0;border-radius:4px;
}
.po-tw:hover{background:var(--accent-soft);color:var(--accent)}
.po-tw.ph{pointer-events:none}
.po-dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.po-t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1 1 auto}
.po-t.done{color:var(--muted)}
.po-ms{font-size:10px;color:var(--warn);flex:0 0 auto}
.po-kids{font-size:10.5px;color:var(--muted);border:1px solid var(--border);border-radius:99px;padding:0 5px;line-height:15px;flex:0 0 auto}
.po-pct{font-size:11px;color:var(--muted);flex:0 0 auto;width:34px;text-align:right;font-variant-numeric:tabular-nums}
.po-pb{width:52px;height:4px;border-radius:99px;background:var(--panel-3);overflow:hidden;flex:0 0 auto}
.po-pb i{display:block;height:100%;border-radius:99px}
.po-empty{padding:22px 12px;text-align:center;color:var(--muted);font-size:12.5px}
.po-foot{
  display:flex;align-items:center;gap:8px;padding:8px 11px;border-top:1px solid var(--border-2);
  background:var(--panel-2);font-size:11.5px;color:var(--muted);
}
.po-foot button{
  border:1px solid var(--border);background:var(--panel);color:var(--text-2);border-radius:7px;
  height:24px;padding:0 9px;font-size:11.5px;cursor:pointer;flex:0 0 auto;
}
.po-foot button:hover{border-color:var(--accent);color:var(--accent)}
.ptab.newtab{padding:0 12px;border-style:dashed;color:var(--muted);font-weight:500}
.ptab.newtab:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.ptab.alltab .dot{display:none}
.ptab.ghost{border-style:dashed;color:var(--muted);font-weight:400}

/* 拖文件进页面时铺一层提示 */
.drop-veil{
  position:fixed;inset:8px;z-index:9000;display:none;place-items:center;pointer-events:none;
  background:var(--accent-soft);border:3px dashed var(--accent);border-radius:16px;
}
body.dragging-file .drop-veil{display:grid}
.drop-veil .box{text-align:center;color:var(--accent);font-size:16px;font-weight:650;line-height:2}
.drop-veil .box .sub{font-size:12.5px;font-weight:400;color:var(--text-2)}

/* ============ 次级栏 ============ */
.subbar{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;
  background:var(--panel-2);border-bottom:1px solid var(--border);z-index:25;
}
.seg{display:inline-flex;background:var(--panel-3);border-radius:9px;padding:3px;gap:2px}
.seg-btn{
  border:0;background:transparent;color:var(--text-2);font-size:13px;font-weight:500;
  height:28px;padding:0 14px;border-radius:7px;cursor:pointer;transition:.14s;white-space:nowrap;
}
.seg-btn:hover{color:var(--text)}
.seg-btn.on{background:var(--panel);color:var(--accent);font-weight:600;box-shadow:var(--shadow-sm)}
.view-tools{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.view-tools::-webkit-scrollbar{display:none}
.tool-label{font-size:12px;color:var(--muted);white-space:nowrap}

/* ============ 按钮 / 输入 ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:32px;padding:0 12px;border:1px solid var(--border);background:var(--panel);
  color:var(--text);border-radius:8px;font-size:13px;cursor:pointer;
  white-space:nowrap;transition:.14s;user-select:none;
}
.btn:hover{background:var(--panel-3)}
.btn:active{transform:translateY(.5px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(79,70,229,.28)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--panel-3)}
.btn.danger{color:var(--danger);border-color:var(--border)}
.btn.danger:hover{background:var(--danger-soft);border-color:var(--danger)}
.btn.sm{height:27px;padding:0 9px;font-size:12px;border-radius:7px}
.btn.icon{width:32px;padding:0}
.btn.icon.sm{width:27px}
.btn.on{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.inp{
  height:32px;padding:0 9px;border:1px solid var(--border);background:var(--panel);
  border-radius:8px;font-size:13px;outline:none;width:100%;transition:.14s;
}
.inp:hover{border-color:var(--muted)}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
select.inp{padding-right:6px;cursor:pointer;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 14px) 14px,calc(100% - 9px) 14px;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
textarea.inp{height:auto;min-height:64px;padding:8px 9px;resize:vertical;line-height:1.55}
.inp.sm{height:27px;font-size:12px;border-radius:7px}
input[type="date"].inp{font-size:12.5px}
input[type="range"]{width:100%;accent-color:var(--accent)}
.switch{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-2);cursor:pointer;user-select:none;white-space:nowrap}
.switch input{display:none}
.switch .track{width:32px;height:18px;border-radius:999px;background:var(--border);position:relative;transition:.18s;flex:0 0 auto}
.switch .track::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.18s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch input:checked + .track{background:var(--accent)}
.switch input:checked + .track::after{transform:translateX(14px)}

/* ============ 菜单 ============ */
.menu{
  position:absolute;top:48px;right:12px;min-width:186px;padding:5px;
  background:var(--panel);border:1px solid var(--border);border-radius:11px;
  box-shadow:var(--shadow-lg);z-index:80;display:none;
}
.menu.open{display:block;animation:pop .13s ease-out}
.menu-item{
  display:flex;align-items:center;gap:9px;width:100%;padding:7px 10px;border:0;background:transparent;
  border-radius:7px;font-size:13px;cursor:pointer;text-align:left;color:var(--text);
}
.menu-item:hover{background:var(--panel-3)}
.menu-item.danger{color:var(--danger)}
.menu-item.danger:hover{background:var(--danger-soft)}
.menu-sep{height:1px;background:var(--border-2);margin:5px 6px}
.menu-head{font-size:11px;color:var(--muted);padding:7px 10px 4px;font-weight:600;letter-spacing:.4px}

/* ============ 视图容器 ============ */
.view{flex:1 1 auto;overflow:auto;padding:var(--gutter);position:relative}
.view.nopad{padding:0;overflow:hidden}
.card{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-sm);
}
.card-head{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--border-2)}
.card-title{font-size:13.5px;font-weight:650;letter-spacing:-.1px}
.card-sub{font-size:12px;color:var(--muted)}
.card-body{padding:16px}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:64px 20px;color:var(--muted);text-align:center}
.empty .big{font-size:15px;font-weight:600;color:var(--text-2)}
.empty .ico{width:44px;height:44px;border-radius:14px;background:var(--panel-3);display:grid;place-items:center;font-size:20px}

/* ============ 徽标 / 通用小块 ============ */
.pill{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill.p1{background:var(--danger-soft);color:var(--danger)}
.pill.p2{background:var(--warn-soft);color:var(--warn)}
.pill.p3{background:var(--ok-soft);color:var(--ok)}
.pill.gray{background:var(--panel-3);color:var(--text-2)}
.pill.blue{background:var(--info-soft);color:var(--info)}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.bar{height:6px;border-radius:999px;background:var(--panel-3);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:999px;transition:width .3s ease}
.mono{font-variant-numeric:tabular-nums}
.ovf{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ============ 模态框 ============ */
.modal-mask{
  position:fixed;inset:0;background:rgba(15,22,35,.48);z-index:100;
  display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow:auto;
  animation:fade .13s ease-out;
}
.modal{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-lg);width:100%;max-width:620px;animation:pop .15s ease-out;margin:auto;
}
.modal.wide{max-width:760px}
.modal-head{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--border-2)}
.modal-title{font-size:15px;font-weight:650;flex:1;letter-spacing:-.2px}
.modal-body{padding:18px;display:flex;flex-direction:column;gap:14px;max-height:68vh;overflow:auto}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;padding:13px 18px;border-top:1px solid var(--border-2);background:var(--panel-2);border-radius:0 0 var(--radius-lg) var(--radius-lg)}
/* ============ Markdown 预览（附件右键） ============ */
/* 一张悬浮在屏幕正中的圆角卡片，卡片后面的背景做高斯模糊（backdrop-filter 只糊卡片以外的区域） */
.mdprev{
  position:fixed;inset:0;z-index:210;display:flex;align-items:center;justify-content:center;
  padding:3vh 20px;background:rgba(15,22,35,.30);animation:fade .16s ease-out;
  -webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);
}
html[data-theme="dark"] .mdprev{background:rgba(4,7,11,.44)}
.mdprev-card{
  display:flex;flex-direction:column;width:100%;max-width:1240px;height:94vh;
  background:var(--panel);border:1px solid var(--border);border-radius:18px;
  box-shadow:var(--shadow-lg);overflow:hidden;animation:pop .18s ease-out;
}
.mdprev-head{display:flex;align-items:center;gap:10px;padding:12px 12px 12px 20px;flex:0 0 auto;
  border-bottom:1px solid var(--border-2);background:var(--panel-2)}
.mdprev-head .mdprev-ico{flex:0 0 auto;width:17px;height:17px;display:flex;color:var(--text-2)}
.mdprev-head .mdprev-ico svg{display:block;width:17px;height:17px}
.mdprev-head .mdprev-title{flex:1 1 auto;min-width:0;font-size:14px;font-weight:650;color:var(--text);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mdprev-tag{flex:0 0 auto;font-size:10.5px;color:var(--muted);letter-spacing:.3px;white-space:nowrap;
  border:1px solid var(--border);border-radius:999px;padding:3px 9px}
/* 关闭按钮是顶栏里唯一的动作（下方没有底栏，什么也不放） */
.mdprev-x{flex:0 0 auto;width:32px;height:32px;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--border);border-radius:9px;background:var(--panel);color:var(--text-2);
  font-size:14px;line-height:1;cursor:pointer;transition:background .13s,color .13s,border-color .13s}
.mdprev-x:hover{background:var(--danger);border-color:var(--danger);color:#fff}
/* ★ 正文字号走 CSS 变量：Ctrl + 滚轮只改 --md-fs 这一个值，
   里面所有字号都是 em（相对它），于是整篇连标题一起缩放，不会出现「字大了、标题没大」。 */
.mdprev-body{flex:1 1 auto;overflow:auto;padding:26px 34px 42px;line-height:1.85;
  font-size:var(--md-fs,13.5px);
  color:var(--text-2);overflow-wrap:break-word;word-break:break-word}
.mdprev-body > :first-child{margin-top:0}
.mdprev-body > :last-child{margin-bottom:0}
.mdprev-body h1,.mdprev-body h2,.mdprev-body h3,
.mdprev-body h4,.mdprev-body h5,.mdprev-body h6{color:var(--text);line-height:1.4;margin:1.5em 0 .6em;font-weight:650}
.mdprev-body h1{font-size:1.63em;padding-bottom:.3em;border-bottom:1px solid var(--border-2)}
.mdprev-body h2{font-size:1.33em;padding-bottom:.25em;border-bottom:1px solid var(--border-2)}
.mdprev-body h3{font-size:1.15em}
.mdprev-body h4{font-size:1.04em}
.mdprev-body h5,.mdprev-body h6{font-size:.96em;color:var(--muted)}
.mdprev-body p{margin:.75em 0}
.mdprev-body ul,.mdprev-body ol{margin:.6em 0;padding-left:1.55em}
.mdprev-body li{margin:.3em 0}
.mdprev-body li.mdtask{list-style:none;position:relative}
.mdprev-body li.mdtask::before{content:'\2610';position:absolute;left:-1.35em;color:var(--muted)}
.mdprev-body li.mdtask.done::before{content:'\2611';color:var(--accent)}
.mdprev-body li.mdtask.done{color:var(--muted);text-decoration:line-through}
.mdprev-body code{font-family:ui-monospace,Consolas,'Courier New',monospace;font-size:.88em;
  background:var(--panel-3);border:1px solid var(--border);border-radius:5px;padding:1px 5px;color:var(--text)}
.mdprev-body pre.mdpre{margin:.85em 0;padding:13px 15px;background:var(--panel-3);border:1px solid var(--border);
  border-radius:10px;overflow:auto;line-height:1.6}
.mdprev-body pre.mdpre code{background:none;border:0;padding:0;font-size:.93em}
.mdprev-body blockquote{margin:.85em 0;padding:.15em 0 .15em 14px;border-left:3px solid var(--accent);color:var(--muted)}
.mdprev-body blockquote p{margin:.4em 0}
.mdprev-body hr{border:0;border-top:1px solid var(--border);margin:1.4em 0}
.mdprev-body a{color:var(--accent);text-decoration:none}
.mdprev-body a:hover{text-decoration:underline}
.mdprev-body img.mdimg{max-width:100%;border-radius:8px;border:1px solid var(--border)}
.mdprev-body table.mdtable{border-collapse:collapse;margin:.9em 0;font-size:.93em;width:100%}
.mdprev-body table.mdtable th,.mdprev-body table.mdtable td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.mdprev-body table.mdtable th{background:var(--panel-2);color:var(--text);font-weight:650}
.mdprev-empty{color:var(--muted)}
/* —— PDF 预览：卡片主体交给 Chrome 内置的阅读器（<embed> + blob: URL，
      实测 file:// 源下能正常渲染，自带工具栏 / 翻页 / 缩放）。
      所以 body 不留内边距、也不自己滚动，整块让给阅读器。 —— */
.mdprev-body.pdf-body{padding:0;overflow:hidden;display:flex;background:var(--panel-3)}
.mdprev-body.pdf-body embed{flex:1 1 auto;width:100%;height:100%;border:0;display:block}
.mdprev-body.pdf-body .pdf-fallback{margin:auto;padding:24px;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.9;max-width:420px}
/* 顶栏里的小工具按钮（PDF 的「新窗口打开」） */
.mdprev-tool{flex:0 0 auto;height:26px;display:inline-flex;align-items:center;gap:5px;padding:0 10px;
  font-size:11.5px;font-weight:600;color:var(--text-2);background:transparent;
  border:1px solid var(--border);border-radius:7px;cursor:pointer;white-space:nowrap}
.mdprev-tool:hover{color:var(--accent);border-color:var(--accent)}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field > label{font-size:12px;font-weight:600;color:var(--text-2)}
.field .hint{font-size:11.5px;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:620px){.row2,.row3{grid-template-columns:1fr}}
.chk-grid{display:flex;flex-wrap:wrap;gap:6px;max-height:150px;overflow:auto;padding:8px;border:1px solid var(--border);border-radius:9px;background:var(--panel-2)}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:4px 8px;border-radius:7px;cursor:pointer;background:var(--panel);border:1px solid var(--border);max-width:100%}
.chk:hover{border-color:var(--muted)}
.chk input{accent-color:var(--accent);margin:0}
.color-pick{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.color-pick button{width:24px;height:24px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;position:relative;box-sizing:border-box}
.color-pick button.on{border-color:var(--text);box-shadow:0 0 0 2px var(--panel) inset}
/* 纯白 / 近白色点：不描边的话在浅色面板上就是个看不见的洞 */
.color-pick button.lt{box-shadow:inset 0 0 0 1px rgba(15,23,42,.22)}
/* 深墨 / 近黑色点：深色面板上同理，得给它一圈浅描边才看得见（浅色主题不需要） */
html[data-theme="dark"] .color-pick button.dk{box-shadow:inset 0 0 0 1px rgba(255,255,255,.30)}
/* 「自动」这类带文字的胶囊按钮（条上文字颜色用） */
.color-pick button.pill{width:auto;min-width:44px;height:24px;border-radius:999px;padding:0 11px;
  font-size:11.5px;font-weight:600;color:var(--text-2);background:var(--panel-2);border:1px solid var(--border)}
.color-pick button.pill:hover{color:var(--text);border-color:var(--muted)}
.color-pick button.pill.on{color:var(--accent);border-color:var(--accent);background:var(--accent-soft);box-shadow:none}
/* —— 完整 RGB 取色器：一个「色环 + 当前色实心点」的圆按钮，点开就是系统全色域选择器 ——
   ★ 色环用的就是上面那块调色板的 8 个颜色（不是随便一条彩虹），所以它和一排色板圆点
     摆在一起是同一个视觉体系；中间留一格「当前色」，外面再包一圈面板色细环，
     免得当前色和环上某一段撞色时糊成一团（旧版就是在这里糊掉的）。 */
.cpick{
  position:relative;width:24px;height:24px;flex:0 0 auto;border-radius:50%;cursor:pointer;padding:0;
  border:2px solid transparent;box-sizing:border-box;display:inline-grid;place-items:center;overflow:hidden;
  background:conic-gradient(from -22.5deg,
    #4f46e5,#2f7ff0,#0d9f6e,#d98014,#dc2f36,#8b5cf6,#e05299,#0d9f9f,#4f46e5);
}
.cpick:hover{transform:scale(1.08)}
.cpick:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cpick.on{border-color:var(--text)}
.cpick>input[type="color"]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0;margin:0}
.cpick>input[type="color"]::-webkit-color-swatch-wrapper{padding:0}
.cpick>input[type="color"]::-webkit-color-swatch{border:0}
/* 中心那颗「当前色」：外圈一是面板色（把当前色和色环隔开），外圈二是极淡的描边
   （纯白 / 纯浅色点在浅色主题下也能看出边界）。 */
.cpick>i{width:13px;height:13px;border-radius:50%;pointer-events:none;
  box-shadow:0 0 0 2px var(--panel),0 0 0 3.5px rgba(15,23,42,.16)}
html[data-theme="dark"] .cpick>i{box-shadow:0 0 0 2px var(--panel),0 0 0 3.5px rgba(0,0,0,.42)}
.cpick.big{width:26px;height:26px}
.cpick.big>i{width:14px;height:14px}
/* 浮出来的取色面板：色板 + RGB 取色器 + 十六进制输入 */
.cpop{display:flex;flex-direction:column;gap:9px;min-width:196px}
.cpop .cpop-row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.cpop .sw{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.cpop .sw.on{border-color:var(--text);box-shadow:0 0 0 2px var(--panel) inset}
.cpop .cpop-head{font-size:12px;font-weight:650;color:var(--text);display:flex;align-items:center;gap:6px}
.cpop .cpop-head .spacer{flex:1}
.cpop .cpop-head button{border:0;background:transparent;color:var(--accent);cursor:pointer;font-size:11.5px;padding:0 2px}
.cpop .cpop-head button:hover{text-decoration:underline}
.cpop .cpop-line{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text-2)}
.cpop .cpop-line input[type="text"]{
  flex:1;min-width:0;height:27px;border:1px solid var(--border);border-radius:8px;background:var(--panel);
  color:var(--text);font-size:12px;padding:0 8px;font-family:ui-monospace,Menlo,Consolas,monospace;
}
.cpop .cpop-line input[type="text"]:focus{outline:none;border-color:var(--accent)}
.cpop .cpop-prev{width:26px;height:26px;border-radius:8px;border:1px solid var(--border);flex:0 0 auto}

/* ============ Toast ============ */
.toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{
  background:var(--text);color:var(--panel);padding:9px 16px;border-radius:10px;font-size:13px;
  box-shadow:var(--shadow-lg);animation:slideUp .2s ease-out;max-width:80vw;
}
html[data-theme="dark"] .toast{background:#e9edf3;color:#151a21}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.985)}to{opacity:1;transform:none}}
@keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* ============ 仪表盘 ============ */
.dash{display:flex;flex-direction:column;gap:var(--gutter);max-width:1500px;margin:0 auto}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--gutter)}
@media(max-width:1000px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;display:flex;flex-direction:column;gap:3px;position:relative;overflow:hidden;box-shadow:var(--shadow-sm)}
.stat .abar{position:absolute;left:0;top:0;bottom:0;width:3px}
.stat .k{font-size:12px;color:var(--muted);font-weight:600}
.stat .v{font-size:27px;font-weight:700;letter-spacing:-1px;line-height:1.15}
.stat .v small{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:0}
.stat .d{font-size:11.5px;color:var(--text-2)}
.dash-grid{display:grid;grid-template-columns:1.05fr 1fr 1.2fr;gap:var(--gutter);align-items:start}
@media(max-width:1160px){.dash-grid{grid-template-columns:1fr 1fr}}
@media(max-width:780px){.dash-grid{grid-template-columns:1fr}}
.donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donut-txt{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.donut-txt .n{font-size:23px;font-weight:700;letter-spacing:-1px;line-height:1.1}
.donut-txt .l{font-size:11px;color:var(--muted)}
.legend{display:flex;flex-direction:column;gap:9px;font-size:12.5px;min-width:132px}
.legend-row{display:flex;align-items:center;gap:8px}
.legend-row .val{margin-left:auto;font-weight:650;font-variant-numeric:tabular-nums}
.dist{display:flex;flex-direction:column;gap:13px}
.dist-row{display:flex;align-items:center;gap:10px;font-size:12.5px}
.dist-row .name{width:62px;color:var(--text-2);flex:0 0 auto}
.dist-row .bar{flex:1}
.dist-row .num{width:56px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto}
.plist{display:flex;flex-direction:column;gap:15px;max-height:330px;overflow:auto}
.plist-row{display:flex;flex-direction:column;gap:6px;cursor:pointer}
.plist-row:hover .nm{color:var(--accent)}
.plist-top{display:flex;align-items:center;gap:8px;font-size:13px;min-width:0}
.plist-top .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist-top .pc{margin-left:auto;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto}
.plist-meta{display:flex;gap:10px;font-size:11.5px;color:var(--muted)}
/* 「各项目进度」里每个项目前面的展开箭头 + 展开出来的任务树 */
.plist-tw{width:17px;height:17px;flex:0 0 auto;border:0;background:transparent;color:var(--muted);
  font-size:10px;line-height:1;cursor:pointer;border-radius:4px;padding:0;transition:.12s;
  display:flex;align-items:center;justify-content:center}
.plist-tw:hover{background:var(--accent-soft);color:var(--accent)}
.plist-tw.ph{pointer-events:none}
.plist-row.open>.plist-top .nm{color:var(--accent)}
/* 展开区复用项目总览浮层那套 .po-* 行样式，两处看起来是同一份东西 */
.plist-kids{margin-top:1px;padding:3px 0 1px;border-top:1px dashed var(--border)}
.plist-kids .po-row{font-size:12px;padding-top:4px;padding-bottom:4px}
.plist-kids .po-pb{width:44px}
/* 有项目被展开时，这块允许长高一些，别让人在一个小窗口里翻任务 */
.plist:has(.plist-row.open){max-height:60vh}
.alert-list{display:flex;flex-direction:column;max-height:300px;overflow:auto}
.alert-item{display:flex;align-items:center;gap:9px;padding:9px 4px;border-bottom:1px solid var(--border-2);font-size:13px;cursor:pointer}
.alert-item:hover{background:var(--panel-2)}
.alert-item:last-child{border-bottom:0}
.alert-item .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alert-item .d{font-size:11.5px;color:var(--muted);white-space:nowrap;flex:0 0 auto}
.alert-item .pd{width:6px;height:6px;border-radius:50%;flex:0 0 auto}

/* ============ 甘特图 ============ */
.gantt{height:100%;display:flex;flex-direction:column;background:var(--panel);position:relative}
.g-scroll{flex:1 1 auto;overflow:auto;position:relative}
.g-inner{position:relative;min-width:100%}
.g-head{display:flex;position:sticky;top:0;z-index:20;background:var(--panel-2);border-bottom:1px solid var(--border)}
.g-corner{
  position:sticky;left:0;z-index:22;width:var(--name-w,310px);flex:0 0 var(--name-w,310px);background:var(--panel-2);
  border-right:1px solid var(--border);display:flex;align-items:center;padding:0 12px;
  font-size:11.5px;font-weight:650;color:var(--text-2);letter-spacing:.3px;
}
/* 大纲列右边缘的「拉手」：像 Excel 一样拖它调这一列的宽度 */
.g-coldiv{
  position:absolute;top:0;bottom:0;right:-5px;width:10px;z-index:26;cursor:col-resize;
}
.g-coldiv::after{
  content:'';position:absolute;left:4px;top:6px;bottom:6px;width:1px;background:var(--border);
  transition:background .12s;
}
.g-coldiv:hover::after,.g-coldiv.on::after{background:var(--accent);width:2px;left:4px}
body.coldrag{cursor:col-resize!important}
body.coldrag .g-coldiv::after{background:var(--accent);width:2px}
.g-headcols{display:flex;flex-direction:column;flex:0 0 auto}
.g-monthrow,.g-dayrow{display:flex;height:28px;flex:0 0 auto}
.g-month{
  flex:0 0 auto;display:flex;align-items:center;padding:0 8px;border-right:1px solid var(--border);
  font-size:11.5px;font-weight:650;color:var(--text-2);white-space:nowrap;background:var(--panel-2);
}
.gm-lbl{position:sticky;left:calc(var(--name-w,310px) + 2px)}
.g-day{flex:0 0 auto;display:grid;place-items:center;font-size:11px;color:var(--muted);border-right:1px solid var(--border-2);overflow:hidden}
.g-day.wk{background:var(--panel-3);color:var(--text-2)}
.g-day.big{font-weight:650}
.g-body{position:relative}
.g-layer{position:absolute;top:0;bottom:0;pointer-events:none;z-index:0;overflow:hidden}
.g-layer .wkv{position:absolute;top:0;bottom:0;background:var(--panel-3);opacity:.55}
.g-layer .todayline{position:absolute;top:0;bottom:0;width:2px;background:var(--danger);opacity:.6}
.g-deps{position:absolute;top:0;pointer-events:none;z-index:1;overflow:visible}
/* —— 依赖线：双描边（先画一圈 halo 再画主线），深浅底色都清楚 —— */
.g-deps .dep-halo{fill:none;stroke:var(--dep-halo);stroke-width:4.6;stroke-linecap:round;stroke-linejoin:round}
.g-deps .dep-line{fill:none;stroke:var(--dep);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.g-deps .dep-ring{fill:var(--dep-halo)}
.g-deps .dep-dot{fill:var(--dep)}
.g-deps .dep-arw{fill:var(--dep);stroke:none}
/* —— 单独给某条依赖线指定了颜色：--dc 由内联样式给出（放在 .on 规则之前，选中态仍然优先） —— */
.g-deps .dep-g.has-c .dep-line{stroke:var(--dc)}
.g-deps .dep-g.has-c .dep-dot{fill:var(--dc)}
.g-deps .dep-g.has-c .dep-arw{fill:var(--dc)}
.g-deps .dep-g.on .dep-halo{stroke:var(--accent-soft);stroke-width:8.5}
.g-deps .dep-g.on .dep-ring{fill:var(--accent-soft)}
.g-deps .dep-g.on .dep-line{stroke:var(--accent-2);stroke-width:2.9}
.g-deps .dep-g.on .dep-dot{fill:var(--accent-2)}
.g-deps .dep-g.on .dep-arw{fill:var(--accent-2)}
/* 背景涂色：在背景层里铺一层半透明色块 */
/* 背景涂色：同一行连续的色块拼成一条「带」，中间不留圆角，只有整条的两端才圆 */
.g-layer .pc{position:absolute;border-radius:0;opacity:.5}
.g-layer .pc.rc-l{border-top-left-radius:7px;border-bottom-left-radius:7px}
.g-layer .pc.rc-r{border-top-right-radius:7px;border-bottom-right-radius:7px}
/* 深色底把浅色笔色压成橄榄色，看不清 —— 深色下要求更高的不透明度 */
html[data-theme="dark"] .g-layer .pc{opacity:.72}
.g-rows{position:relative;z-index:2}
/* 行下方的空白区：拖圆点新建任务可以松手在这里，双击也能新建 */
.g-blank{position:relative;z-index:1;border-top:1px dashed var(--border);cursor:default}
.g-blank .bh{position:absolute;left:14px;top:9px;font-size:11.5px;color:var(--muted);line-height:1.6;pointer-events:none;user-select:none;max-width:290px}
.g-blank .bh b{color:var(--text-2)}
.g-blank.hot{background:var(--accent-soft);border-top-color:var(--accent)}
.g-blank.hot .bh{color:var(--accent)}
.g-blank.hot .bh b{color:var(--accent)}
body.rowdrag .g-blank .bh{opacity:.55}
.g-row{display:flex;height:38px;border-bottom:1px solid var(--border-2)}
/* 悬停用半透明叠加而不是不透明底色，否则会把背景涂色整片盖掉 */
.g-row:hover{background:var(--row-hover)}
/* —— 拖动任务条「上下换行」：被拖的行脱离文档流跟着光标，占位条在列表里实时换位 —— */
.g-row.drag-row{position:absolute;left:0;right:0;z-index:9;border-radius:9px;pointer-events:none;
  background:var(--panel);box-shadow:var(--shadow-lg);border-bottom-color:transparent;opacity:.97}
.g-row.drag-row .g-name{background:var(--panel)}
.g-row.ph{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent);border-radius:9px;border-bottom-color:transparent;opacity:.7}
body.rowdrag{cursor:grabbing;user-select:none}
/* 拖动中光标会扫过一排排的行，悬停底色会引发大量无谓重绘 —— 直接关掉 */
body.rowdrag .g-row:hover,body.rowdrag .lv-row:hover{background:transparent}
body.rowdrag .g-row:hover .g-name{background:var(--panel)}
body.rowdrag .g-row.selrow:hover,body.rowdrag .lv-row.selrow:hover{background:var(--accent-soft)}
/* 被拖的行单独提层，位移只走合成器，不再触发整块重排 */
.g-row.drag-row,.lv-row.drag-row{will-change:transform;backface-visibility:hidden}
.g-scroll.paintmode,.g-scroll.paintmode .g-body,.g-scroll.paintmode .g-rows{cursor:crosshair}
body.painting,body.painting *{cursor:crosshair!important}
.g-row.done .g-name .tt{color:var(--muted);text-decoration:line-through}
.g-name{
  position:sticky;left:0;z-index:10;width:var(--name-w,310px);flex:0 0 var(--name-w,310px);display:flex;align-items:center;gap:6px;
  padding:0 10px;background:var(--panel);border-right:1px solid var(--border);font-size:13px;overflow:hidden;
}
.g-row:hover .g-name{background:var(--panel-2)}
.g-name.d1{padding-left:26px}.g-name.d2{padding-left:44px}.g-name.d3{padding-left:62px}
.g-name .tw{
  width:17px;height:17px;border-radius:5px;border:1px solid var(--border);background:var(--panel);
  display:grid;place-items:center;font-size:9px;cursor:pointer;flex:0 0 auto;color:var(--text-2);line-height:1;
}
.g-name .tw:hover{border-color:var(--accent);color:var(--accent)}
.g-name .tw.hidden{visibility:hidden}
.g-name .tt{flex:1;min-width:0;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-name .tt:hover{color:var(--accent)}
.g-name .pdot{width:6px;height:6px;border-radius:50%;flex:0 0 auto}
/* —— 大纲里的「项目分组行」：项目名 + 该项目的任务数 / 完成度；点它整组展开 / 收起 —— */
.g-prow{display:flex;height:38px;border-bottom:1px solid var(--border);background:var(--panel-2);cursor:pointer;user-select:none}
.g-prow:hover{background:var(--row-hover)}
.g-prow .g-name{background:transparent;font-weight:650;font-size:13px;padding-left:12px}
.g-prow:hover .g-name{background:transparent}
.g-prow .g-name .tt{font-weight:650;min-width:56px}
/* 大纲列拖得很窄时，表头那串「N 个项目 · M 条任务」先省略，别压到时间轴上 */
.g-corner .g-ccnt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-prow .g-name .tt:hover{color:var(--accent)}
.g-prow .pn-k{font-size:11px;color:var(--muted);font-weight:500;flex:0 0 auto;white-space:nowrap}
.g-prow .pn-pct{font-size:11px;font-weight:650;flex:0 0 auto;min-width:32px;text-align:right;color:var(--text-2)}
/* 大纲列拖窄时，项目行右边的装饰先让位（容器查询按 .g-name 自己的宽度判断） */
.g-prow .g-name{container-type:inline-size}
.g-prow .pn-mini{width:34px;height:5px;border-radius:3px;background:var(--border);overflow:hidden;flex:0 0 auto}
@container (max-width:256px){ .g-prow .pn-mini{display:none} }
@container (max-width:198px){ .g-prow .pn-k{display:none} }
.g-prow .pn-mini i{display:block;height:100%;border-radius:3px}
.g-prow.shut .pn-mini{opacity:.5}
.g-prow .g-pbar{position:absolute;top:15px;height:8px;border-radius:4px;opacity:.5;pointer-events:none}
.g-prow:hover .g-pbar{opacity:.75}
.g-prow.hot{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent)}
.g-prow.hot .tt{color:var(--accent)}
body.rowdrag .g-prow:hover{background:var(--panel-2)}
.g-track{position:relative;height:100%;flex:0 0 auto}
.g-bar{
  position:absolute;top:8px;height:22px;border-radius:6px;cursor:grab;z-index:3;
  display:flex;align-items:center;overflow:hidden;box-shadow:0 1px 3px rgba(16,24,40,.18);
  touch-action:none;
}
.g-bar:active{cursor:grabbing}
.g-bar .fill{position:absolute;left:0;top:0;bottom:0;background:rgba(0,0,0,.24)}
/* —— 状态外框：条的一圈描边用「状态颜色」画（--stc 由渲染时内联给出；
      粗细 --ring-w 由左侧设置栏的滑条控制，0 = 不要外框） —— */
.g-bar .ring{position:absolute;left:0;top:0;right:0;bottom:0;box-sizing:border-box;
  border:var(--ring-w,2px) solid var(--stc,transparent);border-radius:inherit;pointer-events:none}
.g-bar .lbl{position:relative;padding:0 9px;font-size:11.5px;color:#fff;white-space:nowrap;
  text-shadow:0 1px 2px rgba(0,0,0,.38);pointer-events:none;font-weight:600}
/* ★ 条身是亮色时自动改用深色字（见 barTextColor()）：深色字不能再压一层暗阴影，
   否则笔画会糊；换成一层极浅的亮阴影，浅色条上照样立得住。 */
.g-bar .lbl.dk{text-shadow:0 1px 1px rgba(255,255,255,.55)}
.g-bar .h{position:absolute;top:0;bottom:0;width:7px;z-index:4;cursor:ew-resize}
.g-bar .h.l{left:0}.g-bar .h.r{right:0}
.g-bar:hover .h{background:rgba(255,255,255,.35)}
/* 条形太短、放不下文字时，标签移到条形外侧，保证完整可读 */
.g-lbl{
  position:absolute;top:8px;height:22px;display:flex;align-items:center;
  font-size:11.5px;font-weight:600;color:var(--text-2);white-space:nowrap;
  pointer-events:auto;cursor:pointer;z-index:2;letter-spacing:-.1px;
}
.g-lbl::before{
  content:"";position:absolute;left:-6px;width:6px;height:1.5px;background:var(--border);
}
.g-lbl.left::before{left:auto;right:-6px}
.g-lbl:hover{color:var(--accent)}
.g-lbl.dim{color:var(--muted);font-weight:600}
.g-ms{position:absolute;top:11px;width:16px;height:16px;transform:rotate(45deg);border-radius:3px;cursor:grab;z-index:3;
  box-shadow:0 0 0 var(--ring-w,2px) var(--stc,transparent),0 1px 3px rgba(16,24,40,.22);touch-action:none}
.g-sum{position:absolute;top:15px;height:9px;border-radius:2px;cursor:grab;z-index:3;
  box-shadow:0 0 0 var(--ring-w,2px) var(--stc,transparent);touch-action:none}
.g-sum::before,.g-sum::after{content:"";position:absolute;top:0;width:0;height:0;border-top:9px solid currentColor}
.g-sum::before{left:0;border-right:7px solid transparent}
.g-sum::after{right:0;border-left:7px solid transparent}
/* —— 连接节点：平时隐藏，鼠标靠近某条任务时才冒出它的两个圆点 —— */
.g-node{
  position:absolute;top:12px;width:14px;height:14px;border-radius:50%;
  background:var(--nc,#4f46e5);
  box-shadow:0 0 0 2px var(--panel),0 1px 4px rgba(16,24,40,.35);
  z-index:6;opacity:0;transform:scale(.4);pointer-events:none;
  transition:opacity .12s ease,transform .12s ease,box-shadow .12s ease;
  cursor:crosshair;touch-action:none;
}
.g-node.on{opacity:1;transform:scale(1);pointer-events:auto}
.g-node:hover,.g-node.act{opacity:1;transform:scale(1.28);pointer-events:auto;box-shadow:0 0 0 4px var(--accent-soft),0 1px 4px rgba(16,24,40,.35)}
/* 连线拖拽：橡皮筋 + 落点提示 */
.g-link{position:absolute;top:0;pointer-events:none;z-index:8;overflow:hidden}
.g-link path{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:5 4;stroke-linecap:round;opacity:.95}
.g-snap{position:absolute;top:0;bottom:0;width:0;pointer-events:none;z-index:9;display:none}
.g-snap i{position:absolute;top:0;bottom:0;left:-1px;width:2px;border-radius:1px;background:var(--accent);opacity:.45}
.g-snap b{
  position:absolute;white-space:nowrap;font-size:11.5px;font-weight:650;
  background:var(--accent);color:#fff;padding:3px 9px;border-radius:99px;
  box-shadow:var(--shadow);transform:translate(-50%,-50%);
}
.g-link-target{box-shadow:0 0 0 2px var(--panel),0 0 0 5px var(--accent),0 2px 10px rgba(16,24,40,.28)!important;z-index:7!important}
.g-empty{padding:70px 20px;text-align:center;color:var(--muted)}
.g-foot{flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:7px 14px;border-top:1px solid var(--border);background:var(--panel-2);font-size:11.5px;color:var(--muted);overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.g-foot::-webkit-scrollbar{display:none}
.g-foot .lg{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex:0 0 auto}
.g-foot .lg.kbd{color:var(--text-2)}
.g-foot .sw{width:16px;height:9px;border-radius:3px;display:inline-block;flex:0 0 auto}
/* —— 框选 / 批量选择 —— */
.g-marquee{
  position:absolute;z-index:11;left:0;top:0;width:0;height:0;display:none;
  pointer-events:none;border:1.5px dashed var(--marquee-line);border-radius:4px;
  /* 只铺一层极淡的水洗 + 一圈虚线：任务条、文字、涂色都还能看清 */
  background:var(--marquee-fill);
}
.g-bar.sel,.g-sum.sel,.g-ms.sel{
  box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--accent),0 2px 10px rgba(16,24,40,.3)!important;
  z-index:5!important;
}
/* 选中一行：整行淡淡高亮 + 名称列左侧一道强调竖条，一眼看得出选的是哪一行 */
.g-row.selrow{background:var(--accent-soft)}
.g-row.selrow .g-name{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.g-row.selrow .g-name .tt{color:var(--accent);font-weight:650}
.g-row.over-name{outline:2px dashed var(--accent);outline-offset:-2px}
body.marquee-on{cursor:crosshair}
body.marquee-on .g-scroll,body.marquee-on .g-body{user-select:none}
/* —— 中键平移 —— */
.g-scroll.panning{cursor:grabbing}
body.panning{cursor:grabbing;user-select:none}
/* —— 缩放提示 —— */
.g-zoomhud{
  position:absolute;right:18px;bottom:56px;z-index:24;padding:6px 13px;border-radius:999px;
  background:var(--text);color:var(--panel);font-size:12px;font-weight:650;letter-spacing:.2px;
  box-shadow:var(--shadow);opacity:0;transform:translateY(6px);pointer-events:none;
  transition:opacity .16s ease,transform .16s ease;font-variant-numeric:tabular-nums;
}
html[data-theme="dark"] .g-zoomhud{background:#e9edf3;color:#151a21}
.g-zoomhud.on{opacity:1;transform:none}
/* —— 右键上下文菜单 —— */
.ctx{
  position:fixed;z-index:300;min-width:192px;max-width:272px;padding:5px;
  background:var(--panel);border:1px solid var(--border);border-radius:11px;
  box-shadow:var(--shadow-lg);animation:pop .11s ease-out;
}
.ctx-head{
  padding:7px 10px 6px;font-size:11.5px;font-weight:650;color:var(--muted);
  border-bottom:1px solid var(--border-2);margin-bottom:4px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.ctx-item{
  display:flex;align-items:center;gap:9px;width:100%;padding:7px 10px;border:0;background:transparent;
  border-radius:7px;font-size:13px;cursor:pointer;text-align:left;color:var(--text);
}
.ctx-item:hover{background:var(--panel-3)}
.ctx-item.danger{color:var(--danger)}
.ctx-item.danger:hover{background:var(--danger-soft)}
.ctx-item .k{margin-left:auto;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.ctx-sep{height:1px;background:var(--border-2);margin:5px 6px}
/* —— 选中依赖线后浮出来的小操作条 —— */
.dep-pop{
  position:fixed;z-index:300;display:flex;align-items:center;gap:7px;padding:6px 8px;
  background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);
  animation:pop .11s ease-out;max-width:min(560px,92vw);
}
.dep-pop .ttl{
  font-size:12px;font-weight:650;color:var(--text-2);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:230px;display:inline-flex;align-items:center;gap:6px;
}
.dep-pop .ttl .arw{color:var(--accent-2);font-weight:700}
.dep-pop .btn.sm{height:26px;padding:0 10px;font-size:12px}
/* —— 背景画笔：圆形主按钮一键开关，面板悬停展开、可自动隐藏 —— */
.pt{position:absolute;right:16px;bottom:54px;z-index:26;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.pt-fab{
  position:relative;width:44px;height:44px;border-radius:50%;border:1px solid var(--border);background:var(--panel);
  box-shadow:var(--shadow);cursor:pointer;display:grid;place-items:center;font-size:19px;line-height:1;
  color:var(--text-2);transition:.16s;
}
.pt-fab:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
.pt-fab.on{border-color:var(--accent);color:#fff;box-shadow:0 0 0 3px var(--accent-soft),var(--shadow)}
.pt-fab.er{background:var(--danger);border-color:var(--danger);box-shadow:0 0 0 3px rgba(220,47,54,.22),var(--shadow)}
.pt-fab.on::after{
  content:"";position:absolute;inset:-3px;border-radius:50%;pointer-events:none;
  border:2px solid var(--accent);opacity:.9;animation:ptPulse 1.7s ease-out infinite;
}
.pt-fab.er::after{border-color:var(--danger)}
@keyframes ptPulse{
  0%{transform:scale(.86);opacity:.85}
  70%{transform:scale(1.28);opacity:0}
  100%{transform:scale(1.28);opacity:0}
}
.pt-fab .pt-badge{
  position:absolute;right:-3px;bottom:-3px;width:15px;height:15px;border-radius:50%;
  border:2px solid var(--panel);background:#fff;display:none;
}
.pt-fab.on .pt-badge{display:block}
.pt-panel{
  display:none;width:206px;padding:10px;gap:9px;flex-direction:column;
  background:var(--panel);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-lg);
  animation:pop .12s ease-out;
}
.pt.open .pt-panel{display:flex}
.pt-head{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:650;color:var(--text-2)}
.pt-head .spacer{flex:1}
.pt-head .st{font-size:11px;font-weight:600;color:var(--muted);white-space:nowrap}
.pt-head .st.on{color:var(--accent)}
.pt-head button{width:20px;height:20px;border:0;background:transparent;color:var(--muted);cursor:pointer;border-radius:6px;font-size:13px;line-height:1}
.pt-head button:hover{background:var(--panel-3);color:var(--text)}
.pt-tools{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pt-tools button{
  height:30px;border:1px solid var(--border);background:var(--panel);border-radius:8px;cursor:pointer;
  font-size:12px;color:var(--text-2);display:flex;align-items:center;justify-content:center;gap:5px;
}
.pt-tools button:hover{border-color:var(--accent);color:var(--accent)}
.pt-tools button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.pt-tools button[data-pt="eraser"].on{background:var(--danger);border-color:var(--danger)}
.pt-swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.pt-sw{height:22px;border-radius:7px;border:2px solid transparent;cursor:pointer;padding:0}
.pt-sw:hover{transform:scale(1.08)}
.pt-sw.on{border-color:var(--text);box-shadow:0 0 0 2px var(--panel)}
.pt-cur{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted)}
.pt-cur i{width:16px;height:16px;border-radius:5px;border:1px solid var(--border);flex:0 0 auto}
.pt-note{font-size:11px;line-height:1.55;color:var(--muted)}
.pt-note b{color:var(--text-2)}
.pt-actions{display:flex;gap:6px}
.pt-actions button{flex:1;height:28px;border:1px solid var(--border);background:var(--panel);border-radius:8px;cursor:pointer;font-size:12px;color:var(--text-2)}
.pt-actions button:hover{border-color:var(--danger);color:var(--danger)}
.pt-actions button.prim{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.pt-actions button.prim:hover{background:var(--accent-3,var(--accent));color:#fff}
/* —— 画笔开启时，画布左下角浮一条状态条（一眼看得出「现在在涂色」） —— */
.paint-hud{
  position:absolute;left:16px;bottom:54px;z-index:26;display:none;align-items:center;gap:9px;
  padding:8px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--border);
  box-shadow:var(--shadow-lg);font-size:12px;color:var(--text-2);cursor:pointer;
}
.paint-hud.on{display:flex;animation:pop .14s ease-out}
.paint-hud:hover{border-color:var(--accent)}
.paint-hud .dot{width:13px;height:13px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 0 2px var(--panel-2),0 0 0 3px var(--border)}
.paint-hud b{font-weight:650;color:var(--text)}
.paint-hud .kbd{font-size:11px;color:var(--muted);border:1px solid var(--border);border-radius:5px;padding:1px 5px}
/* —— 模板行（设置面板） —— */
.tpl-row{
  display:grid;grid-template-columns:22px 1fr 1.15fr 62px 74px 74px 62px 30px;gap:7px;align-items:center;
  padding:7px 8px;border:1px solid var(--border);border-radius:10px;background:var(--panel);
}
.tpl-row.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tpl-row .rad{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--border);background:transparent;cursor:pointer;padding:0}
.tpl-row .rad.on{border-color:var(--accent);background:radial-gradient(circle,var(--accent) 0 4.5px,transparent 5px)}
.tpl-row .del{width:26px;height:26px;border:0;background:transparent;color:var(--muted);cursor:pointer;border-radius:7px;font-size:13px}
.tpl-row .del:hover{background:var(--danger-soft);color:var(--danger)}
.tpl-row .inp{height:29px;font-size:12.5px}
.tpl-head{display:grid;grid-template-columns:22px 1fr 1.15fr 62px 74px 74px 62px 30px;gap:7px;padding:0 8px;font-size:11px;color:var(--muted);font-weight:650}
@media(max-width:760px){.tpl-head{display:none}.tpl-row{grid-template-columns:22px 1fr 72px;grid-auto-rows:auto}}
.set-sec{font-size:11.5px;font-weight:650;color:var(--muted);letter-spacing:.3px;margin:2px 0 8px}
.set-card{border:1px solid var(--border);border-radius:12px;padding:13px;background:var(--panel-2)}

/* ============ 看板 ============ */
.kb-wrap{position:relative;height:100%;min-height:0;display:flex}
.kb-scroll{flex:1 1 auto;padding:14px;display:flex;min-height:0;overflow-x:auto;overflow-y:hidden}
/* 拖拽靠边时的提示：必须是覆盖层，列的背景会把滚动容器自身的内阴影整个盖住 */
.kb-edge{position:absolute;top:0;bottom:0;width:34px;pointer-events:none;z-index:6;opacity:0;transition:opacity .15s}
.kb-edge.l{left:0;background:linear-gradient(to right,var(--edge-shade),transparent)}
.kb-edge.r{right:0;background:linear-gradient(to left,var(--edge-shade),transparent)}
.kb-wrap.edge-l .kb-edge.l{opacity:1}
.kb-wrap.edge-r .kb-edge.r{opacity:1}
.kb-col{position:relative}
/* 列内上下沿提示：用运行时量出的列头/底部新增框高度，正好盖在可滚动区两端 */
.kb-col::before,.kb-col::after{content:'';position:absolute;left:1px;right:1px;height:38px;pointer-events:none;z-index:4;opacity:0;transition:opacity .15s}
.kb-col::before{top:var(--kb-top,42px);background:linear-gradient(to bottom,var(--edge-shade),transparent)}
.kb-col::after{bottom:var(--kb-bot,49px);background:linear-gradient(to top,var(--edge-shade),transparent)}
.kb-col.edge-t::before,.kb-col.edge-b::after{opacity:1}
.kb{display:flex;gap:14px;height:100%;align-items:stretch;min-height:0;flex:1 1 auto;min-width:min-content}
.kb-col{
  flex:1 1 0;min-width:238px;background:var(--panel-2);border:1px solid var(--border);
  border-radius:var(--radius-lg);display:flex;flex-direction:column;min-height:0;transition:.15s;
}
.kb-col.over{border-color:var(--accent);background:var(--accent-soft)}
.kb-head{display:flex;align-items:center;gap:8px;padding:11px 13px;border-bottom:1px solid var(--border-2);flex:0 0 auto}
.kb-head .cdot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.kb-head .nm{font-size:13px;font-weight:650}
.kb-head .cnt{font-size:11.5px;color:var(--muted);background:var(--panel-3);border-radius:999px;padding:1px 8px;margin-left:auto}
.kb-list{flex:1 1 auto;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:9px;min-height:60px}
.kb-card{
  background:var(--panel);border:1px solid var(--border);border-radius:11px;padding:10px 11px 10px 14px;
  cursor:grab;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:7px;position:relative;overflow:hidden;
  /* 关键：卡片绝不能参与纵向压缩。列内是 flex 列 + overflow:hidden，
     不给 flex:0 0 auto 的话，卡片一多就会被压成一条条，文字互相重叠。 */
  flex:0 0 auto;
}
.kb-card:hover{border-color:var(--muted);box-shadow:var(--shadow)}
.kb-card.dragging{opacity:.35}
.kb-card .stripe{position:absolute;left:0;top:0;bottom:0;width:3px}
.kb-card .t{font-size:13px;font-weight:600;line-height:1.4;word-break:break-word}
.kb-card .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.kb-card .pj{display:inline-flex;align-items:center;gap:5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kb-card .late{color:var(--danger);font-weight:600}
.kb-quick{padding:8px 10px 10px;border-top:1px dashed var(--border);flex:0 0 auto}
.kb-quick .inp{border-style:dashed;height:30px;font-size:12.5px}
.kb-add{width:100%;border:1px dashed var(--border);background:transparent;color:var(--muted);border-radius:9px;height:32px;cursor:pointer;font-size:12.5px;transition:.14s}
.kb-add:hover{border-color:var(--accent);color:var(--accent);background:var(--panel)}

/* —— 列头拖拽：按住标题那一行可以拖动整条状态列 —— */
.kb-head{cursor:grab;user-select:none}
.kb-head .grip{color:var(--muted);font-size:12px;letter-spacing:-1px;opacity:.6;flex:0 0 auto}
.kb-head .cnt{margin-left:auto}
.kb-col.col-drag{opacity:.9;border-color:var(--accent);box-shadow:var(--shadow-lg);transform:scale(1.012)}
.kb-col.col-ph{border-style:dashed;border-color:var(--accent);background:var(--accent-soft);opacity:.55}
body.coldrag{cursor:grabbing}
body.coldrag .kb-card:hover{border-color:var(--border);box-shadow:var(--shadow-sm)}

/* —— 卡片里的子任务（可展开、可就地新建） —— */
.kb-card .kb-kids{
  align-self:flex-start;display:inline-flex;align-items:center;gap:6px;
  border:1px solid var(--border);background:var(--panel-2);color:var(--text-2);
  border-radius:999px;padding:2px 9px;font-size:11.5px;cursor:pointer;transition:.14s;max-width:100%;
}
.kb-card .kb-kids:hover{border-color:var(--accent);color:var(--accent)}
.kb-card .kb-kids .ar{font-size:10px;line-height:1}
.kb-card .kb-kids .h{color:var(--muted)}
.kb-subs{display:flex;flex-direction:column;gap:1px;border-left:2px solid var(--border-2);padding-left:7px;margin-left:2px}
.kb-sub{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);padding:3px 4px;border-radius:6px;min-width:0}
.kb-sub:hover{background:var(--row-hover)}
.kb-sub .sdot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.kb-sub .stx{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.kb-sub .stx.done{text-decoration:line-through;color:var(--muted)}
.kb-sub.d1{margin-left:10px}.kb-sub.d2{margin-left:20px}.kb-sub.d3{margin-left:30px}.kb-sub.d4{margin-left:40px}
.kb-mini{flex:0 0 auto;border:1px solid transparent;background:transparent;color:var(--muted);border-radius:6px;
  font-size:11px;line-height:1;padding:2px 5px;cursor:pointer;opacity:0;transition:.12s}
.kb-sub:hover .kb-mini{opacity:1}
.kb-mini:hover{border-color:var(--accent);color:var(--accent);background:var(--panel)}
.kb-card .kb-acts{display:flex;gap:6px;opacity:0;transition:opacity .12s}
.kb-card:hover .kb-acts{opacity:1}
.kb-addsub{flex:1 1 auto;border:1px dashed var(--border);background:transparent;color:var(--muted);
  border-radius:8px;height:26px;font-size:11.5px;cursor:pointer;transition:.14s}
.kb-addsub:hover{border-color:var(--accent);color:var(--accent);background:var(--panel)}
/* 就地新建子任务的小输入框 */
.kb-newsub{display:flex;gap:6px;align-items:center}
.kb-newsub .inp{height:28px;font-size:12px;border-style:dashed}
/* 附件角标 */
.ach{display:inline-flex;align-items:center;gap:3px;font-size:11px;color:var(--muted)}

/* —— 悬停信息卡：简洁、不挡视野、绝不压住被悬停的那一条 —— */
.task-tip{
  position:fixed;z-index:95;max-width:312px;background:var(--panel);border:1px solid var(--border);
  border-radius:11px;box-shadow:var(--shadow-lg);padding:9px 11px;font-size:12px;color:var(--text);
  pointer-events:none;display:flex;flex-direction:column;gap:4px;line-height:1.45;
}
.task-tip .tt-t{font-weight:650;font-size:12.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.task-tip .tt-r{color:var(--text-2);display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.task-tip .tt-r .d{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.task-tip .tt-r .sep{color:var(--muted)}
.task-tip .tt-n{color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.task-tip .tt-a{display:flex;flex-wrap:wrap;gap:4px}
.task-tip .tt-ch{background:var(--panel-3);border-radius:6px;padding:1px 6px;font-size:11px;color:var(--text-2);
  max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task-tip .tt-bar{display:inline-block;width:56px;height:5px;border-radius:99px;background:var(--panel-3);overflow:hidden;vertical-align:middle}
.task-tip .tt-bar i{display:block;height:100%;background:var(--accent)}
.task-tip .tt-h{color:var(--muted);font-size:11px;border-top:1px solid var(--border-2);padding-top:4px}

/* —— 任务弹窗里的附件区（右侧一栏） —— */
.att-list{display:flex;flex-direction:column;gap:7px;margin-top:2px}
.att-item{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:9px;
  padding:7px 9px;background:var(--panel-2);font-size:12.5px;cursor:pointer;transition:border-color .14s,background .14s}
.att-item:hover{border-color:var(--accent);background:var(--row-hover)}
.att-item .ico{flex:0 0 auto;width:16px;height:16px;display:flex;align-items:center;justify-content:center;color:var(--text-2)}
.att-item .ico svg{display:block;width:16px;height:16px}
.att-item .nm{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.att-item:hover .nm{color:var(--accent)}
/* 类型徽标（MD / XLSX / 文件夹 / 链接）—— 只显示文件名 + 类型，不显示完整路径（悬停才给） */
.att-item .sz{color:var(--muted);font-size:10px;flex:0 0 auto;letter-spacing:.4px;text-transform:uppercase;
  border:1px solid var(--border);border-radius:5px;padding:1px 5px;white-space:nowrap}
.att-item .ops{display:flex;gap:4px;flex:0 0 auto}
.att-item .ops button{border:1px solid var(--border);background:transparent;color:var(--muted);border-radius:6px;
  width:22px;height:22px;line-height:1;cursor:pointer;font-size:12px}
.att-item .ops button:hover{color:var(--accent);border-color:var(--accent)}
.att-drop{border:1px dashed var(--border);border-radius:9px;padding:11px 9px;text-align:center;color:var(--muted);
  font-size:12px;cursor:pointer;transition:.14s;line-height:1.75}
.att-drop:hover,.att-drop.over{border-color:var(--accent);color:var(--accent);background:var(--panel-2)}
.att-drop .sub{font-size:11px;opacity:.82}
/* 「粘贴文件路径」/「外部链接」两个次要入口并排一行 */
.att-add{display:flex;gap:8px}
.att-add .btn{flex:1 1 0;min-width:0;height:30px;padding:0 6px;font-size:12px}
.att-empty{border:1px dashed var(--border);border-radius:9px;padding:13px 8px;text-align:center;color:var(--muted);font-size:11.5px;line-height:1.7}

/* —— 任务弹窗：左边填字段 / 右边放附件，两栏 —— */
.modal.xwide{max-width:1010px}
.tk-grid{display:grid;grid-template-columns:minmax(0,1fr) 268px;gap:18px;align-items:start}
.tk-main{display:flex;flex-direction:column;gap:14px;min-width:0}
.att-side{display:flex;flex-direction:column;gap:9px;position:sticky;top:0;min-width:0}
.att-head{font-size:11.5px;font-weight:650;color:var(--muted);letter-spacing:.5px;display:flex;align-items:baseline;gap:6px}
.att-head .n{margin-left:auto;font-weight:400;letter-spacing:0}
.att-list{max-height:42vh;overflow:auto;padding-right:2px}
@media(max-width:840px){.tk-grid{grid-template-columns:1fr;gap:14px}.att-side{position:static}.att-list{max-height:none}}

/* —— 全站统一的「单击高亮」选中态 —— */
.kb-card.selcard{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft),var(--shadow)}
.kb-card.selcard .t{color:var(--accent)}
.kb-sub.selsub{background:var(--accent-soft)}
.kb-sub.selsub .stx{color:var(--accent);font-weight:650}
.alert-item.seldash{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.dash .alert-item .selhint{display:none}

/* ============ 列表 ============ */
.lv{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;max-width:1500px;margin:0 auto}
.lv-head,.lv-row{display:grid;grid-template-columns:var(--lv-cols,minmax(200px,1fr) 104px 78px 112px 112px 96px 88px 72px);gap:8px;align-items:center}
/* 表头每一格：右边缘带一个「拉手」，像 Excel 一样拖着调这一列的宽度 */
.lv-hc{position:relative;min-width:0;overflow:visible;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center}
.lv-hc .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lv-rz{position:absolute;top:-10px;bottom:-10px;right:-7px;width:14px;cursor:col-resize;z-index:4}
.lv-rz::after{content:'';position:absolute;left:6px;top:8px;bottom:8px;width:1px;background:var(--border);transition:background .12s}
.lv-rz:hover::after,.lv-rz.on::after{background:var(--accent);width:2px}
body.colresize{cursor:col-resize!important;user-select:none!important}
body.colresize .lv-rz::after{background:var(--accent);width:2px}
.lv-head{padding:9px 14px;background:var(--panel-2);border-bottom:1px solid var(--border);font-size:11.5px;font-weight:650;color:var(--muted)}
.lv-body{display:flex;flex-direction:column}
.lv-row{padding:7px 14px;border-bottom:1px solid var(--border-2);font-size:13px}
.lv-row:hover{background:var(--panel-2)}
.lv-row:last-child{border-bottom:0}
/* —— 列表视图：拖动整行上下移动（被拖的行脱离文档流跟着光标，占位条在列表里实时换位） —— */
.lv-body{position:relative}
.lv-row.drag-row{position:absolute;left:0;right:0;z-index:9;border-radius:9px;pointer-events:none;
  background:var(--panel);box-shadow:var(--shadow-lg);border-bottom-color:transparent;opacity:.97}
.lv-row.ph{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent);border-radius:9px;border-bottom-color:transparent;opacity:.75}
.lv-row.selrow{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.lv-row.done .lv-title .tt{color:var(--muted);text-decoration:line-through}
.lv-title{display:flex;align-items:center;gap:7px;min-width:0}
.lv-title .tw{
  width:17px;height:17px;flex:0 0 auto;border-radius:5px;border:1px solid var(--border);
  display:grid;place-items:center;font-size:9px;cursor:pointer;color:var(--text-2);line-height:1;background:var(--panel);
}
.lv-title .tw:hover{border-color:var(--accent);color:var(--accent)}
.lv-title .tw.hidden{visibility:hidden}
.lv-title .tt{cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.lv-title .tt:hover{color:var(--accent)}
.lv-title .pdot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.lv-title .sub{font-size:11px;color:var(--muted);flex:0 0 auto}
/* 用时列：进行中 = 强调色（还在增长）；已完成 = 普通色 + 锁定图标（天数固定） */
.lv-span{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--text-2);min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:help}
.lv-span .n{font-weight:650;font-variant-numeric:tabular-nums}
.lv-span.live{color:var(--accent)}
.lv-span.locked{color:var(--text-2)}
.lv-span .k{font-size:10px;opacity:.75}
.lv-span.none{color:var(--muted)}
.lv-actions{display:flex;gap:3px;justify-content:flex-end;opacity:0;transition:.14s}
.lv-row:hover .lv-actions{opacity:1}
.lv-actions .btn{width:25px;height:25px;padding:0;font-size:13px;color:var(--text-2)}
.lv-group{
  display:flex;align-items:center;gap:9px;padding:9px 14px;background:var(--panel-2);
  border-bottom:1px solid var(--border);font-size:13px;font-weight:650;position:sticky;top:0;z-index:2;
}
.lv-group .bar{width:110px;flex:0 0 auto}
.lv-group .gsub{font-size:11.5px;color:var(--muted);font-weight:500}
.lv-group .gcnt{margin-left:auto;font-size:11.5px;color:var(--muted);font-weight:500}
@media(max-width:1080px){
  .lv-head,.lv-row{grid-template-columns:var(--lv-cols,minmax(150px,1fr) 92px 70px 104px 104px 64px 62px 66px);gap:6px}
}
@media(max-width:880px){
  .lv-head{display:none}
  .lv-row{grid-template-columns:1fr;gap:8px;padding:11px 14px}
  .lv-actions{opacity:1}
}

/* ============ 自定义状态 ============ */
.float-menu{
  position:fixed;z-index:300;min-width:190px;max-height:62vh;overflow:auto;padding:5px;
  background:var(--panel);border:1px solid var(--border);border-radius:11px;
  box-shadow:var(--shadow-lg);animation:pop .12s ease-out;
}
.float-menu .mi{
  display:flex;align-items:center;gap:8px;width:100%;padding:7px 9px;border:0;background:transparent;
  border-radius:7px;font-size:13px;cursor:pointer;text-align:left;color:var(--text);
}
.float-menu .mi:hover{background:var(--panel-3)}
.float-menu .mi.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.float-menu .mi .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.float-menu .mi .tag{font-size:10px;color:var(--muted);border:1px solid var(--border);border-radius:99px;padding:0 5px;line-height:15px;flex:0 0 auto}
.float-menu .mi .ck{font-size:11px;flex:0 0 auto}
.float-menu.colors{display:grid;grid-template-columns:repeat(4,26px);gap:8px;padding:9px;min-width:0;overflow:visible;width:auto}
.float-menu.colors .sw{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.float-menu.colors .sw.on{border-color:var(--text)}

.st-pill{
  display:inline-flex;align-items:center;gap:5px;height:21px;padding:0 8px;border-radius:999px;
  border:1px solid var(--border);font-size:11.5px;font-weight:600;cursor:pointer;max-width:160px;
  background:var(--panel-3);color:var(--text-2);
}
.st-pill:hover{border-color:var(--muted);color:var(--text)}
.st-pill .dt{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.st-pill .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill.status{background:var(--panel-3);color:var(--text-2)}

.kb-col.scoped .kb-head .sc{font-size:10px;color:var(--muted);border:1px solid var(--border);border-radius:99px;padding:0 6px;line-height:16px;flex:0 0 auto;max-width:74px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kb-addcol{flex:0 0 170px;display:flex;flex-direction:column;gap:9px;padding-top:4px}
.kb-addcol button{
  width:100%;height:38px;border:1px dashed var(--border);background:transparent;color:var(--muted);
  border-radius:11px;cursor:pointer;font-size:12.5px;transition:.14s;
}
.kb-addcol button:hover{border-color:var(--accent);color:var(--accent);background:var(--panel)}
.kb-addcol .hint{font-size:11px;color:var(--muted);text-align:center;line-height:1.5}

.st-row{
  display:grid;grid-template-columns:26px minmax(110px,1.1fr) 108px 122px 1fr auto;gap:8px;align-items:center;
  padding:8px;border:1px solid var(--border);border-radius:10px;background:var(--panel-2);
}
.st-row.core{background:var(--panel)}
/* 刚创建出来的那一行：边框亮一下，告诉用户「新状态在这儿」（1.5s 后由 JS 摘掉 class） */
.st-row.just{border-color:var(--accent);animation:stJust 1.5s ease-out}
@keyframes stJust{
  0%{box-shadow:0 0 0 3px var(--accent-soft),0 0 0 1.5px var(--accent)}
  65%{box-shadow:0 0 0 3px var(--accent-soft),0 0 0 1.5px var(--accent)}
  100%{box-shadow:0 0 0 0 rgba(0,0,0,0),0 0 0 0 rgba(0,0,0,0)}
}
.st-row .sw-btn{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);cursor:pointer;padding:0}
.st-row .projs{display:flex;flex-wrap:wrap;gap:4px;min-width:0}
.st-row .projs .none{font-size:11px;color:var(--muted)}
.st-row .pchip{
  font-size:11px;padding:2px 7px;border-radius:99px;border:1px solid var(--border);background:var(--panel);
  cursor:pointer;color:var(--text-2);white-space:nowrap;
}
.st-row .pchip.on{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:600}
.st-row .ops{display:flex;gap:3px;justify-content:flex-end}
.st-row .ops button{
  width:24px;height:24px;border:1px solid var(--border);background:var(--panel);border-radius:6px;
  cursor:pointer;color:var(--text-2);font-size:12px;padding:0;line-height:1;
}
.st-row .ops button:hover{border-color:var(--accent);color:var(--accent)}
.st-row .ops button.del:hover{border-color:var(--danger);color:var(--danger);background:var(--danger-soft)}
.st-sec{font-size:11.5px;font-weight:650;color:var(--muted);letter-spacing:.4px;padding:4px 2px 0}
.linkbtn{background:none;border:0;color:var(--accent);font-size:11.5px;cursor:pointer;padding:0;font-weight:600}
.linkbtn:hover{text-decoration:underline}
@media(max-width:780px){
  .st-row{grid-template-columns:26px 1fr auto;grid-auto-rows:auto}
  .st-row .projs{grid-column:1/-1}
}

/* ============ 完成时间统计 ============ */
.trend{display:flex;align-items:flex-end;gap:3px;height:76px;padding-top:6px}
.trend .b{flex:1 1 0;background:linear-gradient(180deg,var(--accent-2),var(--accent));border-radius:3px 3px 0 0;min-height:2px}
.trend .b.zero{background:var(--panel-3)}
.trend-x{display:flex;gap:3px;margin-top:5px;font-size:10px;color:var(--muted)}
.trend-x span{flex:1 1 0;text-align:center}
.mstat{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:780px){.mstat{grid-template-columns:repeat(2,1fr)}}
.mstat .m{background:var(--panel-2);border:1px solid var(--border-2);border-radius:10px;padding:9px 11px;min-width:0}
.mstat .m .k{font-size:11px;color:var(--muted);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mstat .m .v{font-size:19px;font-weight:700;letter-spacing:-.6px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mstat .m .v small{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:0}
.mstat .m .v.up{color:var(--ok)}
.mstat .m .v.down{color:var(--danger)}
.doneline{display:flex;align-items:center;gap:9px;padding:7px 2px;border-bottom:1px solid var(--border-2);font-size:12.5px}
.doneline:last-child{border-bottom:0}
.doneline .tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.doneline .tt:hover{color:var(--accent)}
.doneline .tm{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;flex:0 0 auto}
.g-name .st-dot{
  width:13px;height:13px;border-radius:50%;border:2px solid var(--panel);padding:0;cursor:pointer;
  flex:0 0 auto;transition:.14s;
}
.g-name .st-dot:hover{transform:scale(1.25)}
.alert-item .st-pill{flex:0 0 auto}

/* ==================== 左侧设置抽屉 ==================== */
/* 顶栏左上角那颗「设置」按钮（点它从左边拉出设置栏） */
.side-tab{flex:0 0 auto;height:32px;padding:0 11px;gap:6px;color:var(--text-2)}
.side-tab .ic{font-size:14px;line-height:1}
.side-tab .tx{font-size:12.5px;letter-spacing:.4px}
.side-tab:hover{border-color:var(--accent);color:var(--accent)}
.side-tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.side-tab.on:hover{color:#fff}
.side{
  position:fixed;left:0;top:0;bottom:0;width:322px;z-index:70;
  background:var(--panel);border-right:1px solid var(--border);box-shadow:var(--shadow-lg);
  display:flex;flex-direction:column;transform:translateX(-102%);
  transition:transform .22s cubic-bezier(.4,0,.2,1);visibility:hidden;
}
.side.open{transform:none;visibility:visible}
.side-head{display:flex;align-items:center;gap:7px;padding:12px 14px;border-bottom:1px solid var(--border);flex:0 0 auto}
.side-title{font-size:13.5px;font-weight:700;color:var(--text);letter-spacing:.2px}
.side-head .spacer{flex:1}
.side-btn{
  width:29px;height:29px;border:1px solid var(--border);background:var(--panel);color:var(--text-2);
  border-radius:8px;cursor:pointer;font-size:13px;line-height:1;display:grid;place-items:center;padding:0;transition:.14s;
}
.side-btn:hover{border-color:var(--accent);color:var(--accent)}
.side-btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.side-body{flex:1;overflow:auto;padding:6px 14px 30px;overscroll-behavior:contain}
.side-sec{
  font-size:11px;font-weight:750;color:var(--muted);letter-spacing:.8px;
  margin:16px 0 6px;display:flex;align-items:center;gap:7px;
}
.side-sec::after{content:"";flex:1;height:1px;background:var(--border-2)}
.side-sec:first-child{margin-top:10px}
.side-row{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:12.5px;color:var(--text-2)}
.side-row+.side-row{border-top:1px dashed var(--border-2)}
.side-row .lbl{flex:1;min-width:0;line-height:1.35}
.side-row .lbl b{display:block;color:var(--text);font-weight:600;font-size:12.5px}
.side-row .sub{display:block;font-size:11px;color:var(--muted);line-height:1.5;margin-top:2px}
.side-row .switch{flex:0 0 auto}
.side-row .mono{font-size:11.5px;color:var(--muted);width:38px;text-align:right;flex:0 0 auto}
.side-box{border:1px solid var(--border);border-radius:11px;padding:10px;margin-top:6px;background:var(--panel-2)}
.side-btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.side-tpl{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.tpl-item{border:1px solid var(--border);border-radius:11px;padding:9px;background:var(--panel);display:flex;flex-direction:column;gap:8px}
.tpl-item.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tpl-item .rad{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--border);background:transparent;cursor:pointer;padding:0;flex:0 0 auto}
.tpl-item .rad.on{border-color:var(--accent);background:radial-gradient(circle,var(--accent) 0 4.5px,transparent 5px)}
.tpl-item .del{width:24px;height:24px;border:0;background:transparent;color:var(--muted);cursor:pointer;border-radius:7px;font-size:12px;flex:0 0 auto;line-height:1}
.tpl-item .del:hover{background:var(--danger-soft);color:var(--danger)}
.tpl-h{display:flex;align-items:center;gap:7px}
.tpl-h .inp{flex:1;min-width:0}
.tpl-b2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.tpl-b2 label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted)}
.tpl-b2 .inp{height:28px;font-size:12px}
.side-note{font-size:11px;color:var(--muted);line-height:1.6;margin-top:8px}
body.side-pinned #app{margin-left:322px;transition:margin-left .22s cubic-bezier(.4,0,.2,1)}
@media(max-width:980px){
  body.side-pinned #app{margin-left:0}
  .side{width:290px}
  body.side-pinned #app{margin-left:290px}
}
@media(max-width:760px){body.side-pinned #app{margin-left:0}}
