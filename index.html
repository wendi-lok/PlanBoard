/* ==================== 看板：拖动列头 = 整条状态列换位 ==================== */
let kbColBusy = false;
function bindKanbanColDrag(root, sc) {
  if (!root || !sc) return;
  const box = root;
  const addcol = box.querySelector('.kb-addcol');
  const colsNow = () => Array.from(box.children).filter(x => x.classList && x.classList.contains('kb-col'));
  const applyColOrder = () => {
    const ids = Array.from(box.querySelectorAll('.kb-col[data-status]')).map(c => c.dataset.status);
    const all = allStatuses();
    let changed = false;
    ids.forEach((id, i) => {
      const s = all.find(x => x.id === id);
      if (!s) return;
      const want = (i + 1) * 10;
      if (s.order !== want) { s.order = want; changed = true; }
    });
    if (!changed) { toast('列的顺序没有变化'); return; }
    commit('调整看板列顺序');
    toast('已调整看板列的顺序（可直接 Ctrl+Z 还原）');
  };
  $$('.kb-col', root).forEach(col => {
    const head = col.querySelector('.kb-head');
    if (!head) return;
    head.addEventListener('pointerdown', ev => {
      if (ev.button !== 0 || kbColBusy) return;
      if (ev.target.closest('button,a,input,select')) return;
      const x0 = ev.clientX, y0 = ev.clientY;
      let active = false, raf = 0, x = x0, y = y0;
      const onMove = e2 => {
        x = e2.clientX; y = e2.clientY;
        if (!active) {
          if (Math.abs(x - x0) < 6 && Math.abs(y - y0) < 6) return;
          active = true;
          kbColBusy = true;
          col.classList.add('col-drag');
          document.body.classList.add('coldrag', 'rowdrag');
          const ph = document.createElement('div');
          ph.className = 'kb-col kb-col-ph';
          ph.style.height = col.offsetHeight + 'px';
          box.insertBefore(ph, col.nextSibling);
          col.__ph = ph;
        }
        if (raf) return;
        raf = requestAnimationFrame(() => {
          raf = 0;
          const cur = colsNow();
          const me = cur.indexOf(col);
          const others = cur.filter(el => el !== col);
          let k = 0;
          others.forEach(el => {                      /* 只读一轮，读完再写，避免布局抖动 */
            const r = el.getBoundingClientRect();
            if (r.left + r.width / 2 < x) k++;

          if (k !== me) {
            const target = others[k];
            if (target) box.insertBefore(col, target);
            else if (addcol) box.insertBefore(col, addcol);
            else box.appendChild(col);
          }

        });

      const finish = () => {
        window.removeEventListener('pointermove', onMove);
        window.removeEventListener('pointerup', finish);
        window.removeEventListener('pointercancel', finish);
        if (raf) { cancelAnimationFrame(raf); raf = 0; }
        if (col.__ph) { col.__ph.remove(); col.__ph = null; }
        col.classList.remove('col-drag');
        document.body.classList.remove('coldrag', 'rowdrag');
        kbAutoStop();
        kbColBusy = false;
        if (active) applyColOrder();
      };
      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', finish);
      window.addEventListener('pointercancel', finish);
    });
  });
}

function renderKanban(root) {

function bindKanban(root) {

      kbAutoTrack(sc, e.clientX, e.clientY, col ? col.querySelector('.kb-list') : null);
    }, true);
    sc.addEventListener('dragleave', e => { if (!sc.contains(e.relatedTarget)) kbAutoStop(); });

  }
  $$('.kb-col', root).forEach(c => {
    const l = c.querySelector('.kb-list');
    if (!l) return;
    /* 量出列头 / 底部新增框高度，供靠边提示条定位到列表两端 */
    const head = c.querySelector('.kb-head'), quick = c.querySelector('.kb-quick');

    sub.addEventListener('click', ev => {

    });
    sub.addEventListener('dblclick', ev => {
      if (ev.target.closest('button')) return;

  });
  /* 展开 / 收起子任务 */

  $$('[data-kbadd]', root).forEach(btn => {

  $$('.kb-col', root).forEach(col => {

    col.addEventListener('dragleave', e => { if (!col.contains(e.relatedTarget)) col.classList.remove('over'); });
    col.addEventListener('drop', e => {
      e.preventDefault();
      col.classList.remove('over');
      kbAutoStop();
      const id = dragId || e.dataTransfer.getData('text/plain');
      const t = taskById(id);
      if (!t) return;
      const status = col.dataset.status;
      const cards = Array.from(col.querySelectorAll('.kb-card')).filter(c => c.dataset.task !== id);
      let idx = cards.length;
      for (let i = 0; i < cards.length; i++) {
        const r = cards[i].getBoundingClientRect();
        if (e.clientY < r.top + r.height / 2) { idx = i; break; }
      }
      const same = DB.tasks.filter(x => x.projectId === t.projectId && x.status === status && x.id !== id).sort(byOrder);
      const prev = same[idx - 1], next = same[idx];
      if (prev && next) t.order = (prev.order + next.order) / 2;
      else if (prev) t.order = prev.order + 5;
      else if (next) t.order = next.order - 5;
      const wasDone = isDone(t);
      applyStatusChange(t, status);
      commit();
      toast('「' + shortTitle(t.title) + '」→ ' + statusName(status) +
        (!wasDone && isDone(t) && t.doneAt ? '（' + fmtDT(t.doneAt) + ' 记录完成）' : ''));
    });

      const status = inp.dataset.quick;
      const st = statusById(status);
      if (!st) { toast('状态不存在，可能已被删除'); return; }
      const pid = UI.project === 'all' || UI.project === '__archived'
        ? (st.scope === 'project' ? (st.projectIds || [])[0] : (DB.projects.find(p => !p.archived) || {}).id)
        : UI.project;
      if (!pid) { toast('请先创建一个项目'); return; }
      const dn = st.mode === 'done';
      DB.tasks.push({
        id: uid(), projectId: pid, parentId: null, title: v, note: '', status, priority: 2,
        start: today(), end: addDays(today(), dn ? 0 : 4), progress: dn ? 100 : 0,
        hours: 0, milestone: false, deps: [], order: nextOrder(pid),
        doneAt: dn ? new Date().toISOString() : null

      commit();
      toast('已添加到「' + st.name + '」');
      setTimeout(() => { const el = root.querySelector('[data-quick="' + status + '"]'); if (el) el.focus(); }, 40);
    });
  });
}

/* ==================== 列表列宽（像 Excel 一样拖） ==================== */
const LV_COLS = ['任务', '状态', '优先级', '开始', '截止', '进度', '用时', ''];
const LV_W_DEF = [320, 104, 78, 112, 112, 96, 88, 72];

function lvColTemplate() {
  return LV_W_DEF.map((d, i) => {

    if (v >= 56) return Math.min(v, 900) + 'px';
    return i === 0 ? 'minmax(200px,1fr)' : d + 'px';

}
function lvSetWidth(i, px) {
  const w = clamp(Math.round(px), 56, 900);
  if (!Array.isArray(UI.lvW)) UI.lvW = LV_W_DEF.map(() => null);
  while (UI.lvW.length < LV_COLS.length) UI.lvW.push(null);
  UI.lvW[i] = w;

  if (root) root.style.setProperty('--lv-cols', lvColTemplate());

}
/* 双击拉手：把这一列缩到刚好放得下内容（用 canvas 量文字，再留一点内边距） */

function lvMeasure(s, font) {
  if (!__lvCtx) __lvCtx = document.createElement('canvas').getContext('2d');
  __lvCtx.font = font;
  return __lvCtx.measureText(String(s == null ? '' : s)).width;
}
function lvAutoFit(i) {
  const root = $('#lvRoot');
  if (!root) return;
  const pad = i === 0 ? 56 : 30;
  let w = lvMeasure(LV_COLS[i], '650 11.5px system-ui,-apple-system,"Segoe UI",sans-serif') + pad;
  $$('.lv-row', root).forEach(r => {
    const c = r.children[i];
    if (!c) return;
    let txt = '';
    if (i === 0) txt = (r.querySelector('.lv-title .tt') || {}).textContent || '';
    else txt = (c.textContent || '').trim();
    w = Math.max(w, lvMeasure(txt, '13px system-ui,-apple-system,"Segoe UI",sans-serif') + pad);
  });
  return lvSetWidth(i, Math.min(900, Math.ceil(w)));
}
function bindLvColResize(root) {
  const head = root.querySelector('.lv-head');
  if (!head) return;
  head.addEventListener('pointerdown', ev => {
    const h = ev.target.closest('[data-rz]');
    if (!h || ev.button !== 0) return;
    ev.preventDefault(); ev.stopPropagation();
    const i = Number(h.dataset.rz);
    const ref = head.children[i];
    if (!ref) return;
    const startX = ev.clientX;
    const startW = ref.getBoundingClientRect().width;
    h.classList.add('on');
    document.body.classList.add('colresize');
    const move = e2 => lvSetWidth(i, startW + (e2.clientX - startX));
    const up = () => {
      document.removeEventListener('pointermove', move);
      document.removeEventListener('pointerup', up);
      document.removeEventListener('pointercancel', up);
      document.body.classList.remove('colresize');
      saveUI();
      const b = root.querySelector('[data-rz="' + i + '"]');
      if (b) b.classList.remove('on');
    };
    document.addEventListener('pointermove', move);
    document.addEventListener('pointerup', up);
    document.addEventListener('pointercancel', up);
  });
  head.addEventListener('dblclick', ev => {
    const h = ev.target.closest('[data-rz]');
    if (!h) return;
    ev.preventDefault(); ev.stopPropagation();
    const i = Number(h.dataset.rz);
    lvAutoFit(i);
    saveUI();
    toast('「' + LV_COLS[i] + '」列宽已适应内容（' + UI.lvW[i] + 'px）');

}
function bindList(root) {

  $$('.lv-row', root).forEach(rowEl => {
    const t = taskById(rowEl.dataset.task);
    if (!t) return;
    rowEl.addEventListener('pointerdown', ev => {
      if (ev.button !== 0 || paintOn) return;
      if (ev.target.closest('button,a,input,select,label,.tw,.st-dot,.lv-rz')) return;
      ev.preventDefault();
      pickTask(t.id, ev, root);            /* 单击 = 高亮选中 */
      startRowReorder(ev, rowEl, t, {

  root.addEventListener('dblclick', e => {
    const row = e.target.closest('.lv-row[data-task]');
    if (!row) return;
    if (e.target.closest('button,a,input,select,label,.tw,.st-dot')) return;
    e.preventDefault();

  });

    const del = e.target.closest('[data-del]');

    if (open) { openTaskModal(open.dataset.open); return; }
  });

    const el = e.target.closest('[data-set]');
    if (!el) return;
    const row = el.closest('[data-task]');
    const t = taskById(row.dataset.task);
    if (!t) return;
    const key = el.dataset.set;
    if (key === 'status') {
      const wasDone = isDone(t);
      applyStatusChange(t, el.value);
      commit();
      if (!wasDone && isDone(t)) toast('已记录完成时间：' + fmtDT(t.doneAt));
      return;
    }
    if (key === 'priority') {
      t.priority = Number(el.value);
    } else {
      if (!el.value) return;
      if (key === 'start' && t.end && el.value > t.end) t.end = el.value;
      if (key === 'end' && t.start && el.value < t.start) t.start = el.value;
      t[key] = el.value;
    }
    commit();
  });
}
function deleteTask(id) {
  const t = taskById(id);
  if (!t) return;
  const kids = descendants(id);
  confirmBox('确定要删除「' + t.title + '」吗？' +
    (kids.length ? '\n其下 ' + kids.length + ' 个子任务会一并删除。' : '') +
    '\n删掉之后可以按 Ctrl+Z 撤销。',
    () => {
      const ids = new Set([id].concat(kids.map(k => k.id)));
      DB.tasks = DB.tasks.filter(x => !ids.has(x.id));
      DB.tasks.forEach(x => { x.deps = (x.deps || []).filter(d => !ids.has(d)); });
      ganttSel.delete(id);
      commit('删除任务');
      toast('已删除 ' + ids.size + ' 个任务');
    }, { title: '删除任务', okText: '确认删除' });
}
/* 批量删除（框选后按 Delete / 右键菜单） */
function deleteTasks(ids) {
  const list = Array.from(ids).map(taskById).filter(Boolean);
  if (!list.length) return;
  const all = new Set();
  list.forEach(t => { all.add(t.id); descendants(t.id).forEach(k => all.add(k.id)); });
  const extra = all.size - list.length;
  confirmBox('确定要删除选中的 ' + list.length + ' 个任务吗？' +
    (extra ? '\n其下另有 ' + extra + ' 个子任务会一并删除。' : '') +
    '\n删掉之后可以按 Ctrl+Z 撤销。',
    () => {
      DB.tasks = DB.tasks.filter(x => !all.has(x.id));
      DB.tasks.forEach(x => { x.deps = (x.deps || []).filter(d => !all.has(d)); });
      ganttSel = new Set();
      commit('批量删除 ' + list.length + ' 个任务');
      toast('已删除 ' + all.size + ' 个任务');
    }, { title: '删除选中任务', okText: '确认删除' });
}

/* —— 本机路径：浏览器的安全沙箱永远不给网页「文件的真实路径」（Chrome 早就删掉了 File.path），

      ★ 粘进来之后我们只做一件事：单击 = 把这个路径复制回剪贴板。
        不再做任何「打开文件 / 打开文件夹 / 唤起本机 Office」的尝试 ——

/* ---------- 单击附件的唯一入口 ---------- */
/* ★ 只有三条分支，没有第四条（2026-10-02 定稿，别再往里加「打开」）：
   · 'md' / 'pdf' → 弹出只读预览卡片（md 自己渲染；pdf 交给浏览器内置阅读器）；
   · 'link'       → 新标签打开网址；
   · 'path'       → 把这一行路径复制到剪贴板，完。 */

  if (!a) return;
  if (a.kind === 'link') {
    try { window.open(a.url, '_blank', 'noopener'); }
    catch (e) { copyText(a.url); toast('链接被浏览器拦了，网址已复制：' + a.url, 4200); }
    return;
  }
  if (a.kind === 'md' || a.kind === 'pdf') { openPreview(a); return; }
  const p = normLocalPath(a.path);
  if (!isAbsLocalPath(p)) { toast('这条附件还没有路径 —— 双击它就能补上'); return; }

/* 让用户把「文件 / 文件夹在硬盘上的绝对路径」粘进来。

        /* ★ 注意：field() 的 hint 会被 esc() 转义，这里只能写纯文本，不能塞 <b> */
        '两种拿法：① 在资源管理器里选中文件，按 Ctrl + Shift + C（Win11）；' +
        '或者 Shift + 右键它 →「复制文件地址」（Win10 / 11 都行）。' +
        '② 文件夹也一样 —— 把文件夹的地址复制过来就能加。带引号也认。') +
      '<div class="card-sub" style="font-size:12px;line-height:1.85;margin-top:9px">' +
        '加好之后：<b>单击这条附件 = 把这个路径复制到剪贴板</b>，' +
        '你到资源管理器里按 Ctrl + L、Ctrl + V、回车就能打开它所在的目录。<br>' +
        '文件本身不会被读进项目 —— 项目里只存这一行路径，所以既不占体积、也没有大小限制。<br>' +
        '<b>双击</b>附件行可以随时改这条路径。' +

/* ---------- Markdown 预览 ---------- */
/* 极简 Markdown 渲染器。够看就行，不追 CommonMark。
   ★ 预览的是「别人给的文件」，所以一律先整体 HTML 转义、再拼标签 —— 不能让 md 里的

/* 行内语法。传入的 s 必须已经过 esc()。

     否则自动链接规则会钻进 <a href="https://…"> 里面，拼出嵌套的破标签。 */
function inlineMd(s) {
  const keep = [];

  t = t.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (m, alt, u) => {

  t = t.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, txt, u) => {

/* 块级语法：围栏代码 / 标题 / 引用 / 有序无序列表 / 任务清单 / 表格 / 分隔线 / 段落 */
function mdToHtml(src) {

    out.push(mode === 'blockquote' ? '</blockquote>' : '</' + mode + '>');
    mode = '';

    if (!para.length) return;
    closeMode();
    out.push('<p>' + inlineMd(esc(para.join('\n'))).replace(/\n/g, '<br>') + '</p>');
    para = [];
  };
  const openMode = m => {
    if (mode === m) return;
    closeMode();
    mode = m;
    out.push(m === 'blockquote' ? '<blockquote>' : '<' + m + '>');
  };

      if (f) { out.push('<pre class="mdpre"><code>' + buf.join('\n') + '</code></pre>'); fence = false; buf = []; }
      else buf.push(esc(raw));
      continue;
    }
    if (f) { flushPara(); closeMode(); fence = true; buf = []; continue; }
    if (!line.trim()) { flushPara(); closeMode(); continue; }
    if (/^\s{0,3}([-*_])(\s*\1){2,}\s*$/.test(line)) { flushPara(); closeMode(); out.push('<hr>'); continue; }
    const h = line.match(/^\s{0,3}(#{1,6})\s+(.*?)\s*#*\s*$/);
    if (h) { flushPara(); closeMode(); const n = h[1].length;
      out.push('<h' + n + '>' + inlineMd(esc(h[2])) + '</h' + n + '>'); continue; }
    const q = line.match(/^\s{0,3}>\s?(.*)$/);
    if (q) { flushPara(); openMode('blockquote'); out.push('<p>' + inlineMd(esc(q[1])) + '</p>'); continue; }
    if (line.indexOf('|') >= 0 && i + 1 < S.length && isSep(S[i + 1])) {
      flushPara(); closeMode();
      const head = cells(line);
      i += 2;
      const rows = [];
      while (i < S.length && S[i].indexOf('|') >= 0 && S[i].trim()) { rows.push(cells(S[i])); i++; }
      i--;
      out.push('<table class="mdtable"><thead><tr>' +
        head.map(c => '<th>' + inlineMd(esc(c)) + '</th>').join('') + '</tr></thead><tbody>' +
        rows.map(r => '<tr>' + head.map((c, k) => '<td>' + inlineMd(esc(r[k] == null ? '' : r[k])) + '</td>').join('') + '</tr>').join('') +
        '</tbody></table>');
      continue;
    }
    const ul = line.match(/^\s{0,3}[-*+]\s+(.*)$/);
    const ol = line.match(/^\s{0,3}(\d+)[.)]\s+(.*)$/);
    if (ul || ol) {
      flushPara();
      openMode(ul ? 'ul' : 'ol');
      let body = ul ? ul[1] : ol[2], cls = '';
      const tsk = body.match(/^\[([ xX])\]\s+(.*)$/);
      if (tsk) { cls = ' class="mdtask' + (tsk[1].toLowerCase() === 'x' ? ' done' : '') + '"'; body = tsk[2]; }
      out.push('<li' + cls + '>' + inlineMd(esc(body)) + '</li>');
      continue;
    }
    if (mode && mode !== 'blockquote') closeMode();
    para.push(raw);
  }
  if (fence) out.push('<pre class="mdpre"><code>' + buf.join('\n') + '</code></pre>');
  flushPara(); closeMode();
  return out.join('\n');
}

/* ---------- Markdown 预览卡片 ----------

  const f = clamp(Math.round(Number(v) * 100) / 100, MD_FS_MIN, MD_FS_MAX);
  UI.mdFs = f;
  /* 滚轮会连发事件，落盘节流一下（内存里的值立刻就是新的） */
  clearTimeout(__mdFsSaveT);
  __mdFsSaveT = setTimeout(saveUI, 400);

  if (!card) return f;
  card.style.setProperty('--md-fs', (MD_FS_BASE * f).toFixed(2) + 'px');

  /* 点卡片外（也就是遮罩本身）关掉 —— 和模态框一个手感 */
  el.addEventListener('mousedown', ev => { if (ev.target === el) closeMdPreview(); });
  el.addEventListener('click', ev => {
    if (ev.target.closest('[data-mdprevx]')) { closeMdPreview(); return; }
    if (ev.target.closest('[data-mdprevopen]') && objUrl) {
      try { window.open(objUrl, '_blank', 'noopener'); }
      catch (e) { toast('新窗口被拦了 —— 也可以右键附件用浏览器菜单打开'); }
    }
  });
  /* ★ Ctrl + 滚轮：Markdown 用它缩放正文字号；PDF 的缩放由阅读器自己管。
     两种情况都要 preventDefault —— 不拦的话浏览器会把它当成「整页缩放」，
     结果整个界面变大，而不是预览里的内容变大。 */
  el.addEventListener('wheel', ev => {
    if (!ev.ctrlKey) return;
    ev.preventDefault();
    if (pdf) return;
    applyMdFs(mdFsNow() + (ev.deltaY < 0 ? MD_FS_STEP : -MD_FS_STEP), el.querySelector('.mdprev-card'));
  }, { passive: false });
}
/* 当前库里「内嵌的附件」（Markdown 笔记 + PDF）占用的字节数（估算，用于总量保护）。
   path / link 型几乎不占体积，不计入。 */
function attachmentsBytes() {
  let n = 0;
  DB.tasks.forEach(t => (t.attachments || []).forEach(a => {
    if (a.kind === 'md' || a.kind === 'pdf') n += String(a.url || '').length;
  }));
  return n;
}
/* 把一个本地文件读成「内嵌」附件（正文以 data URL 进项目文件）。
   失败也回调 cb(null)，好让调用方把计数收敛掉。 */
function readEmbeddedFile(f, kind, cb, max, label) {
  cb = cb || function () { };
  if (!f) { cb(null); return; }
  if (f.size > max) {
    toast('「' + f.name + '」' + fmtSize(f.size) + ' 超过单份' + label + '上限 ' + fmtSize(max) +
      '，建议拆成几份，或者把大文件改用「📋 粘贴文件路径」只存路径', 5200);
    cb(null); return;
  }
  const room = ATT_TOTAL_MAX - attachmentsBytes();
  if (f.size * 1.37 > room) {
    toast('内嵌附件的总量快满了（上限约 ' + fmtSize(ATT_TOTAL_MAX) + '），先删几份旧的再添加', 5000);
    cb(null); return;
  }
  const fr = new FileReader();
  fr.onload = () => cb({
    id: 'at' + uid(), kind, name: f.name || (kind === 'pdf' ? '文档.pdf' : '笔记.md'),
    url: String(fr.result || ''), size: f.size || 0, mime: f.type || '',
    path: '', addedAt: new Date().toISOString()
  });
  fr.onerror = () => { toast('读取「' + f.name + '」失败，换个文件试试'); cb(null); };
  fr.readAsDataURL(f);
}
/* 一份 Markdown 笔记 */
function readMdAttachment(f, cb) {
  cb = cb || function () { };
  if (f && MD_EXTS.indexOf(extOfName(f.name)) < 0) {
    toast('「' + f.name + '」不是 Markdown 笔记 —— 其它格式请用「📋 粘贴文件路径」加进来', 4600);
    cb(null); return;
  }
  readEmbeddedFile(f, 'md', cb, ATT_FILE_MAX, '笔记');
}
/* 一份 PDF */
function readPdfAttachment(f, cb) {
  cb = cb || function () { };
  if (f && PDF_EXTS.indexOf(extOfName(f.name)) < 0) {
    toast('「' + f.name + '」不是 PDF —— 其它格式请用「📋 粘贴文件路径」加进来', 4600);
    cb(null); return;
  }
  readEmbeddedFile(f, 'pdf', cb, ATT_PDF_MAX, ' PDF ');
}
/* 弹一个小窗问「名称 + 网址」（加外部链接用） */

      /* 路径型附件：加一条 / 改一条，只有这两个动作，没有任何「打开」 */
      const addByPath = p => {
        const q = normLocalPath(p);

          id: 'at' + uid(), kind: 'path', name: pathLeaf(q), url: '', size: 0, mime: '',

      const addNoteFiles = list => {
        const arr = Array.prototype.slice.call(list || []);

          }

      const fileEl = mask.querySelector('#fAttFile'), dropEl = mask.querySelector('#fAttDrop');

        ev.stopPropagation();
        askFilePath({ onOk: addByPath });
      });
      mask.querySelector('#fAttLink').addEventListener('click', ev => {
        ev.stopPropagation();
        askLink(a => { atts.push(a); paintAtts(); toast('已添加链接「' + a.name + '」'); });
      });
      /* 文件拖进这个区域：只有 Markdown 会被收下，别的当场提示去用「粘贴文件路径」。
         必须拦住冒泡，否则会被 document 级的「拖文件进页面打开项目」抢走。 */
      const hasFiles = ev => ev.dataTransfer && Array.prototype.indexOf.call(ev.dataTransfer.types || [], 'Files') >= 0;
      ['dragenter', 'dragover'].forEach(k => dropEl.addEventListener(k, ev => {
        if (!hasFiles(ev)) return;
        ev.preventDefault(); ev.stopPropagation(); dropEl.classList.add('over');
      }));
      dropEl.addEventListener('dragleave', ev => { ev.stopPropagation(); dropEl.classList.remove('over'); });
      dropEl.addEventListener('drop', ev => {
        if (!ev.dataTransfer || !ev.dataTransfer.files || !ev.dataTransfer.files.length) return;
        ev.preventDefault(); ev.stopPropagation();
        dropEl.classList.remove('over');
        addNoteFiles(ev.dataTransfer.files);
      });
      /* 状态下拉：通用状态 + 该项目专属状态；切项目时同步刷新 */
      const fillStatus = (pid, keep) => {
        const list = scopeStatuses(pid);
        const cur = statusById(keep);
        if (cur && !list.some(s => s.id === cur.id)) list.push(cur);
        selSt.innerHTML = list.map(s =>
          '<option value="' + s.id + '"' + (keep === s.id ? ' selected' : '') + '>' + esc(s.name) +
          (s.scope === 'global' ? '（通用）' : '（项目专属）') + '</option>').join('');
      };
      const paintStHint = () => {
        const s = statusById(selSt.value);
        stHint.textContent = s ? '状态类型：' + ST_MODE[s.mode] +
          (s.mode === 'done' ? ' · 会记录完成时间并计入完成率' : ' · 不计入完成率') : '';
        /* 完成时间 + 用时：用时按表单里当前的开始日期实时算，任务完成后天数锁死 */
        const doneNow = !!(s && s.mode === 'done');
        const sEl = mask.querySelector('#fStart');
        const sv = sEl ? sEl.value : '';
        let html = doneNow
          ? '<span style="color:var(--ok);font-weight:600">已于 ' + fmtDT(t.doneAt || new Date().toISOString()) + ' 完成</span>'
          : '任务状态变为「已完成」类型时，会自动记录时间并计入完成统计。';
        if (!sv) {
          html += '<br><span style="color:var(--muted)">未填开始日期，暂无用时</span>';
        } else {
          const refD = doneNow ? (t.doneAt ? fmtD(t.doneAt) : today()) : today();
          const dd = Math.max(0, diffDays(sv, refD));
          html += '<br>用时 <b style="color:' + (doneNow ? 'var(--text-2)' : 'var(--accent)') + '">' +
            dayWord(dd) + '</b>' +
            '<span style="color:var(--muted)">　' + esc(sv) + ' → ' + esc(refD) + '</span>' +
            '<span style="color:var(--muted)">　' + (doneNow ? '已完成，天数已固定' : '进行中，完成时固定') + '</span>';
        }
        doneInfo.innerHTML = html;
      };
      fillStatus(t.projectId, t.status);
      paintStHint();
      selSt.addEventListener('change', () => {
        const s = statusById(selSt.value);
        if (s && s.mode === 'done') { pct.value = 100; lab.textContent = '100%'; }
        paintStHint();
      });
      mask.querySelector('#fProj').addEventListener('change', e => { fillStatus(e.target.value, selSt.value); paintStHint(); paintCol(); });
      /* —— 任务条颜色：跟随项目 / 调色板 / 完整 RGB 取色器 —— */
      let taskColor = t.color || null;
      const colBox = mask.querySelector('#fColors');
      const paintCol = () => {
        if (!colBox) return;
        const pj = projById(mask.querySelector('#fProj').value) || {};
        const base = taskColor || pj.color || PALETTE[0];
        const projBtn = colBox.querySelector('[data-fc="__proj"]');
        if (projBtn) { projBtn.style.background = pj.color || PALETTE[0]; projBtn.classList.toggle('on', !taskColor); }
        $$('[data-fc]', colBox).forEach(b => {
          if (b.dataset.fc !== '__proj') b.classList.toggle('on', taskColor === b.dataset.fc);
        });
        const lab = colBox.querySelector('.cpick');
        if (lab) {
          lab.classList.toggle('on', !!taskColor && !PALETTE.includes(taskColor));
          const dot = lab.querySelector('i'); if (dot) dot.style.background = base;
          const inp = lab.querySelector('input'); if (inp && inp.value !== to6(base)) inp.value = to6(base);
        }
      };
      if (colBox) {
        colBox.addEventListener('click', ev => {
          const b = ev.target.closest('[data-fc]');
          if (!b) return;
          taskColor = b.dataset.fc === '__proj' ? null : b.dataset.fc;
          paintCol();
        });
        const fPick = colBox.querySelector('#fPick');
        if (fPick) {
          const useC = () => { const h = normHex(fPick.value); if (h) { taskColor = h; paintCol(); } };
          fPick.addEventListener('input', useC);
          fPick.addEventListener('change', useC);
        }
        paintCol();
      }
      /* —— 条上文字颜色：自动 / 白 / 深墨 / 任意 RGB。null = 自动（按条身明暗算） —— */
      let taskTxt = normHex(t.textColor);
      const txtBox = mask.querySelector('#fTxtColors');
      const paintTxt = () => {
        if (!txtBox) return;
        const autoBtn = txtBox.querySelector('[data-ftc="__auto"]');
        if (autoBtn) autoBtn.classList.toggle('on', !taskTxt);
        $$('[data-ftc]', txtBox).forEach(b => {
          if (b.dataset.ftc !== '__auto') b.classList.toggle('on', taskTxt === normHex(b.dataset.ftc));
        });
        const lab = txtBox.querySelector('.cpick');
        if (lab) {
          lab.classList.toggle('on', !!taskTxt && ['#ffffff', '#16202c'].indexOf(taskTxt) < 0);
          const dot = lab.querySelector('i'); if (dot) dot.style.background = taskTxt || '#ffffff';
          const inp = lab.querySelector('input'); if (inp && inp.value !== to6(taskTxt)) inp.value = to6(taskTxt);
        }
      };
      if (txtBox) {
        txtBox.addEventListener('click', ev => {
          const b = ev.target.closest('[data-ftc]');
          if (!b) return;
          taskTxt = b.dataset.ftc === '__auto' ? null : normHex(b.dataset.ftc);
          paintTxt();
        });
        const tp = txtBox.querySelector('#fTxtPick');
        if (tp) {
          const useT = () => { const h = normHex(tp.value); if (h) { taskTxt = h; paintTxt(); } };
          tp.addEventListener('input', useT);
          tp.addEventListener('change', useT);
        }
        paintTxt();
      }
      mask.querySelector('#fStManage').addEventListener('click', () => openStatusModal(null, () => {
        fillStatus(mask.querySelector('#fProj').value, selSt.value);
        paintStHint();
      }, { stack: true }));
      pct.addEventListener('input', () => { lab.textContent = pct.value + '%'; });
      const aoEl = mask.querySelector('#fAutoOpen');
      if (aoEl) aoEl.addEventListener('change', () => {
        UI.autoOpen = aoEl.checked; saveUI(); renderTools();
        toast(aoEl.checked
          ? '已开启：拖动圆点新建任务后会弹出这个窗口'
          : '已关闭：拖动圆点新建任务不再弹窗，会自动套用「默认模板」');
      });
      /* 套用模板：把模板里的名称 / 工期 / 状态 / 优先级 / 工时 / 备注填进表单 */
      const tplSel = mask.querySelector('#fTpl');
      if (tplSel) tplSel.addEventListener('change', () => {
        if (!tplSel.value) return;
        const tp = tplById(tplSel.value);
        if (!tp) return;
        applyTplToForm(tp);
        toast('已套用模板「' + tp.name + '」');
      });
      function applyTplToForm(tp) {
        if (tp.title) mask.querySelector('#fTitle').value = tp.title;
        mask.querySelector('#fPrio').value = String(tp.priority);
        mask.querySelector('#fHours').value = tp.hours || 0;
        mask.querySelector('#fNote').value = tp.note || '';
        mask.querySelector('#fMs').checked = !!tp.milestone;
        const startEl = mask.querySelector('#fStart');
        const days = Math.max(1, tp.days);
        const s = startEl.value || today();
        startEl.value = s;
        mask.querySelector('#fEnd').value = addDays(s, days - 1);
        const st = statusById(tp.status);
        if (st) {
          fillStatus(mask.querySelector('#fProj').value, tp.status);
          selSt.value = tp.status;
          if (st.mode === 'done') { pct.value = 100; lab.textContent = '100%'; }
          paintStHint();
        }
      }
      if (isParent) {
        ['#fStart', '#fEnd'].forEach(sel => {
          const el = mask.querySelector(sel);
          el.style.opacity = '.6';
        });
      }
      /* 改了开始日期 → 「用时」立刻重算 */
      ['#fStart', '#fEnd'].forEach(sel => {
        const el = mask.querySelector(sel);
        if (el) el.addEventListener('change', paintStHint);
      });
      const del = mask.querySelector('#fDel');
      if (del) del.addEventListener('click', () => { closeModal(); deleteTask(t.id); });
      mask.querySelector('#fSave').addEventListener('click', () => {
        const title = mask.querySelector('#fTitle').value.trim();
        if (!title) { toast('请填写任务名称'); mask.querySelector('#fTitle').focus(); return; }
        const oldProj = t.projectId;
        const wasDone = isDone(t);
        t.title = title;
        t.projectId = mask.querySelector('#fProj').value;
        t.parentId = mask.querySelector('#fParent').value || null;
        const newStatus = selSt.value;
        t.priority = Number(mask.querySelector('#fPrio').value);
        t.hours = Number(mask.querySelector('#fHours').value) || 0;
        if (!isParent) {
          const s = mask.querySelector('#fStart').value || today();
          const e = mask.querySelector('#fEnd').value || s;
          t.start = s; t.end = e < s ? s : e;
        }
        let p = Number(pct.value);
        applyStatusChange(t, newStatus);
        const sm = statusById(newStatus);
        if (sm && sm.mode === 'done') p = 100;
        if (sm && sm.mode === 'todo' && p >= 100) p = 0;
        t.progress = clamp(p, 0, 100);
        t.milestone = mask.querySelector('#fMs').checked;
        if (t.milestone && t.end !== t.start) t.end = t.start;
        t.note = mask.querySelector('#fNote').value;
        t.color = taskColor;
        t.textColor = taskTxt;
        t.deps = $$('#fDeps input:checked', mask).map(x => x.value);
        t.attachments = atts;
        if (t.projectId !== oldProj) {
          t.order = nextOrder(t.projectId);
          descendants(t.id).forEach(k => { k.projectId = t.projectId; });
        }
        if (isNew) {
          t.order = t.order || nextOrder(t.projectId);
          revealTask(t);                 /* 建完得能看见：分组 / 祖先收着的话先展开 */
          DB.tasks.push(t);
        }
        closeModal();
        commit();
        toast(isNew ? '任务已创建'
          : (!wasDone && isDone(t) && t.doneAt ? '任务已完成 · 于 ' + fmtDT(t.doneAt) + ' 记录' : '任务已保存'));
      });
    }
  });
}

/* ==================== 十一、项目管理 ==================== */
function openProjectModal() {
  const rows = DB.projects.map(p => {
    const st = projStats(p.id);
    return '<div style="border:1px solid var(--border);border-radius:11px;padding:12px;display:flex;flex-direction:column;gap:10px"' + (p.archived ? ' data-arch="1"' : '') + '>' +
      '<div style="display:flex;gap:9px;align-items:center">' +
        '<span class="dot" style="width:11px;height:11px;background:' + p.color + '"></span>' +
        '<input class="inp" data-pname="' + p.id + '" value="' + esc(p.name) + '" maxlength="60" style="flex:1">' +
        '<span class="pill gray">' + st.total + ' 项 · ' + st.progress + '%</span>' +
        '<button class="btn sm" data-ptoggle="' + p.id + '">' + (p.archived ? '取消归档' : '归档') + '</button>' +
        '<button class="btn sm danger" data-pdel="' + p.id + '" title="删除项目及其全部任务">删除</button>' +
      '</div>' +
      '<div class="row3">' +
        '<input type="date" class="inp sm" data-pstart="' + p.id + '" value="' + (p.start || '') + '">' +
        '<input type="date" class="inp sm" data-pend="' + p.id + '" value="' + (p.end || '') + '">' +
        '<input class="inp sm" data-pdesc="' + p.id + '" value="' + esc(p.desc || '') + '" placeholder="项目说明（可选）">' +
      '</div>' +
      '<div class="color-pick">' + PALETTE.map(c =>
        '<button data-pcolor="' + p.id + '" data-c="' + c + '" class="' + (p.color === c ? 'on' : '') + '" style="background:' + c + '" title="' + c + '"></button>').join('') +
        '<label class="cpick' + (normHex(p.color) && !PALETTE.includes(normHex(p.color)) ? ' on' : '') + '" title="自定义颜色：点开是完整 RGB 取色器，想选什么色都行">' +
          '<input type="color" data-pcol2="' + p.id + '" value="' + to6(p.color) + '"><i style="background:' + (p.color || PALETTE[0]) + '"></i></label>' +
      '</div>' +
    '</div>';
  }).join('');

  const addBox = '<div style="border:1px dashed var(--border);border-radius:11px;padding:12px;display:flex;flex-direction:column;gap:10px">' +
    '<div style="display:flex;gap:8px"><input class="inp" id="npName" placeholder="新项目名称，例如：Q4 产品迭代" maxlength="60">' +
    '<button class="btn primary" id="npAdd" style="flex:0 0 auto">创建项目</button></div>' +
    '<div class="color-pick" id="npColors">' + PALETTE.map((c, i) =>
      '<button data-c="' + c + '" class="' + (i === 0 ? 'on' : '') + '" style="background:' + c + '"></button>').join('') +
      '<label class="cpick" title="自定义颜色：点开是完整 RGB 取色器"><input type="color" id="npPick" value="' + PALETTE[0] +
      '"><i style="background:' + PALETTE[0] + '"></i></label></div>' +
  '</div>';

  openModal({
    title: '项目管理',
    wide: true,
    body: '<div style="display:flex;flex-direction:column;gap:12px">' +
      (rows || '<div class="card-sub">还没有项目，先在下面创建一个。</div>') + addBox + '</div>',
    foot: '<button class="btn" data-close>完成</button>',
    onMount(mask) {
      let newColor = PALETTE[0];
      mask.querySelector('#npColors').addEventListener('click', e => {
        const b = e.target.closest('[data-c]'); if (!b) return;
        newColor = b.dataset.c;
        $$('#npColors button', mask).forEach(x => x.classList.toggle('on', x === b));
      });
      mask.querySelector('#npAdd').addEventListener('click', () => {
        const name = mask.querySelector('#npName').value.trim();
        if (!name) { toast('请填写项目名称'); return; }
        const p = { id: uid(), name, color: newColor, start: today(), end: addDays(today(), 30), desc: '', archived: false };
        DB.projects.push(p);
        save(); render(); closeModal(); openProjectModal();
        toast('项目「' + name + '」已创建');
      });
      mask.addEventListener('click', e => {
        const del = e.target.closest('[data-pdel]');
        if (del) {
          const p = projById(del.dataset.pdel);
          const n = DB.tasks.filter(t => t.projectId === p.id).length;
          confirmBox('确定删除项目「' + p.name + '」吗？\n其下 ' + n + ' 个任务会一并删除，且不可撤销。', () => {
            DB.projects = DB.projects.filter(x => x.id !== p.id);
            DB.tasks = DB.tasks.filter(t => t.projectId !== p.id);
            if (UI.project === p.id) UI.project = 'all';
            saveUI(); save(); render(); closeModal(); openProjectModal();
            toast('项目已删除');
          }, { title: '删除项目', okText: '确认删除' });
          return;
        }
        const tg = e.target.closest('[data-ptoggle]');
        if (tg) {
          const p = projById(tg.dataset.ptoggle);
          p.archived = !p.archived;
          save(); render(); closeModal(); openProjectModal();
          toast(p.archived ? '项目已归档' : '项目已恢复');
          return;
        }
        const col = e.target.closest('[data-pcolor]');
        if (col) {
          const p = projById(col.dataset.pcolor);
          p.color = col.dataset.c;
          save(); render();
          $$('[data-pcolor="' + p.id + '"]', mask).forEach(x => x.classList.toggle('on', x.dataset.c === p.color));
          return;
        }
      });
      mask.addEventListener('change', e => {
        const el = e.target;
        /* 完整 RGB 取色器：给已有项目换色 / 给新项目定色 */
        if (el.dataset && el.dataset.pcol2) {
          const p = projById(el.dataset.pcol2);
          const h = normHex(el.value);
          if (p && h) {
            p.color = h; save(); render();
            $$('[data-pcolor="' + p.id + '"]', mask).forEach(x => x.classList.toggle('on', x.dataset.c === h));
            const lab = el.closest('.cpick');
            if (lab) { const dot = lab.querySelector('i'); if (dot) dot.style.background = h; lab.classList.toggle('on', !PALETTE.includes(h)); }
          }
          return;
        }
        if (el.id === 'npPick') {
          const h = normHex(el.value);
          if (h) {
            newColor = h;
            $$('#npColors button', mask).forEach(x => x.classList.remove('on'));
            const lab = el.closest('.cpick');
            if (lab) { const dot = lab.querySelector('i'); if (dot) dot.style.background = h; lab.classList.add('on'); }
          }
          return;
        }
        const map = { pname: 'name', pstart: 'start', pend: 'end', pdesc: 'desc' };
        for (const k in map) {
          if (el.dataset[k]) {
            const p = projById(el.dataset[k]);
            if (p) { p[map[k]] = el.value; save(); render(); }
            return;
          }
        }
      });
    }
  });
}

/* ==================== 十二、导入导出 ==================== */
function download(name, text, mime) {
  const blob = new Blob([text], { type: (mime || 'text/plain') + ';charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
  toast('已导出：' + name);
}
function exportJSON() {
  download('planboard-备份-' + today() + '.json',
    JSON.stringify({
      app: 'PlanBoard', version: 2, exportedAt: new Date().toISOString(),
      projects: DB.projects, statuses: DB.statuses, tasks: DB.tasks,
      templates: DB.templates, paint: DB.paint, ui: UI
    }, null, 2),
    'application/json');
}
function exportCSV() {
  const head = ['项目', '父任务', '任务名称', '状态', '状态类型', '优先级', '开始', '截止', '完成度%', '完成时间', '用时(天)', '预估工时', '里程碑', '前置依赖', '备注'];
  const rows = [head].concat(DB.tasks.map(t => {
    const p = projById(t.projectId) || {};
    const par = t.parentId ? ((taskById(t.parentId) || {}).title || '') : '';
    const s = statusById(t.status) || {};
    const dd = t.doneAt ? fmtD(t.doneAt) : '';
    const sp = taskSpanDays(t);
    return [p.name || '', par, t.title, s.name || t.status, ST_MODE[s.mode] || '', (PRIO[t.priority] || {}).n || '', t.start || '', t.end || '',
      isDone(t) ? 100 : (t.progress || 0), dd, sp == null ? '' : sp, t.hours || 0, t.milestone ? '是' : '',
      (t.deps || []).map(d => (taskById(d) || {}).title || '').filter(Boolean).join(' / '), t.note || ''];
  }));
  const csv = rows.map(r => r.map(v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"').join(',')).join('\r\n');
  download('planboard-任务清单-' + today() + '.csv', '\ufeff' + csv, 'text/csv');
}

/* ==================== 十二·B、项目文件系统（.planboard）与标签页 ==================== */
/* 一个项目 = 一个标签页 = 一个 .planboard 文件（里面装这个项目的全部内容）。
   支持 File System Access API 时就地读写（能自选保存位置）；不支持就退回「下载 / 选文件」。 */
const PB_EXT = '.planboard';
const PB_KIND = 'planboard-project';
const PB_VERSION = 3;
const LS_FILES = 'planboard.files.v1';
const LS_CLOSED = 'planboard.closed.v1';
const FSA_SAVE = typeof window.showSaveFilePicker === 'function';
const FSA_OPEN = typeof window.showOpenFilePicker === 'function';

let FILEMAP = {};        /* pid → { name, hash, at }：这个标签页对应哪个文件、内容是否还是文件里那份 */
let FILEHANDLE = {};     /* pid → FileSystemFileHandle：只在本次会话里有效，刷新后需要重新「另存为」 */
let CLOSED = [];         /* 最近关掉的标签页，可以「恢复最近关闭」捡回来 */
let dirtyCache = { rev: -1, map: {} };

function loadFileMeta() {
  try { FILEMAP = JSON.parse(localStorage.getItem(LS_FILES) || '{}') || {}; } catch (e) { FILEMAP = {}; }
  try { CLOSED = JSON.parse(localStorage.getItem(LS_CLOSED) || '[]') || []; } catch (e) { CLOSED = []; }
  if (!FILEMAP || typeof FILEMAP !== 'object') FILEMAP = {};
  if (!Array.isArray(CLOSED)) CLOSED = [];
  /* 库里已经没有的项目就别再留文件记录了 */
  const ids = new Set(DB.projects.map(p => p.id));
  Object.keys(FILEMAP).forEach(k => { if (!ids.has(k)) delete FILEMAP[k]; });
}
function saveFileMeta() {
  try { localStorage.setItem(LS_FILES, JSON.stringify(FILEMAP)); } catch (e) { /* ignore */ }
  try { localStorage.setItem(LS_CLOSED, JSON.stringify(CLOSED.slice(0, 12))); } catch (e) { /* ignore */ }
}
/* 内容指纹：只用来判断「和文件里那份一样不一样」，不需要密码学强度 */
function hashStr(s) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h.toString(16) + '-' + s.length.toString(16);
}
function safeFileName(n) {
  return String(n || '项目').replace(/[\\/:*?"<>|]+/g, '_').replace(/\s+/g, ' ').trim().slice(0, 60) || '项目';
}
function fmtAgo(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  const s = Math.floor((Date.now() - d.getTime()) / 1000);
  if (s < 60) return '刚刚';
  if (s < 3600) return Math.floor(s / 60) + ' 分钟前';
  if (s < 86400) return Math.floor(s / 3600) + ' 小时前';
  if (s < 86400 * 30) return Math.floor(s / 86400) + ' 天前';
  return fmtD(iso);
}
/* 组装某个项目的文件内容（导出 / 保存 / 指纹都用它，字段顺序固定） */
function projectPayload(pid) {
  const p = projById(pid);
  if (!p) return null;
  const tasks = DB.tasks.filter(t => t.projectId === pid);
  const ids = new Set(tasks.map(t => t.id));
  const used = new Set(tasks.map(t => t.status));
  const statuses = DB.statuses.filter(s => !s.core && (used.has(s.id) ||
    (s.scope === 'project' && (s.projectIds || []).indexOf(pid) >= 0) || s.scope === 'global'));
  const paint = {};
  Object.keys(DB.paint || {}).forEach(k => {
    const i = k.indexOf('|');
    if (i > 0 && ids.has(k.slice(i + 1))) paint[k] = DB.paint[k];
  });
  return {
    app: 'PlanBoard', kind: PB_KIND, version: PB_VERSION,
    exportedAt: new Date().toISOString(),
    project: { id: p.id, name: p.name, color: p.color || PALETTE[0], start: p.start || '', end: p.end || '', desc: p.desc || '', archived: !!p.archived },
    statuses: statuses.map(s => ({ id: s.id, name: s.name, color: s.color, mode: s.mode, scope: s.scope, projectIds: (s.projectIds || []).slice(), order: s.order })),
    tasks: tasks.map(t => ({
      id: t.id, parentId: t.parentId || null, title: t.title, note: t.note || '', status: t.status,
      priority: t.priority, start: t.start || '', end: t.end || '', progress: t.progress || 0,
      hours: t.hours || 0, milestone: !!t.milestone, deps: (t.deps || []).slice(), order: t.order || 0,
      doneAt: t.doneAt || null, color: t.color || null, textColor: t.textColor || null,
      attachments: (t.attachments || []).slice()
    })),
    templates: (DB.templates || []).slice(),
    paint
  };
}
/* 指纹用「不含 exportedAt」的版本，否则每次算都变、标签页永远显示未保存 */
function payloadStable(payload) {
  if (!payload) return '';
  const c = Object.assign({}, payload);
  delete c.exportedAt;
  return JSON.stringify(c);
}
function projDirty(pid) {
  if (dirtyCache.rev !== DB_REV) dirtyCache = { rev: DB_REV, map: {} };
  if (Object.prototype.hasOwnProperty.call(dirtyCache.map, pid)) return dirtyCache.map[pid];
  const info = FILEMAP[pid];
  let d;
  if (!info) d = DB.tasks.some(t => t.projectId === pid);   /* 从没存过：空项目不算脏 */
  else d = info.hash !== hashStr(payloadStable(projectPayload(pid)));
  dirtyCache.map[pid] = d;
  return d;
}
/* 把「当前状态」标成和文件一致（保存后、刚打开文件后都走这里） */
function markClean(pid, name) {
  const p = projById(pid);
  if (!p) return;
  const old = FILEMAP[pid] || {};
  FILEMAP[pid] = {
    name: name || old.name || (safeFileName(p.name) + PB_EXT),
    hash: hashStr(payloadStable(projectPayload(pid))),
    at: new Date().toISOString()
  };
  dirtyCache = { rev: -1, map: {} };
  saveFileMeta();
  if (typeof renderChips === 'function') renderChips();
}

function importProjectText(text, fname, handle) {

/* 同一个项目已经在标签页里开着 → 问一句：覆盖还是另开一个副本 */
function openPayload(payload, fname, handle) {
  const src = payload.project || {};
  const exist = src.id ? projById(src.id) : null;
  if (!exist) { applyPayload(payload, fname, handle, false); return; }

    [
      { label: '取消' },
      { label: '作为副本导入', cls: 'primary', onClick: () => applyPayload(payload, fname, handle, true) },
      { label: '覆盖现有项目', cls: 'danger', onClick: () => applyPayload(payload, fname, handle, false) }
    ]);

/* 把文件内容并进当前库：主键全部重编，避免和别的项目撞 id */
function applyPayload(payload, fname, handle, asCopy) {
  const src = (payload && payload.project) || {};
  const exist = src.id ? projById(src.id) : null;
  const pid = (asCopy || exist) ? uid() : (src.id || uid());
  const idMap = {};
  const rawTasks = (payload.tasks || []).map(t => {
    const nid = uid();
    idMap[t.id] = nid;
    return Object.assign({}, t, { id: nid, projectId: pid });
  });
  rawTasks.forEach(t => {
    t.parentId = t.parentId ? (idMap[t.parentId] || null) : null;
    t.deps = (Array.isArray(t.deps) ? t.deps : []).map(d => idMap[d]).filter(Boolean);
  });
  /* 文件里的自定义状态 → 收归成这个项目的专属状态（避免污染别的项目） */
  const stMap = {};
  const rawSts = (payload.statuses || []).filter(s => s && s.id && !s.core).map(s => {
    const nid = 'st' + uid();
    stMap[s.id] = nid;
    return Object.assign({}, s, { id: nid, scope: 'project', projectIds: [pid] });
  });
  rawTasks.forEach(t => { if (stMap[t.status]) t.status = stMap[t.status]; });
  const rawProj = Object.assign({}, src, {
    id: pid,
    name: String(src.name || '导入的项目').slice(0, 60) + (asCopy && exist ? '（副本）' : ''),
    archived: false
  });
  const part = normalize({ version: 2, statuses: rawSts, projects: [rawProj], tasks: rawTasks, paint: (payload.paint || {}), templates: [] });
  const paintNew = {};
  Object.keys(part.paint || {}).forEach(k => {
    const i = k.indexOf('|');
    if (i > 0 && part.tasks.some(x => x.id === k.slice(i + 1))) paintNew[k] = part.paint[k];
  });
  if (exist && !asCopy) removeProjectData(pid);
  DB.projects.push(part.projects[0]);
  part.statuses.forEach(s => { if (!s.core) DB.statuses.push(s); });
  part.tasks.forEach(t => DB.tasks.push(t));
  Object.keys(paintNew).forEach(k => { DB.paint[k] = paintNew[k]; });

  UI.project = pid;
  UI.collapsed = [];
  ganttSel = new Set();
  const nm = fname || (safeFileName(part.projects[0].name) + PB_EXT);
  if (handle) FILEHANDLE[pid] = handle;
  /* 先把当前库落盘，再算指纹 —— 这样算出来的就是「和文件一致」的那份 */
  save();
  markClean(pid, nm);
  saveUI();
  commit('打开项目文件');
  toast('已打开「' + part.projects[0].name + '」· ' + part.tasks.length + ' 条任务' +
    (asCopy ? '（副本）' : '') + (handle ? '' : '（浏览器不支持自选位置，用的是普通文件选择）'));
}
/* 摘掉一个项目的全部数据（覆盖导入 / 关闭标签页共用） */
function removeProjectData(pid) {
  const ids = new Set(DB.tasks.filter(t => t.projectId === pid).map(t => t.id));
  DB.tasks = DB.tasks.filter(t => t.projectId !== pid);
  DB.projects = DB.projects.filter(p => p.id !== pid);
  /* 只跟着这个项目走的专属状态一起收走；还被别人勾着的通用状态留着 */
  DB.statuses = DB.statuses.filter(s => s.core || !(s.scope === 'project' &&
    (s.projectIds || []).length === 1 && s.projectIds[0] === pid));
  DB.tasks.forEach(t => { t.deps = (t.deps || []).filter(d => !ids.has(d)); });
  Object.keys(DB.paint || {}).forEach(k => {
    const i = k.indexOf('|');
    if (i > 0 && ids.has(k.slice(i + 1))) delete DB.paint[k];
  });
  delete FILEMAP[pid];
  delete FILEHANDLE[pid];
  if (UI.project === pid) UI.project = (DB.projects.find(p => !p.archived) || DB.projects[0] || {}).id || 'all';
  dirtyCache = { rev: -1, map: {} };
}

/* ==================== 十二·B2、项目任务总览（点标签页上的 ▾ 展开） ==================== */
/* 在标签页上把「这个项目里到底有些什么」一次摊开：全部任务 + 层级 + 完成度。
   收起状态只活在这次会话里（outlineShut），不写进设置。 */
let outlineShut = new Set();
let outlinePop = null;

/* 把一个项目的任务按层级摊平成一串 .po-row。
   「项目总览浮层」和「仪表盘 · 各项目进度」的展开列表共用这一份渲染，样式与手感完全一致。
   shut 是「已收起」的 id 集合（语义注意：在里面 = 收着），由调用方各自维护。 */
function taskTreeHtml(pid, shut) {
  const all = DB.tasks.filter(t => t.projectId === pid);
  if (!all.length) return '';
  const kOf = id => DB.tasks.filter(t => t.parentId === id).sort(byOrder);
  const walk = (parentId, depth) => {
    const list = parentId ? kOf(parentId) : all.filter(t => !t.parentId).sort(byOrder);
    let out = '';
    list.forEach(t => {
      const k = kOf(t.id);
      const closed = shut.has(t.id);
      const dn = isDone(t);
      const pp = dn ? 100 : clamp(t.progress, 0, 100);
      const s = statusById(t.status) || {};
      const sc = s.color || '#94a3b8';
      out += '<div class="po-row" data-potask="' + t.id + '" style="padding-left:' + (7 + depth * 15) + 'px" title="' +
        esc(t.title + '\n状态：' + (s.name || '—') + '　完成度 ' + pp + '%' +
          (t.start ? '\n' + t.start + ' → ' + t.end : '') +
          (k.length ? '\n含 ' + k.length + ' 个直接子任务' : '') +
          '\n单击选中 · 双击编辑') + '">' +
        (k.length
          ? '<button class="po-tw" data-potw="' + t.id + '" title="展开 / 收起子任务">' + (closed ? '▸' : '▾') + '</button>'
          : '<span class="po-tw ph"></span>') +
        '<span class="po-dot" style="background:' + sc + '"></span>' +
        '<span class="po-t' + (dn ? ' done' : '') + '">' + esc(t.title) + '</span>' +
        (t.milestone ? '<span class="po-ms" title="里程碑">◆</span>' : '') +
        (k.length ? '<span class="po-kids" title="' + k.length + ' 个直接子任务">' + k.length + '</span>' : '') +
        '<span class="po-pct">' + pp + '%</span>' +
        '<span class="po-pb"><i style="width:' + pp + '%;background:' + sc + '"></i></span>' +
        '</div>';
      if (k.length && !closed) out += walk(t.id, depth + 1);
    });
    return out;
  };
  return walk(null, 0);
}

function outlineHtml(pid) {
  const p = projById(pid) || {};
  const color = p.color || PALETTE[0];
  const all = DB.tasks.filter(t => t.projectId === pid);
  const kOf = id => DB.tasks.filter(t => t.parentId === id).sort(byOrder);
  const leaves = all.filter(t => !kOf(t.id).length);
  const doneN = leaves.filter(isDone).length;
  const pct = leaves.length
    ? Math.round(leaves.reduce((s, t) => s + (isDone(t) ? 100 : clamp(t.progress, 0, 100)), 0) / leaves.length)
    : 0;
  const hours = leaves.reduce((s, t) => s + (t.hours || 0), 0);

  let h = '<div class="po-head"><span class="dot" style="background:' + color + '"></span>' +
    '<b title="' + esc(p.name) + '">' + esc(p.name) + '</b>' +
    '<span class="po-sum">' + leaves.length + ' 项 · 完成 ' + doneN + ' · ' + pct + '%' +
      (hours ? ' · ' + hours + 'h' : '') + '</span></div>' +
    '<div class="po-bar"><i style="width:' + pct + '%;background:' + color + '"></i></div>';

  if (!all.length) {
    h += '<div class="po-empty">这个项目还没有任务<br>' +
      '<span style="font-size:11.5px">关掉面板，在任意视图里新建一条就能在这里看到</span></div>';
  } else {
    h += '<div class="po-body">' + taskTreeHtml(pid, outlineShut) + '</div>';
  }

  h += '<div class="po-foot"><span>单击选中 · 双击编辑</span><span class="spacer"></span>' +
    '<button data-poa="all">全部展开</button>' +
    '<button data-poa="none">全部收起</button></div>';
  return h;
}

function openColorPicker(anchor, cur, onPick, extraHtml, live) {
  const el = openFloat(anchor, colorPopHtml(cur, extraHtml), () => {}, null);
  wireColorPop(el, cur, onPick, { close: closeFloat, live: live });
  return el;
}

/* 在鼠标位置开一个取色器（右键菜单点完就关了，没有现成的锚点元素可挂） */
function openColorPickerAt(x, y, cur, onPick, extraHtml, live) {
  const a = document.createElement('div');
  a.style.cssText = 'position:fixed;left:' + x + 'px;top:' + y + 'px;width:2px;height:2px;pointer-events:none';
  document.body.appendChild(a);
  openColorPicker(a, cur, onPick, extraHtml, live);
  a.remove();
}
/* 取色器的标题行（可带「恢复默认」） */
function colorHead(title, canClear) {
  return '<div class="cpop-head">' + esc(title) + '<span class="spacer"></span>' +
    (canClear ? '<button type="button" data-cclr="1">恢复默认</button>' : '') + '</div>';
}

/* 在任意页面点击任务上的状态胶囊/圆点，直接切换状态 */
function openStatusMenu(anchor, t) {
  if (!t) return;
  const list = scopeStatuses(t.projectId);
  if (!list.some(s => s.id === t.status)) {
    const cur = statusById(t.status);
    if (cur) list.push(cur);
  }
  const html = list.map(s =>
    '<button class="mi' + (t.status === s.id ? ' on' : '') + '" data-sid="' + s.id + '">' +
    '<span class="dot" style="background:' + s.color + '"></span><span class="nm">' + esc(s.name) + '</span>' +
    (s.scope === 'global' ? '' : '<span class="tag">专属</span>') +
    (t.status === s.id ? '<span class="ck">✓</span>' : '') + '</button>').join('') +
    '<div class="menu-sep"></div>' +
    '<button class="mi" data-sid="__manage"><span class="dot" style="background:var(--muted)"></span><span class="nm">新建 / 管理状态…</span></button>' +
    (isDone(t) && t.doneAt ? '<button class="mi" data-sid="__clear"><span class="dot" style="background:var(--warn)"></span><span class="nm">清除完成时间记录</span></button>' : '');
  openFloat(anchor, html, (ev) => {
    const b = ev.target.closest('[data-sid]');
    if (!b) return;
    const sid = b.dataset.sid;
    closeFloat();
    if (sid === '__manage') { openStatusModal(null); return; }
    if (sid === '__clear') { t.doneAt = null; commit(); toast('已清除完成时间记录'); return; }
    const wasDone = isDone(t);
    const changed = applyStatusChange(t, sid);
    if (!changed) { render(); return; }
    commit();
    toast('「' + shortTitle(t.title) + '」→ ' + statusName(sid) +
      (!wasDone && isDone(t) && t.doneAt ? '（' + fmtDT(t.doneAt) + ' 已记录）' : ''));
  });
}
/* 新建 / 编辑 / 删除状态；scope 支持「全部任务（通用）」与「指定项目（专属）」 */
function openStatusModal(focusNew, after, opt) {
  opt = opt || {};
  /* 当前正停在哪个项目上：新建状态默认只给这个项目用，避免一个项目里建的状态串到别的项目 */
  const curPid = (UI.project && UI.project !== 'all' && UI.project !== '__archived' &&
    DB.projects.some(p => p.id === UI.project)) ? UI.project : '';
  const curPName = curPid ? ((DB.projects.find(p => p.id === curPid) || {}).name || '当前项目') : '';
  const modeOpts = k => Object.keys(ST_MODE).map(m =>
    '<option value="' + m + '"' + (k === m ? ' selected' : '') + '>' + ST_MODE[m] + '</option>').join('');
  const rowHtml = s => {
    const projs = DB.projects.map(p =>
      '<button type="button" class="pchip' + ((s.projectIds || []).includes(p.id) ? ' on' : '') + '" data-sproj="' + s.id + '" data-pid="' + p.id + '">' +
      esc(p.name) + '</button>').join('');
    const coreScope = s.core
      ? '<select class="inp sm" disabled title="核心状态的类型固定"><option>所有任务（通用）</option></select>'
      : '<select class="inp sm" data-sscope="' + s.id + '">' +
        '<option value="global"' + (s.scope === 'global' ? ' selected' : '') + '>所有任务（通用）</option>' +
        '<option value="project"' + (s.scope === 'project' ? ' selected' : '') + '>指定项目（专属）</option></select>';
    return '<div class="st-row' + (s.core ? ' core' : '') + '" data-srow="' + s.id + '">' +
      '<button type="button" class="sw-btn" data-scolor="' + s.id + '" style="background:' + s.color + '" title="点击换颜色"></button>' +
      '<input class="inp sm" data-sname="' + s.id + '" value="' + esc(s.name) + '" maxlength="24"' + (s.core ? ' title="核心状态可改名"' : '') + '>' +
      (s.core ? '<select class="inp sm" disabled><option>' + ST_MODE[s.mode] + '</option></select>'
        : '<select class="inp sm" data-smode="' + s.id + '">' + modeOpts(s.mode) + '</select>') +
      coreScope +
      '<div class="projs">' + (s.core || s.scope === 'global'
        ? '<span class="none">通用状态：所有项目、所有任务都可用</span>'
        : (DB.projects.length ? projs : '<span class="none">还没有项目</span>')) + '</div>' +
      '<div class="ops">' +
        '<button type="button" data-smove="' + s.id + '" data-dir="-1" title="上移">↑</button>' +
        '<button type="button" data-smove="' + s.id + '" data-dir="1" title="下移">↓</button>' +
        (s.core ? '<button type="button" disabled title="核心状态不可删除">—</button>'
          : '<button type="button" class="del" data-sdel="' + s.id + '" title="删除状态">✕</button>') +
      '</div></div>';
  };
  /* ★ 只有列表区会跟着增删改重画；下面的「新建状态」表单区永远原地不动 ——
     这样既不丢用户刚敲进去的名字 / 刚挑的颜色，也不会让弹窗滚回最顶部。 */
  const listHtml = () => {
    const list = allStatuses();
    const core = list.filter(s => s.core);
    const custom = list.filter(s => !s.core);
    return '<div style="display:flex;flex-direction:column;gap:8px">' +
      '<div class="st-sec">核心状态（内置，可改名 / 换色 / 排序，不可删除）</div>' + core.map(rowHtml).join('') +
      '<div class="st-sec" style="margin-top:6px;display:flex;align-items:center;gap:8px">自定义状态（' + custom.length + '）' +
        (curPid ? '<span class="spacer"></span><button type="button" class="btn sm" id="nsTidy" title="把「只有本项目在用」和「还没人用过」的通用状态，收成只属于本项目的专属状态；已经在别的项目里用着的会保持通用">' +
          '把通用状态收归「' + esc(curPName) + '」</button>' : '') +
      '</div>' +
      (custom.length ? custom.map(rowHtml).join('') : '<div class="card-sub">还没有自定义状态，用下面的表单添加一个。</div>') +
      '</div>';
  };
  const formHtml = () => '<div style="border:1px dashed var(--border);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;margin-top:4px">' +
      '<div class="st-sec">新建状态</div>' +
      '<div class="row3">' +
        '<input class="inp" id="nsName" placeholder="状态名称，例如：待验收 / 已提测 / 已放弃" maxlength="24">' +
        '<select class="inp" id="nsMode">' +
          '<option value="todo">未开始（不计入完成率）</option>' +
          '<option value="doing" selected>进行中（不计入完成率）</option>' +
          '<option value="done">已完成（记录完成时间、计入完成率）</option>' +
        '</select>' +
        '<select class="inp" id="nsScope">' +
          '<option value="project"' + (curPid ? ' selected' : '') + '>只给某个项目用（项目专属，推荐）</option>' +
          '<option value="global"' + (curPid ? '' : ' selected') + '>所有项目都能用（通用状态）</option>' +
        '</select>' +
      '</div>' +
      '<div class="st-row" id="nsProjRow" style="display:' + (curPid ? 'grid' : 'none') + ';grid-template-columns:1fr">' +
        '<div class="projs" id="nsProjs">' + (DB.projects.length ? DB.projects.map(p =>
          '<button type="button" class="pchip' + (p.id === curPid ? ' on' : '') + '" data-nspid="' + p.id + '">' +
          esc(p.name) + '</button>').join('')
          : '<span class="none">还没有项目</span>') + '</div>' +
      '</div>' +
      '<div style="display:flex;gap:10px;align-items:center">' +
        '<div class="color-pick" id="nsColors">' + PALETTE.map((c, i) =>
          '<button type="button" data-c="' + c + '" class="' + (i === 1 ? 'on' : '') + '" style="background:' + c + '"></button>').join('') +
          '<label class="cpick" title="自定义颜色：点开是完整 RGB 取色器"><input type="color" id="nsPick" value="' + PALETTE[1] +
          '"><i style="background:' + PALETTE[1] + '"></i></label></div>' +
        '<span class="spacer"></span>' +
        '<button class="btn primary" id="nsAdd">创建状态</button>' +
      '</div>' +
      '<div class="card-sub">' +
        (curPid
          ? '当前停在「<b>' + esc(curPName) + '</b>」上，新建的状态默认<b>只给这个项目用</b>，不会串到别的项目；' +
            '确实想全项目通用，再把上面那个下拉改成「所有项目都能用」。'
          : '「只给某个项目用」的状态只在那个项目里出现，适合某个项目特有的流程节点；' +
            '「所有项目都能用」的状态会出现在每个项目里。想给某个项目单独建状态，先切到那个项目的标签页再来这里新建。') +
      '</div>' +
    '</div>';
  const m = openModal({
    title: '自定义任务状态', wide: true,
    body: '<div id="stList">' + listHtml() + '</div>' + formHtml(),
    foot: '<button class="btn" data-close>完成</button>',
    stack: opt.stack,
    onClose: after || null,
    onMount(mask) {
      let newColor = PALETTE[1];
      const picked = new Set(curPid ? [curPid] : []);
      mask.addEventListener('click', e => {
        const col = e.target.closest('[data-scolor]');
        if (col) {
          e.stopPropagation();
          const s = statusById(col.dataset.scolor);
          if (!s) return;
          /* 换状态颜色：色板 + 完整 RGB 取色器 */
          openColorPicker(col, s.color, v => {
            if (!v) return;
            s.color = v;
            save(); render(); refresh();
          }, colorHead('状态颜色', false),
          /* 拖色相条时只把当前这个色块染上，不重渲染整个弹窗 */
          v => { if (!v) return; s.color = v; col.style.background = v; });
          return;
        }
        const mv = e.target.closest('[data-smove]');
        if (mv) {
          const list = allStatuses();
          const i = list.findIndex(x => x.id === mv.dataset.smove);
          const j = i + Number(mv.dataset.dir);
          if (i < 0 || j < 0 || j >= list.length) return;
          const ord = list[i].order;
          list[i].order = list[j].order;
          list[j].order = ord;
          if (list[i].order === list[j].order) { list[i].order = j * 10 + 10; list[j].order = i * 10 + 10; }
          save(); render(); refresh();
          return;
        }
        const del = e.target.closest('[data-sdel]');
        if (del) {
          const s = statusById(del.dataset.sdel);
          if (!s) return;
          const used = DB.tasks.filter(t => t.status === s.id).length;
          confirmBox('确定删除状态「' + s.name + '」吗？' +
            (used ? '\n有 ' + used + ' 个任务正在使用它，删除后这些任务会回到「待办」。' : ''), () => {
              DB.statuses = DB.statuses.filter(x => x.id !== s.id);
              STORE.list = DB.statuses;
              commit();
              refresh();
              toast('已删除状态「' + s.name + '」');
            }, { title: '删除状态', okText: '确认删除', stack: opt.stack });
          return;
        }
        const pp = e.target.closest('[data-sproj]');
        if (pp) {
          const s = statusById(pp.dataset.sproj);
          if (!s) return;
          const pid = pp.dataset.pid;
          s.projectIds = s.projectIds || [];
          const i = s.projectIds.indexOf(pid);
          if (i < 0) s.projectIds.push(pid); else s.projectIds.splice(i, 1);
          save(); render(); refresh();
          return;
        }
        if (e.target.closest('#nsTidy')) {
          const usedByOthers = new Set(DB.tasks.filter(t => t.projectId !== curPid).map(t => t.status));
          let n = 0;
          DB.statuses.forEach(s => {
            if (s.core || s.scope !== 'global') return;
            if (usedByOthers.has(s.id)) return;      /* 别的项目还在用 → 保持通用，别把人家弄坏 */
            s.scope = 'project';
            s.projectIds = [curPid];
            n++;
          });
          if (!n) { toast('没有需要整理的通用状态'); return; }
          commit();
          refresh();
          toast('已把 ' + n + ' 个通用状态收归「' + curPName + '」');
          return;
        }
        const nsp = e.target.closest('[data-nspid]');
        if (nsp) {
          const pid = nsp.dataset.nspid;
          if (picked.has(pid)) picked.delete(pid); else picked.add(pid);
          nsp.classList.toggle('on', picked.has(pid));
          return;
        }
        const nc = e.target.closest('#nsColors [data-c]');
        if (nc) {
          newColor = nc.dataset.c;
          $$('#nsColors button', mask).forEach(x => x.classList.toggle('on', x === nc));
          return;
        }
        if (e.target.closest('#nsAdd')) {
          const name = mask.querySelector('#nsName').value.trim();
          if (!name) { toast('请填写状态名称'); mask.querySelector('#nsName').focus(); return; }
          const mode = mask.querySelector('#nsMode').value;
          const scope = mask.querySelector('#nsScope').value;
          if (scope === 'project' && !picked.size) { toast('请至少选择一个项目'); return; }
          const order = allStatuses().reduce((m, s) => Math.max(m, s.order || 0), 0) + 10;
          const nid = uid();
          DB.statuses.push({ id: nid, name, color: newColor, mode, scope, projectIds: scope === 'project' ? Array.from(picked) : [], order, core: false });
          STORE.list = DB.statuses;
          save(); render();
          /* ★ 建完不关弹窗：清空表单、就地重画列表，再把刚建的那一行亮出来。
             旧写法是 closeModal() + openStatusModal()，弹窗会闪一下并滚回最顶部
             （用户在看板页新建状态时报的就是这个）。 */
          mask.querySelector('#nsName').value = '';
          newColor = PALETTE[1];
          $$('#nsColors [data-c]', mask).forEach((x, i) => x.classList.toggle('on', i === 1));
          const ncLab = mask.querySelector('#nsColors .cpick');
          if (ncLab) {
            ncLab.classList.remove('on');
            const nd = ncLab.querySelector('i'); if (nd) nd.style.background = PALETTE[1];
            const ni = ncLab.querySelector('input'); if (ni) ni.value = to6(PALETTE[1]);
          }
          refresh(nid);
          toast('状态「' + name + '」已创建');
          return;
        }
      });
      mask.addEventListener('change', e => {
        const el = e.target;
        if (el.id === 'nsScope') {
          mask.querySelector('#nsProjRow').style.display = el.value === 'project' ? 'grid' : 'none';
          return;
        }
        if (el.id === 'nsPick') {
          const h = normHex(el.value);
          if (h) {
            newColor = h;
            $$('#nsColors button', mask).forEach(x => x.classList.remove('on'));
            const lab = el.closest('.cpick');
            if (lab) { const dot = lab.querySelector('i'); if (dot) dot.style.background = h; lab.classList.add('on'); }
          }
          return;
        }
        const map = { sname: 'name', smode: 'mode', sscope: 'scope' };
        for (const k in map) {
          if (el.dataset[k]) {
            const s = statusById(el.dataset[k]);
            if (!s) return;
            if (k === 'sscope' && el.value === 'global') s.projectIds = [];
            s[map[k]] = el.value;
            save(); render(); refresh();
            return;
          }
        }
      });
      /* 行内输入即时保存 */
      mask.addEventListener('input', e => {
        const el = e.target;
        if (el.dataset.sname) {
          const s = statusById(el.dataset.sname);
          if (s) { s.name = el.value || '未命名状态'; save(); }
        }
      });
      if (focusNew) setTimeout(() => { const el = mask.querySelector('#nsName'); if (el) el.focus(); }, 60);
      function refresh(justId) {
        const scroller = mask.querySelector('.modal-body');
        const top = scroller ? scroller.scrollTop : 0;
        const list = mask.querySelector('#stList');
        if (list) list.innerHTML = listHtml();
        if (scroller) scroller.scrollTop = top;
        /* 刚建好的那一行：滚进视野 + 闪一下边框，让人一眼看到新状态落在哪 */
        if (justId) {
          const nr = mask.querySelector('[data-srow="' + justId + '"]');
          if (nr) {
            try { nr.scrollIntoView({ block: 'nearest' }); } catch (e) { /* ignore */ }
            nr.classList.add('just');
            setTimeout(() => { try { nr.classList.remove('just'); } catch (e) { /* ignore */ } }, 1500);
          }
        }
      }
      mask.__refresh = refresh;
    }
  });
  return m;
}

/* 把侧边栏的动态状态刷一遍（工具栏改了开关，这里跟着变） */
function sideSync() {
  const body = $('#sideBody');
  if (!body) return;
  const side = $('#side');
  if (side) side.classList.toggle('open', !!UI.sideOpen);
  const tab = $('#sideTab'); if (tab) tab.classList.toggle('on', !!UI.sideOpen);
  const pin = $('#sidePin'); if (pin) pin.classList.toggle('on', !!UI.sidePinned);
  document.body.classList.toggle('side-pinned', !!UI.sidePinned);
  $$('[data-sideui]', body).forEach(el => {
    const on = !!UI[el.dataset.sideui];
    if (el.checked !== on) el.checked = on;
  });
  $$('[data-side="theme"]', body).forEach(b => b.classList.toggle('on', (UI.theme === 'dark') === (b.dataset.v === 'dark')));
  $$('[data-side="scale"]', body).forEach(b => b.classList.toggle('on', UI.scale === b.dataset.v));
  const zp = Math.round((Number(UI.zoom) || 1) * 100);
  const rg = $('[data-siderange="zoom"]', body);
  if (rg && Number(rg.value) !== zp) rg.value = zp;
  const zl = $('[data-zoomlab]', body);
  if (zl) zl.textContent = zp + '%';
  const rw = clamp(Math.round(Number(UI.ringW) || 0), 0, 6);
  const rr = $('[data-siderange="ringW"]', body);
  if (rr && Number(rr.value) !== rw) rr.value = rw;
  const rl = $('[data-ringlab]', body);
  if (rl) rl.textContent = rw === 0 ? '关' : rw + ' px';
  const ds = $('[data-sidesel="defTpl"]', body);
  if (ds) {
    const ids = (DB.templates || []).map(t => t.id).join(',');
    if (ds.dataset.ids !== ids) {
      ds.dataset.ids = ids;
      ds.innerHTML = (DB.templates || []).map(t => '<option value="' + t.id + '">' + esc(t.name) + ' · ' + t.days + ' 天</option>').join('') ||
        '<option value="">（没有模板）</option>';
    }
    const d = defaultTpl();
    if (d && ds.value !== d.id) ds.value = d.id;
  }
}
function buildSidebar() {
  const body = $('#sideBody');
  if (!body) return;
  body.innerHTML = sideBodyHtml();
  const tplBox = $('#sideTpl');
  const repaintTpl = () => {
    if (tplBox) tplBox.innerHTML = sideTplRowsHtml();
    const ds = $('[data-sidesel="defTpl"]', body);
    if (ds) ds.dataset.ids = '';
    sideSync();
  };
  body.addEventListener('change', e => {
    const sw = e.target.closest('[data-sideui]');
    if (sw) {
      UI[sw.dataset.sideui] = sw.checked;
      saveUI(); render();
      return;
    }
    const sel = e.target.closest('[data-sidesel]');
    if (sel) { UI.defTpl = sel.value; saveUI(); repaintTpl(); return; }
    const f = e.target.closest('[data-tf]');
    if (f) {
      const tp = tplById(f.dataset.tid);
      if (!tp) return;
      const k = f.dataset.tf;
      if (k === 'days') tp.days = clamp(Math.round(Number(f.value) || 1), 1, 365);
      else if (k === 'hours') tp.hours = Math.max(0, Number(f.value) || 0);
      else if (k === 'priority') tp.priority = Number(f.value);
      else tp[k] = String(f.value || '');
      save(); sideSync();
    }
  });
  body.addEventListener('input', e => {
    const rw = e.target.closest('[data-siderange="ringW"]');
    if (rw) {
      UI.ringW = clamp(Math.round(Number(rw.value) || 0), 0, 6);
      const lab = $('[data-ringlab]', body);
      if (lab) lab.textContent = UI.ringW === 0 ? '关' : UI.ringW + ' px';
      applyRingW();
      saveUI();
      return;                       /* 只改 CSS 变量，不用重渲染 */
    }
    const rg = e.target.closest('[data-siderange="zoom"]');
    if (!rg) return;
    UI.zoom = clamp(Number(rg.value) / 100, 0.5, 3);
    const lab = $('[data-zoomlab]', body);
    if (lab) lab.textContent = Math.round(UI.zoom * 100) + '%';
    saveUI();
    if (UI.view === 'gantt') render();
  });
  body.addEventListener('click', e => {
    const tdef = e.target.closest('[data-tdef]');
    if (tdef) { UI.defTpl = tdef.dataset.tdef; saveUI(); repaintTpl(); toast('已设为默认模板'); return; }
    const tdel = e.target.closest('[data-tdel]');
    if (tdel) {
      if ((DB.templates || []).length <= 1) { toast('至少要保留一个模板'); return; }
      DB.templates = DB.templates.filter(t => t.id !== tdel.dataset.tdel);
      if (!tplById(UI.defTpl)) UI.defTpl = DB.templates[0].id;
      saveUI(); save(); repaintTpl();
      return;
    }
    const b = e.target.closest('[data-side]');
    if (!b) return;
    const k = b.dataset.side;
    if (k === 'theme') {
      UI.theme = b.dataset.v === 'dark' ? 'dark' : 'light';
      document.documentElement.dataset.theme = UI.theme;
      saveUI(); render();
      return;
    }
    if (k === 'scale') { UI.scale = b.dataset.v; saveUI(); render(); return; }
    if (k === 'tplAdd') {
      DB.templates.push(normalizeTpl({ name: '新模板', title: '', days: 3, priority: 2, status: 'todo', hours: 0 }));
      save(); repaintTpl();
      const inputs = $$('[data-tf="name"]', tplBox);
      const last = inputs[inputs.length - 1];
      if (last) { last.focus(); last.select(); }
      return;
    }
    if (k === 'tplReset') {
      confirmBox('把模板列表恢复成内置的 5 个模板？自己加的模板会没掉。', () => {
        DB.templates = defaultTemplates();
        UI.defTpl = DB.templates[0].id;
        saveUI(); save(); repaintTpl();
        toast('已恢复内置模板');
      }, { title: '恢复内置模板', okText: '恢复' });
      return;
    }
    if (k === 'export' || k === 'import' || k === 'csv' || k === 'reset') doAct(k);
  });
  /* 画笔默认颜色：色板 + 完整 RGB 取色器 */
  wireColorPop(body.querySelector('.side-box'), UI.brushColor, v => {
    if (!v) return;
    UI.brushColor = v; UI.brushTool = 'brush';
    saveUI(); ptSync();
    toast('画笔初始颜色：' + v);
  }, {
    /* 拖动色相条时只同步画笔按钮的样子，不写盘、不提示 */
    live: v => { if (!v) return; UI.brushColor = v; UI.brushTool = 'brush'; ptSync(); }
  });
  sideSync();
}

/* 清空全部数据：菜单栏「数据」和左侧设置抽屉共用这一份逻辑 */
function resetAllData() {
  const pid = uid();
  setDB({
    version: 2, statuses: defaultStatuses(),
    projects: [{ id: pid, name: '我的第一个项目', color: PALETTE[0], start: today(), end: addDays(today(), 30), desc: '', archived: false }],
    tasks: []
  });
  UI.project = 'all'; UI.collapsed = [];
  saveUI(); commit();
  toast('已清空数据');
}
function doAct(act) {
  if (act === 'newTask') openTaskModal(null);
  /* 数据类动作：左侧设置抽屉的四个按钮走的就是这里（曾经漏掉过，点了没反应） */
  else if (act === 'export') exportJSON();
  else if (act === 'import') $('#fileInput').click();
  else if (act === 'csv') exportCSV();
  else if (act === 'reset') {
    confirmBox('将清空全部项目与任务，只保留一个空白的「我的第一个项目」。\n此操作不可撤销，建议先导出 JSON 备份。', resetAllData,
      { title: '清空全部数据', okText: '确认清空' });
  }
  else if (act === 'newProject') openProjectModal();
  else if (act === 'statuses') openStatusModal();
  else if (act === 'settings') openSidebar();
  else if (act === 'toggleAutoOpen') {
    UI.autoOpen = !UI.autoOpen; saveUI(); renderTools();
    const mm = $('#mmAutoOpen');
    if (mm) mm.textContent = '拖动圆点新建后自动弹窗：' + (UI.autoOpen ? '开' : '关');
    toast(UI.autoOpen
      ? '已开启：拖动圆点新建任务后会弹出编辑窗口'
      : '已关闭：拖动圆点新建任务不再弹窗，自动套用默认模板');
  }
  else if (act === 'expandAll') { expandAllGroups(); }
  else if (act === 'collapseAll') { collapseAllGroups(); }
  else if (act === 'print') { window.print(); }
}

let dragDepth = 0;
const dragHazFile = e => !!(e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], 'Files') >= 0);
document.addEventListener('dragenter', e => {
  if (!dragHazFile(e) || anyModalOpen()) return;
  e.preventDefault();
  dragDepth++;
  document.body.classList.add('dragging-file');
});

  if (!dragHazFile(e) || anyModalOpen()) return;
  e.preventDefault();
  if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
});
document.addEventListener('dragleave', e => {
  if (!dragHazFile(e)) return;
  dragDepth = Math.max(0, dragDepth - 1);
  if (!dragDepth) document.body.classList.remove('dragging-file');
});
document.addEventListener('drop', e => {
  if (!dragHazFile(e) || anyModalOpen()) return;
  e.preventDefault();
  dragDepth = 0;
  document.body.classList.remove('dragging-file');
  const f = e.dataTransfer.files && e.dataTransfer.files[0];
  if (f) readDroppedFile(f);
