/* ==================== 悬停信息卡 ==================== */
let tipEl = null, tipTimer = 0, tipId = null;
/* 悬停目标（任务条 / 大纲行 / 看板卡 / 列表行 / 仪表盘任务行）本身就带 title，
   浏览器会弹出一个原生提示，和我们这张信息卡叠在一起（两个框互相压住）。
   所以命中悬停目标时，先把它以及它内部所有元素的 title 临时摘下来存着，
   鼠标离开、或者信息卡收起时，再原样装回去。
   注意：只有「信息卡开着」时才摘 —— 关掉卡片（编辑菜单里那个开关）就照旧用原生提示。 */
let tipTitleStash = null, tipTitleHost = null;
function stripTitlesFor(el) {
  if (!el || !el.querySelectorAll || tipTitleHost === el) return;
  restoreTitles();
  const list = [];
  if (el.hasAttribute('title')) list.push([el, el.getAttribute('title')]);
  $$('[title]', el).forEach(n => list.push([n, n.getAttribute('title')]));
  if (!list.length) return;
  list.forEach(pair => pair[0].removeAttribute('title'));
  tipTitleStash = list;
  tipTitleHost = el;
}
function restoreTitles() {
  const list = tipTitleStash;
  tipTitleStash = null; tipTitleHost = null;
  if (!list) return;
  list.forEach(pair => {
    const n = pair[0];
    if (n && n.isConnected) n.setAttribute('title', pair[1]);   /* 已被重渲染换掉的节点就不用管了 */
  });
}
function tipTargetOf(e) {
  if (!e.target || !e.target.closest) return null;
  const el = e.target.closest(
    '.g-bar[data-task],.g-sum[data-task],.g-ms[data-task],.g-lbl[data-task],.g-row[data-rowtask],' +
    '.kb-card[data-task],.kb-sub[data-subrow],.lv-row[data-task],.alert-item[data-task],' +
    /* 仪表盘「各项目进度」展开出来的任务列表；限定在 .dash 内，
       别和项目总览浮层里的同一套 .po-row 重复弹一次 */
    '.dash .po-row[data-potask]');
  if (!el) return null;
  const id = el.dataset.task || el.dataset.rowtask || el.dataset.subrow || el.dataset.potask;
  const t = id ? taskById(id) : null;
  return t ? { el, id, t } : null;
}
function hideTip() {
  if (tipTimer) { clearTimeout(tipTimer); tipTimer = 0; }
  tipId = null;
  restoreTitles();
  if (tipEl) {
    const el = tipEl; tipEl = null;
    try { el.remove(); } catch (err) { /* ignore */ }
  }
}
function tipHtml(t) {
  const p = projById(t.projectId) || {};
  const st = statusById(t.status) || {};
  const at = Array.isArray(t.attachments) ? t.attachments : [];
  const pct = isDone(t) ? 100 : clamp(t.progress, 0, 100);
  const kids = kidsOf(t.id);
  let h = '<div class="tt-t">' + esc(t.title) + '</div>' +
    '<div class="tt-r"><span class="d" style="background:' + (st.color || '#94a3b8') + '"></span>' + esc(st.name || '—') +
      '<span class="sep">·</span>' + esc(p.name || '—') +
      '<span class="sep">·</span>' + PRIO[t.priority].n + '优先级' +
      (t.milestone ? '<span class="sep">·</span>◆ 里程碑' : '') + '</div>' +
    '<div class="tt-r">📅 ' + esc(t.start || '—') + ' → ' + esc(t.end || '—') +
      '<span class="tt-bar"><i style="width:' + pct + '%"></i></span>' + pct + '%' +
      (t.hours ? '　·　' + t.hours + ' h' : '') + '</div>';
  const sp = taskSpanDays(t);
  if (sp != null) {
    h += '<div class="tt-r">⏱ 用时 <b>' + dayWord(sp) + '</b>' +
      '<span class="sep">·</span>' + esc(t.start) + ' → ' + esc(taskSpanEnd(t)) +
      '<span class="sep">·</span>' + (spanLocked(t) ? '已完成，已固定' : '进行中，随日历增长') + '</div>';
  }
  if (t.note) h += '<div class="tt-n">' + esc(t.note) + '</div>';
  if (at.length) {
    h += '<div class="tt-a">' + at.slice(0, 4).map(a =>
      '<span class="tt-ch" title="' + esc(a.name) + '">' + (a.kind === 'md' ? '📝 ' : a.kind === 'pdf' ? '📕 ' : a.kind === 'path' ? '📎 ' : '🔗 ') + esc(a.name) + '</span>').join('') +
      (at.length > 4 ? '<span class="tt-ch">+' + (at.length - 4) + '</span>' : '') + '</div>';
  }
  h += '<div class="tt-h">单击选中 · 双击编辑' + (kids.length ? '　·　' + kids.length + ' 个子任务' : '') + '</div>';
  return h;
}
/* 信息卡的锚点 = 鼠标当前位置（不是任务条的 rect）。
   ★ 老实现用 rect.left 当 x，长条悬在右半截时卡片会跑到条头去 —— 用户点名要改的就是这个。
   鼠标坐标由 document 级 mousemove 持续喂入，打开那一刻取的是「现在」的位置。 */
let tipMouse = { x: 0, y: 0 };
function placeTip(mx, my, rect, box) {
  const gx = 14, gy = 14, gap = 9;   /* 离指针的间距 / 离被悬停条的间距 */
  /* 默认出现在指针右下方 */
  let x = mx + gx, y = my + gy;
  /* 靠右放不下 → 翻到指针左边；靠下放不下 → 翻到指针上面 */
  if (x + box.width > window.innerWidth - 8) x = mx - box.width - gx;
  if (y + box.height > window.innerHeight - 8) y = my - box.height - gy;
  /* 翻完要是还压住了被悬停的那一条，就让到它的上 / 下外侧（x 仍跟鼠标走） */
  const covers = !(x + box.width < rect.left || x > rect.right || y + box.height < rect.top || y > rect.bottom);
  if (covers) {
    const below = rect.bottom + gap;
    if (below + box.height <= window.innerHeight - 8) y = below;
    else y = Math.max(8, rect.top - box.height - gap);
  }
  /* 最后夹回视口内 */
  if (x < 8) x = 8;
  if (y < 8) y = 8;
  if (x + box.width > window.innerWidth - 8) x = Math.max(8, window.innerWidth - box.width - 8);
  if (y + box.height > window.innerHeight - 8) y = Math.max(8, window.innerHeight - box.height - 8);
  return { x: Math.round(x), y: Math.round(y) };
}
document.addEventListener('mousemove', e => {
  if (typeof e.clientX === 'number' && isFinite(e.clientX)) { tipMouse.x = e.clientX; tipMouse.y = e.clientY; }
}, { passive: true });
function showTip(t, el) {
  hideTip();
  stripTitlesFor(el);          /* hideTip 刚把上一个目标的 title 装回去了，这里补摘一次 */
  const n = document.createElement('div');
  n.className = 'task-tip';
  n.innerHTML = tipHtml(t);
  document.body.appendChild(n);
  const box = n.getBoundingClientRect();
  const rect = el.getBoundingClientRect();
  /* 鼠标还没动过（比如自动化 / 触屏）就退回条头，总得有个位置 */
  const mx = tipMouse.x || (rect.left + Math.min(120, rect.width / 2));
  const my = tipMouse.y || rect.top;
  const pos = placeTip(mx, my, rect, box);
  n.style.left = pos.x + 'px';
  n.style.top = pos.y + 'px';
  tipEl = n;
  tipId = t.id;
}
function tipBusy() {
  if (!UI.showTip) return true;
  if (document.body.classList.contains('rowdrag') || document.body.classList.contains('coldrag') ||
    document.body.classList.contains('painting') || document.body.classList.contains('marquee-on') ||
    document.body.classList.contains('panning')) return true;
  if (anyModalOpen()) return true;
  return false;
}
document.addEventListener('mouseover', e => {
  if (typeof e.clientX === 'number' && isFinite(e.clientX)) { tipMouse.x = e.clientX; tipMouse.y = e.clientY; }
  if (tipBusy()) { hideTip(); return; }
  const hit = tipTargetOf(e);
  if (!hit) { if (tipId) hideTip(); return; }
  stripTitlesFor(hit.el);                             /* 摘掉原生 title，免得两提示叠在一起 */
  if (hit.id === tipId && tipEl) return;              /* 同一个元素内移动不重开 */
  hideTip();
  tipTimer = setTimeout(() => {
    tipTimer = 0;
    if (tipBusy()) return;
    if (!hit.el.isConnected) return;
    if (!hit.el.matches(':hover')) return;             /* 延迟期间鼠标已经走了 */
    showTip(hit.t, hit.el);
  }, 330);
});
document.addEventListener('mouseout', e => {
  const hit = tipTargetOf(e);
  if (!hit) return;
  const to = e.relatedTarget;
  if (to && hit.el.contains(to)) return;
  hideTip();
});
document.addEventListener('pointerdown', hideTip, true);
window.addEventListener('scroll', hideTip, true);
window.addEventListener('resize', hideTip);

const moreMenu = $('#moreMenu');
$('#btnMenu').addEventListener('click', e => {
  e.stopPropagation();
  const mm = $('#mmAutoOpen');                       /* 每次打开都刷一次状态文案 */
  if (mm) mm.textContent = '拖动圆点新建后自动弹窗：' + (UI.autoOpen ? '开' : '关');
  moreMenu.classList.toggle('open');
});
document.addEventListener('click', e => {
  const sb = e.target.closest('[data-stbtn]');
  if (sb) {
    e.preventDefault();
    e.stopPropagation();
    const t = taskById(sb.dataset.stbtn);
    if (t) openStatusMenu(sb, t);
    return;
  }
  /* 浮层自己的点击、以及「刚在这一拍打开的浮层」都别被这一轮的「点外面就收起」收掉
     —— 右键菜单点「改颜色」、弹窗里点状态色圆点，都是「关菜单 + 开取色器」发生在同一次 click 里 */
  if (!floatKeep(e)) closeFloat();
  if (!e.target.closest('#moreMenu') && !e.target.closest('#btnMenu')) moreMenu.classList.remove('open');
});
moreMenu.addEventListener('click', e => {
  const it = e.target.closest('[data-act]');
  if (!it) return;
  moreMenu.classList.remove('open');
  const act = it.dataset.act;
  if (act === 'import') $('#fileInput').click();
  else if (act === 'export') exportJSON();
  else if (act === 'csv') exportCSV();
  else if (act === 'sample') {
    confirmBox('载入示例数据会覆盖当前全部内容，确定继续吗？', () => { setDB(seed()); UI.project = 'all'; UI.collapsed = []; saveUI(); commit(); toast('已载入示例数据'); },
      { title: '载入示例数据', okText: '覆盖并载入' });
  } else if (act === 'statuslab') {
    confirmBox('将载入一套「状态测试数据」：4 个项目（含 1 个已归档）、12 种自定义状态、约 30 个任务，覆盖全部状态类型、通用 / 项目专属作用域、完成时间打点与逾期 / 临期场景。\n会覆盖当前全部内容（建议先用「导出 JSON 备份」存一份），确定继续吗？', () => {
      setDB(seedStatusLab());
      UI.project = 'all'; UI.collapsed = []; UI.q = ''; UI.view = 'dashboard';
      UI.hideDone = false; UI.sort = 'manual';
      $('#searchInput').value = '';
      saveUI(); commit();
      toast('已载入状态测试数据：4 个项目 / ' + DB.tasks.length + ' 个任务 / ' + DB.statuses.length + ' 种状态');
    }, { title: '载入状态测试数据', okText: '覆盖并载入' });
  } else if (act === 'theme') {
    UI.theme = UI.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = UI.theme;
    saveUI(); render();
  } else if (act === 'reset') {
    confirmBox('将清空全部项目与任务，只保留一个空白的「我的第一个项目」。\n此操作不可撤销，建议先导出 JSON 备份。', resetAllData,
      { title: '清空全部数据', okText: '确认清空' });
  } else {
    doAct(act);
  }
});
$('#fileInput').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!f) return;
  const fr = new FileReader();
  fr.onload = () => {
    let data;
    try { data = JSON.parse(String(fr.result)); } catch (err) { toast('文件解析失败：不是有效的 JSON'); return; }
    if (!data || !Array.isArray(data.tasks) || !Array.isArray(data.projects)) { toast('文件格式不正确，缺少 projects / tasks'); return; }
    confirmBox('即将导入 ' + data.projects.length + ' 个项目、' + data.tasks.length + ' 个任务，并覆盖当前数据。\n确定继续吗？', () => {
      setDB(normalize(data));
      UI.project = 'all'; UI.collapsed = []; UI.q = '';
      $('#searchInput').value = '';
      saveUI(); commit();
      toast('导入成功');
    }, { title: '导入备份', okText: '覆盖导入' });
  };
  fr.onerror = () => toast('读取文件失败');
  fr.readAsText(f, 'utf-8');
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    /* 分层：Markdown 预览 → 右键菜单 → 依赖线浮条 / 选中 → 画笔 → 弹窗 → 框选，每层命中就停 */
    if (__mdPrev) { closeMdPreview(); return; }
    if (ctxEl) { closeCtxMenu(); return; }
    if (outlinePop) { closeProjectOutline(); return; }
    if (depSel) { clearDepSel(); return; }
    if (paintOn) { setPaint(false); return; }
    moreMenu.classList.remove('open');
    if (anyModalOpen()) { closeModal(); return; }          /* 再关弹窗，别顺手清掉框选 */
    if (UI.sideOpen && !UI.sidePinned) { closeSidebar(); return; }
    if (ganttSel.size) setSelection(new Set());
    return;
  }
  /* —— 文件类快捷键：在输入框里也照样生效 —— */
  if ((e.ctrlKey || e.metaKey) && !e.altKey) {
    const k = String(e.key || '').toLowerCase();
    if (k === 's') {
      e.preventDefault();
      const single = (UI.project !== 'all' && UI.project !== '__archived') && projById(UI.project);
      if (!single) { toast('先在标签页里选一个具体项目，再保存'); return; }
      if (e.shiftKey) saveProjectAs(UI.project); else saveProject(UI.project);
      return;
    }
    if (k === 'o' && !e.shiftKey) { e.preventDefault(); openProjectFile(); return; }
  }
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
  const mod = e.ctrlKey || e.metaKey;
  if (mod && !e.shiftKey && !e.altKey && (e.key === 'z' || e.key === 'Z')) { e.preventDefault(); undo(); return; }
  if (mod && !e.shiftKey && !e.altKey && (e.key === 'a' || e.key === 'A') && UI.view === 'gantt' && !anyModalOpen()) {
    e.preventDefault(); selectAllGantt(); return;
  }
  if (anyModalOpen()) return;
  if (e.key === 'Delete' || e.key === 'Backspace') {
    /* 选中了依赖线 → 删的是这条线，不是任务 */
    if (depSel) {
      e.preventDefault();
      const A = taskById(depSel.after), B = taskById(depSel.before);
      clearDepSel();
      if (A && B) removeDep(A.id, B.id);
      return;
    }
    if (ganttSel.size) { e.preventDefault(); deleteTasks(Array.from(ganttSel)); }
    return;
  }
  if (e.key === 'n' || e.key === 'N') { e.preventDefault(); openTaskModal(null); }
});
