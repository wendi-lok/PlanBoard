<script>
'use strict';
/* ==================== 一、基础工具 ==================== */
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-3);
const pad = n => String(n).padStart(2, '0');
const fmt = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => fmt(new Date());
const parseD = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return fmt(d); };
const diffDays = (a, b) => Math.round((parseD(b) - parseD(a)) / 86400000);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const WD = ['日', '一', '二', '三', '四', '五', '六'];
const sum = (arr, f) => arr.reduce((a, b) => a + (f ? f(b) : b), 0);

/* ==================== 二、常量与数据模型 ==================== */
const PALETTE = ['#4f46e5', '#2f7ff0', '#0d9f6e', '#d98014', '#dc2f36', '#8b5cf6', '#e05299', '#0d9f9f'];
/* 状态「类型」决定统计口径：todo=未开始 / doing=进行中 / done=已完成（计入完成率、记录完成时间） */
const ST_MODE = { todo: '未开始', doing: '进行中', done: '已完成' };
const CORE_STATUSES = [
  { id: 'todo', name: '待办', color: '#94a3b8', mode: 'todo', scope: 'global', projectIds: [], order: 10, core: true },
  { id: 'doing', name: '进行中', color: '#2f7ff0', mode: 'doing', scope: 'global', projectIds: [], order: 20, core: true },
  { id: 'done', name: '已完成', color: '#0d9f6e', mode: 'done', scope: 'global', projectIds: [], order: 30, core: true }
];
const PRIO = { 1: { n: '高', cls: 'p1', c: '#dc2f36' }, 2: { n: '中', cls: 'p2', c: '#d98014' }, 3: { n: '低', cls: 'p3', c: '#0d9f6e' } };
const LS_DB = 'planboard.db.v1', LS_UI = 'planboard.ui.v1';

function defaultStatuses() { return CORE_STATUSES.map(s => Object.assign({}, s, { projectIds: [] })); }
/* —— 任务模板：新建任务时的预设（工期 / 优先级 / 状态 / 工时 / 备注） —— */
const BRUSH_COLORS = ['#f6d365', '#f8a35c', '#f27a7a', '#b7e4a0', '#7fd1c8', '#8fb8f5', '#b9a7f7', '#c9ced6', '#f79ec4', '#9fb3c8', '#d9c59a', '#8ad4a8'];
function defaultTemplates() {
  return [
    { id: 'tpl-general', name: '通用任务', title: '', days: 3, priority: 2, status: 'todo', hours: 0, note: '', milestone: false },
    { id: 'tpl-feature', name: '功能开发', title: '新功能开发', days: 5, priority: 2, status: 'todo', hours: 16, note: '', milestone: false },
    { id: 'tpl-bug', name: 'Bug 修复', title: '修复 Bug：', days: 1, priority: 1, status: 'todo', hours: 4, note: '', milestone: false },
    { id: 'tpl-review', name: '方案评审', title: '方案评审', days: 1, priority: 2, status: 'doing', hours: 2, note: '', milestone: false },
    { id: 'tpl-meet', name: '例会 / 沟通', title: '例会', days: 1, priority: 3, status: 'todo', hours: 1, note: '', milestone: false }
  ];
}
function normalizeTpl(x, i) {
  x = x || {};
  return {
    id: String(x.id || ('tpl' + i + '_' + uid())),
    name: String(x.name || '未命名模板').slice(0, 20),
    title: String(x.title || '').slice(0, 120),
    days: clamp(Math.round(Number(x.days) || 1), 1, 365),
    priority: [1, 2, 3].includes(Number(x.priority)) ? Number(x.priority) : 2,
    status: String(x.status || 'todo'),
    hours: Number(x.hours) || 0,
    note: String(x.note || '').slice(0, 500),
    milestone: !!x.milestone
  };
}
const tplById = id => (DB.templates || []).find(t => t.id === id) || null;
function defaultTpl() {
  const list = DB.templates || [];
  if (!list.length) return null;
  return tplById(UI.defTpl) || list[0];
}

function seed() {
  const T = today(), d = n => addDays(T, n);
  const p1 = uid(), p2 = uid();
  let ord = 0;
  const mk = o => Object.assign({
    id: uid(), projectId: p1, parentId: null, title: '', note: '', status: 'todo', priority: 2,
    start: d(0), end: d(3), progress: 0, hours: 0, milestone: false, deps: [], order: ord += 10, doneAt: null
  }, o);
  const g1 = mk({ title: '调研与规划', start: d(-8), end: d(-2), order: 10 });
  ord = 10;
  const i1 = mk({ title: '用户需求访谈', parentId: g1.id, start: d(-8), end: d(-5), status: 'done', progress: 100, hours: 12, priority: 1, order: 20 });
  const i2 = mk({ title: '竞品功能分析', parentId: g1.id, start: d(-5), end: d(-2), status: 'done', progress: 100, hours: 8, order: 30 });
  const g2 = mk({ title: '设计与开发', start: d(-1), end: d(12), order: 40 });
  const i3 = mk({ title: '信息架构与原型', parentId: g2.id, start: d(-1), end: d(3), status: 'doing', progress: 65, hours: 20, priority: 1, order: 50, deps: [i1.id] });
  const i4 = mk({ title: '视觉设计稿', parentId: g2.id, start: d(4), end: d(8), hours: 16, priority: 2, order: 60, deps: [i3.id] });
  const i5 = mk({ title: '前端页面开发', parentId: g2.id, start: d(6), end: d(12), hours: 40, priority: 1, order: 70, deps: [i4.id] });
  const i6 = mk({ title: '后端接口开发', parentId: g2.id, start: d(4), end: d(11), hours: 32, order: 80, deps: [i3.id] });
  const g3 = mk({ title: '测试与上线', start: d(13), end: d(20), order: 90 });
  const i7 = mk({ title: '联调与回归测试', parentId: g3.id, start: d(13), end: d(17), hours: 16, priority: 1, order: 100, deps: [i5.id, i6.id] });
  const i8 = mk({ title: '灰度发布', parentId: g3.id, start: d(18), end: d(19), hours: 6, order: 110, deps: [i7.id] });
  const i9 = mk({ title: '正式上线', parentId: g3.id, start: d(20), end: d(20), milestone: true, priority: 1, order: 120, deps: [i8.id] });

  const j1 = mk({ projectId: p2, title: '读书 · 每月两本', start: d(-20), end: d(40), order: 10 });
  const j2 = mk({ projectId: p2, parentId: j1.id, title: '《设计心理学》', start: d(-20), end: d(-6), status: 'done', progress: 100, hours: 10, order: 20 });
  const j3 = mk({ projectId: p2, parentId: j1.id, title: '《深入理解计算机系统》', start: d(-5), end: d(25), status: 'doing', progress: 30, hours: 24, priority: 2, order: 30 });
  const j4 = mk({ projectId: p2, title: '身体锻炼', start: d(-14), end: d(60), order: 40 });
  const j5 = mk({ projectId: p2, parentId: j4.id, title: '每周跑步 3 次', start: d(-14), end: d(60), status: 'doing', progress: 45, hours: 30, priority: 1, order: 50 });
  const j6 = mk({ projectId: p2, parentId: j4.id, title: '体脂率降到 18%', start: d(0), end: d(60), priority: 3, order: 60 });
  const j7 = mk({ projectId: p2, title: '技能提升', start: d(0), end: d(15), order: 70 });
  const j8 = mk({ projectId: p2, parentId: j7.id, title: '学完 TypeScript 进阶课', start: d(0), end: d(15), status: 'doing', progress: 20, hours: 18, priority: 2, order: 80 });
  const j9 = mk({ projectId: p2, parentId: j7.id, title: '做一个副业小项目', start: d(12), end: d(45), priority: 3, order: 90, deps: [j8.id] });

  const tasks = [g1, i1, i2, g2, i3, i4, i5, i6, g3, i7, i8, i9, j1, j2, j3, j4, j5, j6, j7, j8, j9];
  const isoAt = (ds, h, mi) => { const p = ds.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2], h || 18, mi || 0, 0).toISOString(); };
  i1.doneAt = isoAt(i1.end, 17, 20);
  i2.doneAt = isoAt(i2.end, 19, 5);
  j2.doneAt = isoAt(j2.end, 21, 40);
  syncParents(tasks);
  rollup(tasks);
  return {
    version: 2,
    statuses: defaultStatuses().concat([
      { id: uid(), name: '待验收', color: '#8b5cf6', mode: 'doing', scope: 'project', projectIds: [p1], order: 40, core: false }
    ]),
    projects: [
      { id: p1, name: '官网改版 v2', color: PALETTE[0], start: d(-8), end: d(20), desc: '公司官网整体重构，含设计、前后端开发与上线。', archived: false },
      { id: p2, name: '个人年度计划', color: PALETTE[2], start: d(-20), end: d(60), desc: '阅读、锻炼与技能提升三条主线。', archived: false }
    ],
    templates: defaultTemplates(),
    paint: {},
    depColors: {},
    tasks
  };
}

/* ==================== 状态测试台数据 ====================
   覆盖：全部状态类型（未开始/进行中/已完成）× 作用域（通用/项目专属）
   × 完成时间打点（近 14 天，含提前/准时/超期）× 逾期 / 临期 / 里程碑
   × 父子汇总 / 已归档项目 / 已取消状态
   ==================================================== */
function seedStatusLab() {
  const T = today(), d = n => addDays(T, n);
  const isoAt = (ds, h, mi) => { const p = ds.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2], h == null ? 18 : h, mi || 0, 0).toISOString(); };
  const pA = uid(), pB = uid(), pC = uid(), pD = uid();
  /* 固定 id，方便反复载入对照 */
  const S = {
    backlog: 'st_backlog', review: 'st_review', dev: 'st_dev', coderev: 'st_coderev',
    blocked: 'st_blocked', accept: 'st_accept', delivered: 'st_delivered', online: 'st_online',
    cancelled: 'st_cancelled', clientok: 'st_clientok', punch: 'st_punch', plan: 'st_plan'
  };
  let ord = 0;
  const mk = o => Object.assign({
    id: uid(), projectId: pA, parentId: null, title: '', note: '', status: 'todo', priority: 2,
    start: T, end: d(3), progress: 0, hours: 0, milestone: false, deps: [], order: ord += 10, doneAt: null
  }, o);

  /* —— 状态清单：3 个核心 + 9 个通用自定义 + 3 个项目专属 —— */
  const statuses = defaultStatuses().concat([
    { id: S.backlog, name: '待排期', color: '#64748b', mode: 'todo', scope: 'global', projectIds: [], order: 40, core: false },
    { id: S.review, name: '需求评审', color: '#0d9f9f', mode: 'doing', scope: 'global', projectIds: [], order: 50, core: false },
    { id: S.dev, name: '开发中', color: '#2f7ff0', mode: 'doing', scope: 'global', projectIds: [], order: 60, core: false },
    { id: S.coderev, name: '代码评审', color: '#8b5cf6', mode: 'doing', scope: 'global', projectIds: [], order: 70, core: false },
    { id: S.blocked, name: '阻塞中', color: '#dc2f36', mode: 'doing', scope: 'global', projectIds: [], order: 80, core: false },
    { id: S.accept, name: '待验收', color: '#d98014', mode: 'doing', scope: 'global', projectIds: [], order: 90, core: false },
    { id: S.delivered, name: '已交付', color: '#0d9f6e', mode: 'done', scope: 'global', projectIds: [], order: 100, core: false },
    { id: S.online, name: '已上线', color: '#16a34a', mode: 'done', scope: 'global', projectIds: [], order: 110, core: false },
    { id: S.cancelled, name: '已取消', color: '#94a3b8', mode: 'todo', scope: 'global', projectIds: [], order: 120, core: false },
    { id: S.clientok, name: '待客户确认', color: '#e05299', mode: 'doing', scope: 'project', projectIds: [pB], order: 130, core: false },
    { id: S.punch, name: '已打卡', color: '#0d9f9f', mode: 'doing', scope: 'project', projectIds: [pC], order: 140, core: false },
    { id: S.plan, name: '计划中', color: '#94a3b8', mode: 'todo', scope: 'project', projectIds: [pC], order: 150, core: false }

/* 父任务日期由子任务自动汇总 */
function rollup(list) {
  const src = list || DB.tasks;
  const byParent = {};
  src.forEach(t => { if (t.parentId) (byParent[t.parentId] = byParent[t.parentId] || []).push(t); });
  Object.keys(byParent).forEach(pid => {
    const kids = byParent[pid];
    const p = src.find(t => t.id === pid);
    if (!p) return;
    const starts = kids.map(k => k.start).filter(Boolean).sort();
    const ends = kids.map(k => k.end).filter(Boolean).sort();
    if (starts.length) p.start = starts[0];
    if (ends.length) p.end = ends[ends.length - 1];
  });
}

function normalize(d) {
  d.projects = (d.projects || []).map((p, i) => Object.assign({ archived: false, desc: '', color: PALETTE[i % PALETTE.length] }, p));
  /* —— 状态体系迁移：补齐核心状态、校验自定义状态、回收无用状态 —— */
  const raw = Array.isArray(d.statuses) ? d.statuses : [];
  const seen = new Set();
  d.statuses = [];
  CORE_STATUSES.forEach(c => {
    const hit = raw.find(s => s && s.id === c.id);
    seen.add(c.id);
    d.statuses.push({
      id: c.id, name: (hit && hit.name) || c.name, color: (hit && hit.color) || c.color,
      mode: c.mode, scope: 'global', projectIds: [], order: (hit && Number(hit.order)) || c.order, core: true
    });
  });
  raw.forEach(s => {
    if (!s || !s.id || seen.has(s.id)) return;
    seen.add(s.id);
    d.statuses.push({
      id: String(s.id), name: String(s.name || '未命名状态').slice(0, 24),
      color: s.color || PALETTE[d.statuses.length % PALETTE.length],
      mode: ST_MODE[s.mode] ? s.mode : 'doing',
      scope: s.scope === 'project' ? 'project' : 'global',
      projectIds: Array.isArray(s.projectIds) ? s.projectIds.filter(x => d.projects.some(p => p.id === x)) : [],
      order: Number(s.order) || (d.statuses.length * 10 + 30), core: false
    });
  });
  const ids = new Set(d.tasks.map(t => t.id));
  d.tasks = (d.tasks || []).map(t => {
    t.deps = Array.isArray(t.deps) ? t.deps.filter(x => ids.has(x) && x !== t.id) : [];
    t.progress = clamp(Number(t.progress) || 0, 0, 100);
    t.priority = [1, 2, 3].includes(Number(t.priority)) ? Number(t.priority) : 2;
    t.order = Number(t.order) || 0;
    t.hours = Number(t.hours) || 0;
    /* 单条任务的自定义颜色（null = 跟随项目颜色） */
    t.color = /^#[0-9a-fA-F]{3,8}$/.test(String(t.color || '')) ? String(t.color) : null;
    /* 条上文字的颜色（null = 自动：按条身明暗在白字 / 深字里挑一个对比度高的，见 barTextColor） */
    t.textColor = /^#[0-9a-fA-F]{3,8}$/.test(String(t.textColor || '')) ? String(t.textColor) : null;
    /* 附件（2026-10-02 整套重做，只有三种）：
       · 'md'   —— Markdown 笔记。正文读成 data URL 内嵌进项目文件，单击 = 打开只读预览卡片；
       · 'path' —— 只存一行「本机绝对路径」。不读文件、不占体积，单击 = 把这个路径复制到剪贴板；
       · 'link' —— 外部网址，单击 = 新标签打开。
       ★ 这里不再有任何「调起本机程序」的逻辑（Office 协议 / file:// 跳转全都删了）——
         网页从设计上就没有这个能力，留着只会骗用户点出一个报错框。
       老数据迁移：以前的内嵌本地文件 'file'，扩展名是 md 的继续当笔记（正文还在），
       其它一律降级成「路径型」，内嵌正文丢掉。 */
    t.attachments = (Array.isArray(t.attachments) ? t.attachments : []).map((a, i) => {
      a = a || {};
      const name = String(a.name || '附件').slice(0, 160);
      const url = String(a.url || '');
      const path = normLocalPath(a.path).slice(0, 400);
      const raw = String(a.kind || '');
      const looksMd = /\.(md|markdown|mdown|mkd)$/i.test(name);
      const looksPdf = /\.pdf$/i.test(name);
      /* 四种：'md'（内嵌笔记）/ 'pdf'（内嵌 PDF）/ 'path'（只存一行本机路径）/ 'link'（网址）。
         老数据的 kind:'file' 在这里被拆开：名字是 .md / .pdf 而且内嵌正文还留着的，
         直接升级成能预览的类型（PDF 老数据也能因此「复活」成可预览的）。
         正文丢了的就退化成路径型 —— 路径也空的话，行上会提示「双击补路径」。 */
      let kind = (raw === 'link' || raw === 'md' || raw === 'pdf' || raw === 'path') ? raw
        : (looksMd ? 'md' : (looksPdf ? 'pdf' : 'path'));
      const base = {
        id: String(a.id || ('at' + i + uid())), name,
        size: Number(a.size) || 0, mime: String(a.mime || ''),
        addedAt: a.addedAt || new Date().toISOString()
      };
      if (kind === 'link') {
        if (!/^https?:\/\//i.test(url)) return null;
        return Object.assign(base, { kind: 'link', url, path: '' });
      }
      if ((kind === 'md' || kind === 'pdf') && /^data:/i.test(url)) {
        return Object.assign(base, { kind, url, path: '' });
      }
      return Object.assign(base, { kind: 'path', url: '', size: 0, mime: '', path });
    }).filter(Boolean);
    if (t.parentId && (!ids.has(t.parentId) || t.parentId === t.id)) t.parentId = null;
    if (!d.projects.some(p => p.id === t.projectId)) t.projectId = d.projects[0] ? d.projects[0].id : '';
    /* 状态不存在则自动补建一个自定义状态，避免历史数据丢状态 */
    if (!d.statuses.some(s => s.id === t.status)) {
      d.statuses.push({
        id: String(t.status || ('s_' + uid())), name: '状态 ' + String(t.status || '?').slice(0, 12),
        color: PALETTE[d.statuses.length % PALETTE.length], mode: 'doing', scope: 'global',
        projectIds: [], order: d.statuses.length * 10 + 30, core: false
      });
    }
    /* 日期兜底：任何非法 / 空日期都纠正成合法值，避免甘特图算出 NaN 坐标 */
    const dtOk = v => /^\d{4}-\d{2}-\d{2}$/.test(String(v || ''));
    if (!dtOk(t.start)) t.start = dtOk(t.end) ? t.end : today();
    if (!dtOk(t.end)) t.end = t.start;
    if (t.end < t.start) { const sw = t.start; t.start = t.end; t.end = sw; }
    t.status = String(t.status);
    const st = d.statuses.find(s => s.id === t.status);
    if (st.mode === 'done') {
      if (!t.doneAt) t.doneAt = new Date().toISOString();
      t.progress = 100;
    } else {
      t.doneAt = null;
    }
    if (!t.doneAt) t.doneAt = null;
    return t;
  });
  /* —— 任务模板 —— */
  d.templates = (Array.isArray(d.templates) && d.templates.length ? d.templates : defaultTemplates()).map(normalizeTpl);
  /* —— 背景涂色：键是「日期|任务id」，值是该格的色；任务没了就把对应的色块一并清掉 —— */
  const paint = (d.paint && typeof d.paint === 'object' && !Array.isArray(d.paint)) ? d.paint : {};
  const kept = {};
  Object.keys(paint).forEach(k => {
    const p = String(k).split('|');
    if (p.length !== 2 || !/^\d{4}-\d{2}-\d{2}$/.test(p[0]) || !ids.has(p[1])) return;
    if (!/^#[0-9a-fA-F]{3,8}$/.test(String(paint[k]))) return;
    kept[k] = String(paint[k]);
  });
  d.paint = kept;
  /* —— 依赖线自定义颜色：键是「后置任务id|前置任务id」，值是该线的色 —— */
  const rawDc = (d.depColors && typeof d.depColors === 'object' && !Array.isArray(d.depColors)) ? d.depColors : {};
  const dcKept = {};
  Object.keys(rawDc).forEach(k => {
    const p = String(k).split('|');
    if (p.length !== 2 || !ids.has(p[0]) || !ids.has(p[1])) return;
    if (!/^#[0-9a-fA-F]{3,8}$/.test(String(rawDc[k]))) return;
    dcKept[k] = String(rawDc[k]);
  });
  d.depColors = dcKept;
  /* 保留所有自定义状态：即使暂时没有任务使用，也不要在重新载入时被清掉 */
  return d;
}

/* ==================== 三、状态体系（通用 / 项目专属） ==================== */
/* STORE.list 始终指向当前 DB.statuses 这同一个数组，保证初始化阶段也可安全访问 */
const STORE = { list: defaultStatuses() };
function allStatuses() { return STORE.list.slice().sort((a, b) => (a.order || 0) - (b.order || 0)); }
function statusById(id) { return STORE.list.find(s => s.id === id) || null; }
function statusOf(t) { return (t && statusById(t.status)) || CORE_STATUSES[0]; }
function modeOf(key) { const s = statusById(key); return s ? s.mode : 'todo'; }
function isDone(t) { return !!t && modeOf(t.status) === 'done'; }
function isDoneKey(k) { return modeOf(k) === 'done'; }
function isTodoKey(k) { return modeOf(k) === 'todo'; }
/* 某状态是否适用于某个作用域：'all' / '__archived' / 具体项目 id */
function statusApplies(s, pid) {
  if (s.scope === 'global') return true;
  const ids = (s.projectIds || []).filter(id => DB.projects.some(p => p.id === id));
  if (!ids.length) return false;
  if (pid === 'all') return ids.some(id => !isArchivedProj(id));
  if (pid === '__archived') return ids.some(id => isArchivedProj(id));
  return ids.includes(pid);
}
function scopeStatuses(pid) { return allStatuses().filter(s => statusApplies(s, pid)); }
function firstStatusOfMode(mode) {
  return (allStatuses().find(s => s.mode === mode) || CORE_STATUSES[0]).id;
}
function statusName(key) { const s = statusById(key); return s ? s.name : String(key); }
function statusColor(key) { const s = statusById(key); return s ? s.color : '#94a3b8'; }
function stPill(key, attrs) {
  const s = statusById(key);
  return '<span class="st-pill"' + (attrs || '') + '><span class="dt" style="background:' + (s ? s.color : '#94a3b8') + '"></span>' +
    '<span class="tx">' + esc(s ? s.name : key) + '</span></span>';
}
/* 统一的状态变更入口：负责进度联动 + 完成时间打点 */
function applyStatusChange(t, id, when) {
  const s = statusById(id);
  if (!t || !s) return false;
  const changed = t.status !== id;
  const wasDone = isDone(t);
  t.status = id;
  if (s.mode === 'done') {
    t.progress = 100;
    if (!t.doneAt) t.doneAt = when || new Date().toISOString();
  } else {
    t.doneAt = null;
    if (s.mode === 'todo' && t.progress >= 100) t.progress = 0;
    else if (s.mode === 'doing' && t.progress >= 100) t.progress = 50;
  }
  return changed || wasDone !== isDone(t);
}
const shortTitle = s => (String(s || '').length > 14 ? String(s).slice(0, 14) + '…' : String(s || ''));
/* 时间展示辅助 */
const fmtDT = iso => {
  const d = new Date(iso);
  if (isNaN(d)) return '—';
  return fmt(d) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
};
const fmtD = iso => { const d = new Date(iso); return isNaN(d) ? '—' : fmt(d); };
const dayWord = n => (n === 0 ? '当天' : n + ' 天');
/* —— 用时（天）——
   定义：从「开始日期」到「现在」的天数。任务一旦完成，终点锁在完成那天，天数就固定不再变化。
   没填开始日期 → null（展示为「—」）。 */
function taskSpanEnd(t) {
  if (!t || !t.start) return null;
  const ref = isDone(t) ? (t.doneAt ? fmtD(t.doneAt) : (t.end || today())) : today();
  return /^\d{4}-\d{2}-\d{2}$/.test(ref) ? ref : null;
}
function taskSpanDays(t) {
  const ref = taskSpanEnd(t);
  return ref ? Math.max(0, diffDays(t.start, ref)) : null;
}
/* 用时是否已经「定死」（已完成的任务不再随日历增长） */
function spanLocked(t) { return isDone(t) && !!t.doneAt; }
/* 悬停提示：用时 12 天（2026-09-01 → 2026-09-13） */
function spanTip(t) {
  const d = taskSpanDays(t);

/* —— 右键上下文菜单（全应用共用） —— */
let ctxEl = null;
function ctxOutside(e) { if (ctxEl && !ctxEl.contains(e.target)) closeCtxMenu(); }
/* blur 必须挂捕获阶段才能听到窗口失焦，但捕获阶段同样会收到「页面内部某个元素失焦」——
   点菜单里的 <button> 时 mousedown 会把焦点从输入框抢过来，那一刻就会误收菜单，
   紧接着 click 再也派发不到按钮上（症状：右键菜单点了没反应、控制台零报错）。
   所以这里只认「整个页面真的没焦点了」（切程序 / 切标签页）。 */
function ctxWinBlur() { if (!document.hasFocus()) closeCtxMenu(); }
function closeCtxMenu() {
  const el = ctxEl;
  ctxEl = null;
  /* 先摘引用再删节点：菜单可能已经被别的监听（失焦 / 滚动）摘掉了，
     直接在已脱离文档的节点上 remove 会抛 NotFoundError，把后面的回调一起带崩 */
  if (el) { try { if (el.parentNode) el.parentNode.removeChild(el); } catch (e) { /* ignore */ } }
  window.removeEventListener('pointerdown', ctxOutside, true);
  window.removeEventListener('resize', closeCtxMenu, true);
  window.removeEventListener('blur', ctxWinBlur, true);
  document.removeEventListener('scroll', closeCtxMenu, true);
}
function openCtxMenu(x, y, items) {
  closeCtxMenu();
  const el = document.createElement('div');
  el.className = 'ctx';
  el.innerHTML = items.map(it => {
    if (it.sep) return '<div class="ctx-sep"></div>';
    if (it.head != null) return '<div class="ctx-head">' + esc(it.head) + '</div>';
    return '<button class="ctx-item' + (it.danger ? ' danger' : '') + '" data-ci>' + esc(it.label) +
      (it.k ? '<span class="k">' + esc(it.k) + '</span>' : '') + '</button>';
  }).join('');
  document.body.appendChild(el);
  const r = el.getBoundingClientRect();
  el.style.left = Math.max(6, Math.min(x, window.innerWidth - r.width - 6)) + 'px';
  el.style.top = Math.max(6, Math.min(y, window.innerHeight - r.height - 6)) + 'px';
  const acts = items.filter(it => !it.sep && it.head == null);
  $$('[data-ci]', el).forEach((b, i) => {
    b.addEventListener('click', () => {
      const fn = acts[i] && acts[i].onClick;
      try { closeCtxMenu(); } catch (e) { /* ignore */ }
      if (fn) fn();                 /* 关菜单失败也绝不能把「点完之后要干的事」吃掉 */
    });
  });
  ctxEl = el;
  /* 延后一拍挂全局监听，避免本次右键自身的 pointerdown 立刻把菜单关掉 */
  setTimeout(() => {
    if (!ctxEl) return;
    window.addEventListener('pointerdown', ctxOutside, true);
    window.addEventListener('resize', closeCtxMenu, true);

}

/* ==================== 六、仪表盘 ==================== */
function donutStack(items, size, stroke) {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r, total = sum(items, i => i.v);
  let off = 0, arcs = '';
  if (total > 0) {
    items.forEach(it => {
      const len = it.v / total * c;
      if (len <= 0) return;
      arcs += '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="' + it.c + '" stroke-width="' + stroke +
        '" stroke-dasharray="' + len.toFixed(2) + ' ' + (c - len).toFixed(2) + '" stroke-dashoffset="' + (-off).toFixed(2) +
        '" transform="rotate(-90 ' + (size / 2) + ' ' + (size / 2) + ')"></circle>';
      off += len;
    });
  }
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '" style="flex:0 0 auto">' +
    '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="var(--panel-3)" stroke-width="' + stroke + '"></circle>' + arcs + '</svg>';
}
function distRow(name, v, max, color, unit) {
  const w = max > 0 ? Math.round(v / max * 100) : 0;
  return '<div class="dist-row"><span class="name">' + esc(name) + '</span>' + barOf(w, color) + '<span class="num">' + v + ' ' + (unit || '项') + '</span></div>';
}
/* —— 完成时间统计 —— */
function completionRows(ts) {
  return ts.filter(t => isDone(t) && t.doneAt).map(t => {
    const dd = fmtD(t.doneAt);
    return {
      t, day: dd,
      span: t.start ? Math.max(0, diffDays(t.start, dd)) : null,
      diff: t.end ? diffDays(dd, t.end) : null      /* 正数 = 提前完成，负数 = 超期完成 */
    };
  }).sort((a, b) => (a.t.doneAt < b.t.doneAt ? 1 : -1));
}
function completionStats(rows) {
  const avg = a => (a.length ? a.reduce((x, y) => x + y, 0) / a.length : null);
  const spans = rows.map(r => r.span).filter(v => v != null);
  const diffs = rows.map(r => r.diff).filter(v => v != null);
  const onTime = rows.filter(r => r.diff != null && r.diff >= 0).length;
  const trend = [];
  for (let i = 13; i >= 0; i--) {
    const day = addDays(today(), -i);
    trend.push({ day, n: rows.filter(r => r.day === day).length });
  }
  return {
    n: rows.length,
    avgSpan: avg(spans),
    avgDiff: avg(diffs),
    onTime,
    settled: diffs.length,
    trend,
    week: trend.slice(7).reduce((a, b) => a + b.n, 0),
    onTimeRate: diffs.length ? Math.round(onTime / diffs.length * 100) : null
  };
}

  const diffTxt = stat.avgDiff == null ? '—'
    : (Math.abs(stat.avgDiff) < 0.5 ? '准时完成'
      : (stat.avgDiff > 0 ? '提前 ' + one(stat.avgDiff) : '超期 ' + one(-stat.avgDiff)));
  const tiles =
    '<div class="mstat">' +
      '<div class="m"><div class="k">已记录完成</div><div class="v">' + stat.n + ' <small>项</small></div></div>' +
      '<div class="m"><div class="k">平均完成耗时</div><div class="v">' + one(stat.avgSpan) + ' <small>天</small></div></div>' +
      '<div class="m"><div class="k">相对截止</div><div class="v ' + diffCls + '">' + diffTxt + '</div></div>' +
      '<div class="m"><div class="k">近 7 天完成</div><div class="v">' + stat.week + ' <small>项</small></div></div>' +

/* ==================== 七、甘特图 ==================== */
/* NAME_W（左侧大纲列宽）在 UI 初始化那里就声明了 —— 它要能像 Excel 一样拖宽窄 */
const ROW_H = 38;
/* 行下面留出来的空白区高度：拖圆点新建任务时可以落在这里，双击这里也能新建 */
const G_BLANK_H = 148;
const DAY_W = { day: 32, week: 11, month: 3.6 };
/* 时间线缩放：最终「每天多少像素」= 基准 × UI.zoom，再做上下限夹取 */
const DAYW_MIN = 3, DAYW_MAX = 180, ZOOM_MIN = 0.12, ZOOM_MAX = 60;
let ganttScroll = { l: 0, t: 0, init: false };
let ganttSel = new Set();      /* 框选中的任务 id */
let ganttDeps = [];            /* 当前渲染出的依赖线段，用于几何命中（右键 / 左键选中） */
let ganttRows = [];            /* 当前渲染出的行（供纵向拖拽换算目标位置） */
let paintOn = false;           /* 背景画笔是否开启（会话内，不持久化） */
function ganttScale() { return DAY_W[UI.scale] ? UI.scale : 'day'; }
function dayWOf() { return clamp(DAY_W[ganttScale()] * (Number(UI.zoom) || 1), DAYW_MIN, DAYW_MAX); }
function selectAllGantt() {
  /* 全选和「项目分组」无关，走不分组的那份行表，免得把分组行也当成任务 */
  const rows = treeRows(UI.project, true).filter(r => !(UI.hideDone && isDone(r.t)));
  ganttSel = new Set(rows.map(r => r.t.id));
  paintSelection();
  toast('已全选 ' + ganttSel.size + ' 个任务');
}
function pruneSelection(visibleIds) {
  const alive = new Set(DB.tasks.map(t => t.id));
  const next = new Set();
  ganttSel.forEach(id => {
    if (!alive.has(id)) return;
    if (visibleIds && !visibleIds.has(id)) return;   /* 被隐藏（收起 / 隐藏已完成）的任务自动退出选择 */
    next.add(id);
  });

}
/* 把选中态刷到当前 DOM（仅在选框拖拽 / Esc 清空时用，渲染时由 markup 自带） */
/* 当前视图的根元素：四个视图都能装选中态，所以这里要兜底找对容器 */
function viewRootEl() {
  const v = document.getElementById('view');
  return (v && v.firstElementChild) || v || null;
}
function paintSelection(root) {
  root = root || viewRootEl();
  if (!root || !root.querySelectorAll) return;
  $$('.g-row', root).forEach(row => row.classList.toggle('selrow', ganttSel.has(row.dataset.rowtask)));
  $$('.g-bar,.g-sum,.g-ms', root).forEach(el => el.classList.toggle('sel', ganttSel.has(el.dataset.task)));
  $$('.kb-card', root).forEach(el => el.classList.toggle('selcard', ganttSel.has(el.dataset.task)));
  $$('.kb-sub', root).forEach(el => el.classList.toggle('selsub', ganttSel.has(el.dataset.subrow)));
  $$('.lv-row', root).forEach(el => el.classList.toggle('selrow', ganttSel.has(el.dataset.task)));
  $$('.alert-item', root).forEach(el => el.classList.toggle('seldash', ganttSel.has(el.dataset.task)));
  /* 仪表盘「各项目进度」展开出来的任务列表（同一套 .po-row）也要跟着高亮 */

}
function setSelection(ids, root) { ganttSel = ids instanceof Set ? ids : new Set(ids); paintSelection(root); }

function ganttRange(rows, scale) {
  let min = null, max = null;
  rows.forEach(r => {
    const t = r.t;
    if (!t) return;                              /* 项目分组行没有日期 */
    if (t.start && (!min || t.start < min)) min = t.start;
    if (t.end && (!max || t.end > max)) max = t.end;
  });
  if (!min) min = today();
  if (!max) max = addDays(min, 20);
  min = addDays(min, -4);
  max = addDays(max, 4);
  if (scale === 'week') { const lead = (parseD(min).getDay() + 6) % 7; min = addDays(min, -lead); }
  if (scale === 'month') { const d = parseD(min); min = fmt(new Date(d.getFullYear(), d.getMonth(), 1)); }
  return { min, max, total: diffDays(min, max) + 1 };
}

/* —— 背景涂色的「色带」圆角：键是 "YYYY-MM-DD|taskId"，同一行相邻日期算作一条带 —— */
function pcEdges(k) {
  const i = String(k).indexOf('|');
  if (i < 1) return { l: false, r: false };
  const d = k.slice(0, i), r = k.slice(i + 1), P = DB.paint || {};
  return { l: !!P[addDays(d, -1) + '|' + r], r: !!P[addDays(d, 1) + '|' + r] };
}
function pcClass(k) {
  const e = pcEdges(k);
  return 'pc' + (e.l ? '' : ' rc-l') + (e.r ? '' : ' rc-r');
}
/* 涂 / 擦掉一格之后，把这一格和它左右邻居的圆角重新算一遍 */
function pcFixEdges(k, scope) {
  const box = scope || document;
  const set = kk => {
    const el = box.querySelector('[data-pc="' + kk + '"]');
    if (!el) return;
    const e = pcEdges(kk);
    el.classList.toggle('rc-l', !e.l);
    el.classList.toggle('rc-r', !e.r);
  };
  set(k);
  const i = String(k).indexOf('|');
  if (i < 1) return;
  const d = k.slice(0, i), r = k.slice(i + 1);
  set(addDays(d, -1) + '|' + r);
  set(addDays(d, 1) + '|' + r);
}

function renderGantt(root) {
  if (!root) return;
  const scale = ganttScale();
  const dayW = dayWOf();
  const rows = treeRows(UI.project).filter(r => r.proj || !(UI.hideDone && isDone(r.t)));
  /* 项目分组行：把该项目的任务数 / 完成度 / 时间跨度汇总出来，收起时也能一眼看到 */
  rows.forEach(r => {
    if (!r.proj) return;
    const ts = DB.tasks.filter(t => t.projectId === r.pid && !(UI.hideDone && isDone(t)));
    r.n = ts.length;
    r.done = ts.filter(isDone).length;
    r.pct = r.n ? Math.round(sum(ts, t => isDone(t) ? 100 : clamp(t.progress, 0, 100)) / r.n) : 0;
    r.min = ts.reduce((m, t) => (t.start && (!m || t.start < m)) ? t.start : m, null);
    r.max = ts.reduce((m, t) => (t.end && (!m || t.end > m)) ? t.end : m, null);
  });
  /* 开了「隐藏已完成」而某个项目全做完时，那个空分组不占位置 */
  for (let i = rows.length - 1; i >= 0; i--) { if (rows[i].proj && !rows[i].n) rows.splice(i, 1); }
  ganttDeps = [];
  /* 只把「任务行」交给纵向拖拽 / 行序重排（项目分组行不参与换位） */
  ganttRows = rows.filter(r => r.t);
  /* 表头上报的「N 个项目 · M 条任务」要按分组统计，不能只数当前展开出来的行 ——
     整组收起时任务数不该变成 0 */
  const projRows = rows.filter(r => r.proj);
  const nProj = projRows.length;
  const nTask = projRows.reduce((a, r) => a + (r.n || 0), 0);
  pruneSelection(new Set(ganttRows.map(r => r.t.id)));
  if (!rows.length) {
    root.innerHTML = '<div class="g-empty"><div style="font-size:15px;font-weight:600;color:var(--text-2);margin-bottom:6px">' +
      (UI.q.trim() ? '没有匹配的任务' : '这里还没有任务') + '</div>' +
      '<div style="margin-bottom:14px">' + (DB.projects.length ? '先新建一个任务，或切换到其他项目看看。' : '先创建一个项目，再添加任务。') + '</div>' +
      (DB.projects.length
        ? '<button class="btn primary" data-act="newTask">新建任务</button>'
        : '<button class="btn primary" data-act="newProject">新建项目</button>') + '</div>';
    return;
  }
  let range = ganttRange(rows, scale);
  const availW = Math.max(320, (($('#view') || {}).clientWidth || 1200) - NAME_W - 2);
  /* 时间轴不足一屏时向后延伸，避免右侧留白（甘特图常规做法） */
  const need = Math.ceil(availW / dayW) + 1;
  if (range.total < need) range = { min: range.min, max: addDays(range.min, need - 1), total: need };
  const totalW = Math.round(range.total * dayW);
  const X = i => Math.round(i * dayW);                       /* 第 i 天左边界（消除取整累积误差） */
  const trackW = Math.max(totalW, availW);                   /* 轨道铺满可视宽度 */
  const bodyH = rows.length * ROW_H;
  const days = [];
  for (let i = 0; i < range.total; i++) {
    const s = addDays(range.min, i), d = parseD(s);
    days.push({ s, d, wd: d.getDay() });
  }

  /* —— 表头：月行 + 单元行 —— */
  const months = [];
  days.forEach(day => {
    const key = day.d.getFullYear() * 100 + day.d.getMonth() + 1;
    const last = months[months.length - 1];
    if (last && last.key === key) last.n++; else months.push({ key, n: 1, y: day.d.getFullYear(), m: day.d.getMonth() + 1 });
  });
  let cum = 0;
  const monthHtml = months.map(mo => {
    const w = X(cum + mo.n) - X(cum);
    cum += mo.n;
    const label = w >= 46 ? mo.y + '年' + mo.m + '月' : (w >= 24 ? mo.m + '月' : '');
    return '<div class="g-month" style="width:' + w + 'px" title="' + mo.y + '年' + mo.m + '月">' +
      (label ? '<span class="gm-lbl">' + label + '</span>' : '') + '</div>';
  }).join('');

  let unitHtml = '';

    unitHtml = days.map((d, i) => {
      const w = X(i + 1) - X(i);

        d.d.getDate() + '</div>';

  } else if (scale === 'week') {
    const weeks = [];
    days.forEach(day => {
