  /* —— 背景层：周末 / 今日线 —— */
  let layer = '';
  if (scale !== 'month' && UI.wk) {
    days.forEach((day, i) => {
      if (day.wd === 0 || day.wd === 6) layer += '<div class="wkv" style="left:' + X(i) + 'px;width:' + (X(i + 1) - X(i)) + 'px"></div>';
    });
  }
  /* —— 背景涂色（画笔）：按「日期 × 行」铺半透明色块 —— */
  const paintKeys = Object.keys(DB.paint || {});
  if (paintKeys.length) {
    const rowOf = {};
    rows.forEach((r, i) => { if (r.t) rowOf[r.t.id] = i; });
    paintKeys.forEach(k => {
      const sp = k.indexOf('|');
      if (sp < 1) return;
      const dt = k.slice(0, sp), tid = k.slice(sp + 1);
      const ri = rowOf[tid];
      if (ri === undefined) return;
      const di = diffDays(range.min, dt);
      if (!(di >= 0 && di < range.total)) return;
      layer += '<i class="' + pcClass(k) + '" data-pc="' + k + '" style="left:' + X(di) + 'px;width:' + (X(di + 1) - X(di)) +
        'px;top:' + (ri * ROW_H) + 'px;height:' + ROW_H + 'px;background:' + esc(DB.paint[k]) + '"></i>';
    });
  }
  const todayIdx = diffDays(range.min, today());
  if (UI.todayLine && todayIdx >= 0 && todayIdx <= range.total) {
    layer += '<div class="todayline" style="left:' + (X(todayIdx) + Math.round(dayW / 2) - 1) + 'px"></div>';
  }

  /* —— 任务行 —— */
  const yOf = {};
  rows.forEach((r, i) => { if (r.t) yOf[r.t.id] = i * ROW_H + ROW_H / 2; });

  /* —— 依赖线 —— */
  let paths = '';
  if (UI.deps) {
    const endX = t => X(diffDays(range.min, t.end || t.start || today()) + 1);
    const stX = t => X(diffDays(range.min, t.start || t.end || today()));
    rows.forEach(r => {
      const t = r.t;
      if (!t) return;
      (t.deps || []).forEach(pid => {
        const pred = taskById(pid);
        if (!pred || yOf[pid] === undefined || yOf[t.id] === undefined) return;
        const y1 = yOf[pid], y2 = yOf[t.id];
        const x1 = pred.milestone ? stX(pred) + 8 : endX(pred);
        const x2 = (t.milestone ? stX(t) + 8 : stX(t)) - 1;
        if (!Number.isFinite(x1) || !Number.isFinite(x2) || !Number.isFinite(y1) || !Number.isFinite(y2)) return;
        /* 折线：右 11px → 竖直到目标行 → 水平到目标条左侧；箭头自己画，便于跟随选中态换色 */
        const ex = x2 - 4;
        const dir = ex >= (x1 + 11) ? 1 : -1;
        const lx = ex - 5 * dir;
        const d = 'M' + x1.toFixed(1) + ' ' + y1 + ' H' + (x1 + 11).toFixed(1) + ' V' + y2 + ' H' + lx.toFixed(1);
        const arw = 'M' + lx.toFixed(1) + ' ' + (y2 - 4.3) + ' L' + ex.toFixed(1) + ' ' + y2 + ' L' + lx.toFixed(1) + ' ' + (y2 + 4.3) + ' Z';
        /* 这条线被单独指定过颜色 → 内联 --dc，CSS 用 .has-c 换成它 */
        const dck = t.id + '|' + pid;
        const dcv = (DB.depColors || {})[dck];
        paths += '<g class="dep-g' + (dcv ? ' has-c' : '') + '" data-dep-after="' + t.id + '" data-dep-before="' + pid + '"' +
          (dcv ? ' style="--dc:' + esc(dcv) + '"' : '') + '>' +
          '<path class="dep-halo" d="' + d + '"></path>' +
          '<path class="dep-line" d="' + d + '"></path>' +
          '<circle class="dep-ring" cx="' + x1.toFixed(1) + '" cy="' + y1 + '" r="4.6"></circle>' +
          '<circle class="dep-dot" cx="' + x1.toFixed(1) + '" cy="' + y1 + '" r="2.6"></circle>' +
          '<path class="dep-arw" d="' + arw + '"></path>' +
          '</g>';
        /* 记下这条线的三段折线（轨道局部坐标），供几何命中 */
        ganttDeps.push({
          after: t.id, before: pid,
          segs: [
            [x1, y1, x1 + 11, y1],
            [x1 + 11, y1, x1 + 11, y2],
            [x1 + 11, y2, lx, y2]
          ]
        });
      });
    });
  }
  const svg = '<svg class="g-deps" style="left:' + NAME_W + 'px;width:' + trackW + 'px;height:' + bodyH + 'px">' + paths + '</svg>';

  const geo = [];
  const parts = rows.map((r, i) => {
    /* —— 项目分组行：左列「项目名 · 进度条 · X% · N 项」，轨道上一条按项目时间跨度铺的汇总条 —— */
    if (r.proj) {
      const col = r.p.color || PALETTE[0];
      let pbar = '';
      if (r.min && r.max) {
        const oo = diffDays(range.min, r.min), sp = Math.max(1, diffDays(r.min, r.max) + 1);
        const bl = X(oo), bw = Math.max(8, X(oo + sp) - X(oo));
        pbar = '<div class="g-pbar" style="left:' + bl + 'px;width:' + bw + 'px;background:' + col + '"></div>';
      }
      geo.push({ t: null, proj: r.pid, l: -1e9, r: -1e9, rl: -1e9, rr: -1e9 });
      const shut = isProjCollapsed(r.pid);
      return '<div class="g-prow' + (shut ? ' shut' : '') + '" data-row="' + i + '" data-projrow="' + r.pid + '" style="height:' + ROW_H + 'px"' +
        ' title="' + esc(r.p.name + '　' + r.n + ' 项 · 已完成 ' + r.done + ' · 完成度 ' + r.pct + '%' +
          (r.min && r.max ? '\n' + r.min + ' → ' + r.max : '') +
          '\n单击 = 展开 / 收起这组任务　双击 = 切到只看这个项目') + '">' +
        '<div class="g-name">' +
          '<span class="tw" data-pcol="' + r.pid + '">' + (shut ? '▸' : '▾') + '</span>' +
          '<span class="pdot" style="background:' + col + '"></span>' +
          '<span class="tt">' + esc(r.p.name) + '</span>' +
          '<span class="pn-mini"><i style="width:' + r.pct + '%;background:' + col + '"></i></span>' +
          '<span class="pn-pct">' + r.pct + '%</span>' +
          '<span class="pn-k">' + r.n + ' 项</span>' +
        '</div>' +
        '<div class="g-track" style="width:' + trackW + 'px">' + pbar + '</div></div>';
    }
    const t = r.t;
    const chosen = ganttSel.has(t.id) ? ' sel' : '';
    const kids = hasKids(t.id);
    const p = projById(t.projectId) || {};
    /* 任务条颜色：单条自定义色优先，否则跟随项目颜色 */
    const color = t.color || p.color || PALETTE[0];
    /* 状态色：用来画条外那一圈「状态外框」 */
    const stc = statusColor(t.status);
    const s = t.start || today(), e = t.end || s;
    const o = diffDays(range.min, s), sp = Math.max(1, diffDays(s, e) + 1);
    const left = X(o);
    const w = Math.max(scale === 'day' ? 14 : 8, X(o + sp) - X(o));
    let bar, bg;
    if (t.milestone) {
      const ml = left + Math.round(w / 2) - 8;
      bar = '<div class="g-ms' + chosen + '" data-task="' + t.id + '" style="left:' + ml + 'px;background:' + color + ';--stc:' + stc + '" title="' + esc(t.title + ' · ' + statusName(t.status) + ' · 里程碑') + '"></div>';
      bg = { l: ml - 2, r: ml + 18, out: true };
    } else if (kids) {
      bar = '<div class="g-sum' + chosen + '" data-task="' + t.id + '" style="left:' + left + 'px;width:' + w + 'px;background:' + color + ';color:' + color + ';--stc:' + stc + '" title="' + esc(t.title + ' · ' + statusName(t.status)) + '"></div>';
      bg = { l: left - (w >= 20 ? 7 : 0), r: left + w + (w >= 20 ? 7 : 0), out: true };  /* 汇总条两端带三角 */
    } else {
      const dn = isDone(t);
      const pct = dn ? 100 : clamp(t.progress, 0, 100);
      const tick = dn ? '✓ ' : '';
      /* 条上文字带上「状态」——一眼就能看到这条任务处在什么阶段 */
      const stNm = statusName(t.status);
      const lblFull = tick + t.title + ' · ' + stNm + ' · ' + pct + '%';
      const lblMid = tick + t.title + ' · ' + stNm;
      const lblTitle = tick + t.title;
      const wFull = textW(lblFull, GT_FONT) + GT_PAD;
      const wMid = textW(lblMid, GT_FONT) + GT_PAD;
      const wTitle = textW(lblTitle, GT_FONT) + GT_PAD;
      /* 连接节点始终放在条的两端外侧：既不会压住条内文字，
         也不会挡住条形两端那两个「改工期」的拖拽手柄 */
      const lblGap = NODE_GAP + NODE_D + 2;
      /* 四种情况：条够宽→「标题 · 状态 · 进度」；略窄→「标题 · 状态」；再窄→只留标题；
         连标题都放不下→标签移到条外（右侧放不下时改到左侧），永不裁切文字。
         开了「隐藏文字」开关就整段不渲染，只剩色条 + 状态外框。 */
      let inside = '', outHtml = '', reach = null;
      if (!UI.hideBarText) {
        if (w >= wFull) inside = lblFull;
        else if (w >= wMid) inside = lblMid;
        else if (w >= wTitle) inside = lblTitle;
        else {
          const outW = textW(lblFull, GT_FONT);
          /* 右侧优先；右边越界（超出轨道）则改放左边 */
          const putRight = (left + w + lblGap + outW) <= trackW - 2;
          const outLeft = putRight ? (left + w + lblGap)
            : Math.max(2, left - lblGap - outW);
          /* 条太短时标签落在条外，鼠标停在标签上也算“靠近这条任务” */
          reach = [outLeft, outLeft + outW];
          outHtml = '<span class="g-lbl' + (putRight ? '' : ' left') + (dn ? ' dim' : '') + '" data-task="' + t.id + '"' +
            ' style="left:' + outLeft.toFixed(1) + 'px"' +
            ' title="' + esc(t.title + ' · ' + stNm + ' · ' + pct + '%') + '">' +
            esc(lblFull) + '</span>';
        }
      }
      /* ★ 条上文字的颜色：默认按条身色的明暗自动挑（亮条 → 深字），
         也可以在任务弹窗里手工指定（t.textColor）。见 barTextColor()。 */
      const btc = barTextColor(color, t.textColor);
      bar = '<div class="g-bar' + (dn ? ' done' : '') + chosen + '" data-task="' + t.id + '" style="left:' + left + 'px;width:' + w + 'px;background:' + color + ';--stc:' + stc + ';' + (dn ? 'opacity:.85' : '') + '"' +
        ' title="' + esc(t.title + ' · ' + stNm + ' · ' + pct + '%') + '">' +
        (pct > 0 ? '<span class="fill" style="width:' + pct + '%"></span>' : '') +
        '<span class="h l"></span><span class="h r"></span>' +
        (inside ? '<span class="lbl' + (btc.dark ? ' dk' : '') + '" style="color:' + btc.color + '">' + esc(inside) + '</span>' : '') +
        '<span class="ring"></span></div>' + outHtml;
      bg = { l: left, r: left + w, reach };
    }
    const nodes = nodePair(t, bg, color, trackW);
    geo.push({
      t, l: bg.l, r: bg.r,
      rl: bg.reach ? Math.min(bg.l, bg.reach[0]) : bg.l,
      rr: bg.reach ? Math.max(bg.r, bg.reach[1]) : bg.r
    });
    const tw = r.hasKids
      ? '<span class="tw" data-collapse="' + t.id + '">' + (isCollapsed(t.id) ? '▸' : '▾') + '</span>'
      : '<span class="tw hidden"></span>';
    const nameHtml = '<div class="g-name d' + Math.min(r.depth, 3) + '">' + tw +
      '<span class="pdot" style="background:' + color + '"></span>' +
      '<span class="tt" data-task="' + t.id + '">' + esc(t.title) + '</span>' +
      (t.milestone ? '<span style="color:' + color + ';font-size:10px">◆</span>' : '') +
      '<button class="st-dot" data-stbtn="' + t.id + '" style="background:' + statusColor(t.status) + '" ' +
        'title="' + esc('状态：' + statusName(t.status) + '（点击切换）') + '"></button></div>';
    return '<div class="g-row' + (isDone(t) ? ' done' : '') + (chosen ? ' selrow' : '') + '" style="height:' + ROW_H + 'px" data-row="' + i + '" data-rowtask="' + t.id + '">' + nameHtml +
      '<div class="g-track" style="width:' + trackW + 'px">' + bar + nodes + '</div></div>';
  }).join('');

  root.innerHTML =
    '<div class="g-scroll"><div class="g-inner" style="width:' + (NAME_W + trackW) + 'px">' +
      '<div class="g-head"><div class="g-corner">任务 / 阶段　<span class="g-ccnt" style="font-weight:400;color:var(--muted)" title="点项目行可整组收起 / 展开">' +
          (nProj ? nProj + ' 个项目 · ' : '') + nTask + ' 条任务</span>' +
        '<span class="g-coldiv" data-coldiv="1" title="左右拖动 = 调整这一列的宽度（像 Excel 那样）· 双击 = 恢复默认"></span></div>' +
        '<div class="g-headcols" style="width:' + trackW + 'px">' +
          '<div class="g-monthrow">' + monthHtml + '</div>' +
          (unitHtml ? '<div class="g-dayrow">' + unitHtml + '</div>' : '') +
        '</div></div>' +
      '<div class="g-body" style="width:' + (NAME_W + trackW) + 'px;height:' + (bodyH + G_BLANK_H) + 'px">' +
        '<div class="g-layer" style="left:' + NAME_W + 'px;width:' + trackW + 'px">' + layer + '</div>' +
        svg +
        '<svg class="g-link" style="left:' + NAME_W + 'px;width:' + trackW + 'px;height:' + bodyH + 'px"><path d=""></path></svg>' +
        '<div class="g-snap"><i></i><b></b></div>' +
        '<div class="g-rows">' + parts + '</div>' +
        '<div class="g-blank" style="height:' + G_BLANK_H + 'px">' +
          '<div class="bh"><b>空白区</b>：把时间轴上的圆点拖到这里松手 = 新建一条任务<br>在这块空白里<b>双击</b> = 按双击的那天新建任务</div>' +
        '</div>' +
        '<div class="g-marquee"></div>' +
      '</div>' +
    '</div></div>' +
    '<div class="g-foot">' +
      '<span class="lg"><span class="sw" style="background:var(--accent)"></span>任务条：左右拖平移 · 上下拖换行（同级）· 两端改工期，<b>外框颜色 = 状态</b></span>' +
      '<span class="lg"><span class="sw" style="background:var(--dep)"></span>依赖线：点 / 右键选中，右键可给它单独换色</span>' +
      '<span class="lg">◆ 里程碑</span>' +
      '<span class="lg" style="color:var(--danger)">┃ 今日</span>' +
      '<span class="spacer"></span>' +
      '<span class="lg kbd">大纲：单击选中 · 双击编辑 · 上下拖排序（只在同级间换位，不会改层级）　　Ctrl+Z 撤销 · Alt+滚轮缩放 · 中键平移 · 右键菜单 · 左上角 ⚙ 设置</span>' +
    '</div>' +
    '<div class="g-zoomhud" id="gZoomHud"></div>' +
    '<div class="pt' + (ptOpen ? ' open' : '') + '" id="ptBar">' +
      '<div class="pt-panel">' +
        '<div class="pt-head"><span>背景画笔</span><span class="st" id="ptState">未开启</span><span class="spacer"></span>' +
          '<button data-pt="close" title="收起面板（点右下角圆按钮可开 / 关画笔）">✕</button></div>' +
        '<div class="pt-tools">' +
          '<button data-pt="brush" title="涂色：按住左键在轨道上刷色">🖌 涂色</button>' +
          '<button data-pt="eraser" title="橡皮：按住左键擦掉涂色">🧽 橡皮</button>' +
        '</div>' +
        '<div class="pt-swatches">' + BRUSH_COLORS.map(c =>
          '<button class="pt-sw" data-ptc="' + c + '" style="background:' + c + '" title="' + c + '"></button>').join('') +
          '<label class="cpick" data-ptcpick title="自定义颜色：点开是完整 RGB 取色器" style="justify-self:center">' +
            '<input type="color" value="' + to6(UI.brushColor) + '"><i style="background:' + UI.brushColor + '"></i></label>' +
        '</div>' +
        '<div class="pt-cur"><i id="ptCur"></i><span id="ptCurTxt"></span></div>' +
        '<div class="pt-note">在轨道上<b>按住左键拖动</b>就能涂色；再点一次右下角圆按钮，或按 <b>Esc</b>，即可退出画笔。</div>' +
        '<div class="pt-actions">' +
          '<button data-pt="clear">清空全部涂色</button>' +
          '<button class="prim" data-pt="exit">退出画笔</button>' +
        '</div>' +
      '</div>' +
      '<button class="pt-fab" data-pt="toggle" title="点击开启 / 关闭背景画笔"><span class="ic">🖌</span><span class="pt-badge"></span></button>' +
    '</div>' +
    '<div class="paint-hud" id="ptHud" title="点击退出画笔">' +
      '<span class="dot" id="ptHudDot"></span><b id="ptHudTxt">画笔已开启</b>' +
      '<span class="kbd">Esc 退出</span>' +
    '</div>';

  const sc = root.querySelector('.g-scroll');
  /* 记住真实滚动位置：任何重渲染（新建 / 拖拽 / 改状态）后都原地还原，不再跳回左上角 */
  sc.addEventListener('scroll', () => {
    ganttScroll.l = sc.scrollLeft; ganttScroll.t = sc.scrollTop;
  }, { passive: true });
  sc.scrollLeft = ganttScroll.l;
  sc.scrollTop = ganttScroll.t;
  if (!ganttScroll.init) {
    const viewW = sc.clientWidth || 900;
    sc.scrollLeft = Math.max(0, X(diffDays(range.min, today())) - viewW * 0.32);
    ganttScroll.init = true;
  }
  /* 留白区至少铺满「视口里剩下的高度」：这样行数少的时候，下面永远有一大块能放手的地方 */
  try {
    const scEl = root.querySelector('.g-scroll');
    const bodyEl = root.querySelector('.g-body');
    const blankEl = root.querySelector('.g-blank');
    const headEl = root.querySelector('.g-head');
    if (scEl && bodyEl && blankEl) {
      const rest = Math.round(scEl.clientHeight - (headEl ? headEl.offsetHeight : 56) - bodyH);
      const bh = Math.max(G_BLANK_H, rest);
      if (bh !== G_BLANK_H) {
        blankEl.style.height = bh + 'px';
        bodyEl.style.height = (bodyH + bh) + 'px';
      }
    }
  } catch (e) { /* 量不出来就用默认高度，不影响功能 */ }

  bindGantt(root, rows, range, dayW, geo, trackW);
  resyncDepSel();
}

/* 一条任务两端的连接圆点（左=接前置，右=接后续） */
const NODE_D = 14, NODE_GAP = 5;
function nodePair(t, bg, color, trackW) {
  if (!UI.nodes) return '';                                /* 设置里关掉了连线圆点 */
  const half = NODE_D / 2, g = NODE_GAP;
  let lc = bg.l - g - half, rc = bg.r + g + half;
  if (lc - half < 0) lc = bg.l + g + half;                /* 贴轨道最左端 → 挪回条内 */
  if (rc + half > trackW) rc = bg.r - g - half;           /* 贴轨道最右端 → 挪回条内 */
  const tipL = '拖动：连接到本任务之前的任务（也可拖到空白处，新建一个前置任务）';
  const tipR = '拖动：连接到本任务之后的任务（也可拖到空白处，新建一个后续任务）';
  return '<span class="g-node" data-node="l" data-task="' + t.id + '" style="left:' + (lc - half).toFixed(1) + 'px;--nc:' + color + '" title="' + esc(tipL) + '"></span>' +
    '<span class="g-node" data-node="r" data-task="' + t.id + '" style="left:' + (rc - half).toFixed(1) + 'px;--nc:' + color + '" title="' + esc(tipR) + '"></span>';
}

/* 依赖关系判定：a 是否（直接或间接）需要 b 先完成 */
function depChain(a, b) {
  const seen = new Set(), stack = [a];
  while (stack.length) {
    const t = taskById(stack.pop());
    if (!t) continue;
    for (const d of (t.deps || [])) {
      if (d === b) return true;
      if (!seen.has(d)) { seen.add(d); stack.push(d); }
    }
  }
  return false;
}
function isProgeny(rootId, id) { return descendants(rootId).some(x => x.id === id); }

function bindGantt(root, rows, range, dayW, geo, trackW) {
  /* —— 左侧大纲列宽：按住右边缘的拉手左右拖，像 Excel 调列宽一样 —— */
  {
    const dv = root.querySelector('[data-coldiv]');
    if (dv) {
      let raf = 0;
      /* 整块重画会换掉 DOM，所以移动 / 松手都监听在 document 上，元素没了也不影响 */
      const move = ev => {
        const w = clamp(Math.round(dragW + (ev.clientX - dragX)), 180, 760);
        if (w === NAME_W) return;
        /* 列宽变了就把横向滚动同步补上，让「原来看着的那一天」待在原地不跳 */
        ganttScroll.l = Math.max(0, ganttScroll.l + (w - NAME_W));
        applyNameW(w);
        if (!raf) raf = requestAnimationFrame(() => { raf = 0; render(); });
      };
      const up = () => {
        document.removeEventListener('pointermove', move);
        document.removeEventListener('pointerup', up);
        document.removeEventListener('pointercancel', up);
        document.body.classList.remove('coldrag');
        if (raf) { cancelAnimationFrame(raf); raf = 0; }
        saveUI();
        render();
        toast('大纲列宽 ' + NAME_W + 'px');
      };
      let dragX = 0, dragW = 0;
      dv.addEventListener('pointerdown', ev => {
        if (ev.button !== 0) return;
        ev.preventDefault(); ev.stopPropagation();
        dragX = ev.clientX; dragW = NAME_W;
        dv.classList.add('on');
        document.body.classList.add('coldrag');
        document.addEventListener('pointermove', move);
        document.addEventListener('pointerup', up);
        document.addEventListener('pointercancel', up);
      });
      dv.addEventListener('dblclick', ev => {
        ev.preventDefault(); ev.stopPropagation();
        applyNameW(310); saveUI(); render();
        toast('大纲列宽已恢复默认（310px）');
      });
    }
  }
  $$('[data-collapse]', root).forEach(el => {
    el.addEventListener('click', ev => { ev.stopPropagation(); toggleCollapse(el.dataset.collapse); render(); });
  });
  /* —— 项目分组行：单击整行 = 展开 / 收起这组任务；双击 = 切到「只看这个项目」 —— */
  $$('.g-prow', root).forEach(el => {
    const gp = el.dataset.projrow;
    if (!gp) return;
    let clk = 0;
    el.addEventListener('click', () => {
      /* 压一下再切：万一是双击（= 切项目），这次就别折腾展开了 */
      clearTimeout(clk);
      clk = setTimeout(() => { toggleProjCollapse(gp); render(); }, 170);
    });
    el.addEventListener('dblclick', ev => {
      clearTimeout(clk);
      ev.preventDefault(); ev.stopPropagation();
      if (UI.project === gp) return;
      UI.project = gp; UI.collapsed = []; ganttSel = new Set(); clearDepSel();
      saveUI(); render();
      toast('已切到「' + ((projById(gp) || {}).name || '项目') + '」');
    });
  });
  /* —— 行下方的留白区：双击 = 按双击的那天在末尾新建一条任务（这里也是拖圆点的落点） —— */
  {
    const blankEl = root.querySelector('.g-blank');
    /* 参照任务取「最后一条任务行」（最后一行也可能是项目分组行） */
    const lastTaskRow = rows.filter(r => r.t).slice(-1)[0];
    const lastT = lastTaskRow ? lastTaskRow.t : null;
    if (blankEl) {
      blankEl.addEventListener('dblclick', ev => {
        if (paintOn) return;
        ev.preventDefault();
        const br = body.getBoundingClientRect();
        const x = ev.clientX - br.left - NAME_W;
        const idx = clamp(Math.floor(x / dayW), 0, Math.max(0, range.total - 1));
        createEndTask(addDays(range.min, idx), lastT, ev.clientX, ev.clientY);
      });
      blankEl.addEventListener('contextmenu', ev => {
        const br = body.getBoundingClientRect();
        const x = ev.clientX - br.left - NAME_W;
        const idx = clamp(Math.floor(x / dayW), 0, Math.max(0, range.total - 1));
        const dateStr = addDays(range.min, idx);
        ev.preventDefault();
        openCtxMenu(ev.clientX, ev.clientY, [
          { head: '空白区 · ' + dateStr },
          { label: '在这天新建任务（追加到末尾）', onClick: () => createEndTask(dateStr, lastT, ev.clientX, ev.clientY) },
          { label: '在这天新建任务，并打开编辑…', onClick: () => { createEndTask(dateStr, lastT, null, null); const last = DB.tasks[DB.tasks.length - 1]; if (last) setTimeout(() => openTaskModal(last.id), 80); } },
          { sep: true },
          { label: '展开全部任务（含项目分组）', onClick: () => expandAllGroups() }
        ]);
      });
    }
  }

  /* —— 左侧大纲：单击 = 整行高亮选中（不弹窗）；双击 = 打开任务编辑窗口；上下拖 = 改行顺序 —— */
  $$('.g-row', root).forEach(rowEl => {
    const t = taskById(rowEl.dataset.rowtask);
    if (!t) return;
    const nameEl = rowEl.querySelector('.g-name');
    const titleEl = rowEl.querySelector('.g-name .tt');
    if (titleEl) {
      titleEl.addEventListener('dblclick', ev => { ev.preventDefault(); ev.stopPropagation(); openTaskModal(t.id); });
    }
    if (!nameEl) return;
    nameEl.addEventListener('pointerdown', ev => {
      if (ev.button !== 0 || paintOn) return;
      if (ev.target.closest('.tw,.st-dot,button,a,input,select')) return;   /* 折叠按钮 / 状态圆点各管各的 */
      ev.preventDefault();
      selectRow(t, root, ev);
      startRowReorder(ev, rowEl, t, {
        box: rowEl.parentElement, cls: 'g-row', phCls: 'ph',
        onDrop: k => applyRowDrop(t, k, 'gantt')
      });
    });
  });
  $$('.g-bar,.g-sum,.g-ms', root).forEach(el => {
    const t = taskById(el.dataset.task);
    if (!t) return;
    el.addEventListener('dblclick', ev => { ev.preventDefault(); openTaskModal(t.id); });
    el.addEventListener('pointerdown', ev => startBarDrag(ev, el, t, range, dayW));
  });
  /* 条外的标签：单击选中这一行，双击打开任务 */
  $$('.g-lbl', root).forEach(el => {
    el.addEventListener('click', ev => { ev.stopPropagation(); setSelection(new Set([el.dataset.task]), root); });
    el.addEventListener('dblclick', ev => { ev.preventDefault(); ev.stopPropagation(); openTaskModal(el.dataset.task); });
  });

  /* ==================== 连接节点：靠得近才冒出来的圆点 + 拖拽连线 ==================== */
  const sc = root.querySelector('.g-scroll');
  const body = root.querySelector('.g-body');
  const path = root.querySelector('.g-link path');
  const snap = root.querySelector('.g-snap');
  const head = root.querySelector('.g-head');
  if (!sc || !body || !path || !geo.length) return;

  const snapChip = snap.querySelector('b');
  const bodyH = rows.length * ROW_H;
  /* 行下方留白区的实际高度（渲染后会按视口补足，所以这里要实测） */
  const BLANK_H = (() => {
    const b = root.querySelector('.g-blank');
    return b ? Math.max(1, b.offsetHeight) : G_BLANK_H;
  })();
  const X = i => Math.round(i * dayW);
  const REACH_X = 46, REACH_Y = 30, TOL = 16;
  const nodeEls = {};
  $$('.g-node', root).forEach(el => { (nodeEls[el.dataset.task] = nodeEls[el.dataset.task] || []).push(el); });

  let pinned = null;                                  /* 拖拽中保持显示的任务 */
  const setShown = (i, on) => {
    const g = geo[i]; if (!g || !g.t) return;            /* 项目分组行没有连接圆点 */
    const els = nodeEls[g.t.id]; if (!els) return;
    els.forEach(el => el.classList.toggle('on', on));
  };
  const hideAll = () => rows.forEach((r, i) => setShown(i, false));
  const bodyPos = e => {
    const br = body.getBoundingClientRect();
    return { x: e.clientX - br.left - NAME_W, y: e.clientY - br.top };
  };
  const headBottom = () => (head ? head.getBoundingClientRect().bottom : -1e9);
  const overNames = e => e.clientX < sc.getBoundingClientRect().left + NAME_W;

  /* 鼠标位置 → 显示它附近（含本行）任务条的圆点 */
  function refresh(e) {
    const pos = bodyPos(e);
    const limit = headBottom();
    const usable = !overNames(e) && e.clientY >= limit && pos.y >= 0 && pos.y <= bodyH + BLANK_H;
    rows.forEach((r, i) => {
      const g = geo[i]; if (!g || !g.t) return;
      let on = false;
      if (usable) {
        const top = i * ROW_H, bot = top + ROW_H;
        const dy = pos.y < top ? top - pos.y : (pos.y > bot ? pos.y - bot : 0);
        const dx = pos.x < g.rl ? g.rl - pos.x : (pos.x > g.rr ? pos.x - g.rr : 0);
        on = dx <= REACH_X && dy <= REACH_Y;
      }
      if (!on && pinned && g.t.id === pinned) on = true;
      setShown(i, on);
    });
  }
  sc.addEventListener('pointermove', refresh);
  sc.addEventListener('pointerleave', () => { if (!pinned) hideAll(); });

  /* 落点判定：压在任务条上 → 连线；落在同行的空白处 / 最后一行下面的空白区 → 按日期新建 */
  function resolveDrop(e) {
    if (overNames(e)) return null;
    const pos = bodyPos(e);
    if (e.clientY < headBottom() || pos.y < 0 || pos.y > bodyH + BLANK_H) return null;
    const i = Math.floor(pos.y / ROW_H);
    const idx = clamp(Math.floor(pos.x / dayW), 0, Math.max(0, range.total - 1));
    /* 落在最后一行下方的留白里 → 直接追加到列表末尾（不挂父任务、不抢行位置） */
    if (i >= rows.length) {
      return { kind: 'new', row: null, date: addDays(range.min, idx), x: X(idx), y: bodyH + 12, blank: true };
    }
    const g = geo[i];
    /* 落在「项目分组行」上 → 当作追加到那个项目的末尾（分组行不是任务条，也就不接依赖）。
       注意这里不能用 drag：endDrag 里已经先把 drag 清空了，靠它判断会让松手那一刻落空。 */
    if (!g || !g.t) {
      const gp = rows[i] && rows[i].proj ? rows[i].pid : null;
      if (!gp) return null;
      return { kind: 'new', row: null, date: addDays(range.min, idx), x: X(idx), y: pos.y, proj: gp };
    }
    const rowT = rows[i].t;
    if (pos.x >= g.l - TOL && pos.x <= g.r + TOL) return { kind: 'link', row: rowT };
    return { kind: 'new', row: rowT, date: addDays(range.min, idx), x: X(idx), y: pos.y };
  }

  /* 落点 + 侧别 → 新任务的起止（预览与实际新建共用，保证「提示的」和「落下来的」一致） */
  function newTaskSpan(side, dateStr) {
    const t = { start: dateStr, end: dateStr };
    const tpl = defaultTpl();
    applyTemplate(t, tpl, { side, anchor: dateStr });
    if (!tpl) {
      if (side === 'r') t.end = addDays(dateStr, 3);
      else t.start = addDays(dateStr, -3);
    }
    return { st: t.start, en: t.end };
  }

  /* 拖到已有任务上 → 建立前后依赖 */
  function doLink(src, side, target) {
    if (!target) return;
    if (target.id === src.id) { toast('不能连到自己'); return; }
    if (target.projectId !== src.projectId) { toast('只能连接同一个项目里的任务'); return; }
    const before = side === 'r' ? src : target;     /* 拖右点：本任务在前；拖左点：目标在前 */
    const after = side === 'r' ? target : src;
    if (after.id === before.id) { toast('不能连到自己'); return; }
    if (isProgeny(before.id, after.id) || isProgeny(after.id, before.id)) { toast('父任务与自己的子任务之间不需要再连依赖'); return; }
    if (depChain(before.id, after.id)) { toast('不能这样连：会形成循环依赖'); return; }
    after.deps = after.deps || [];
    if (after.deps.includes(before.id)) { toast('这两条任务之间已经有依赖了'); return; }
    after.deps.push(before.id);
    commit();
    toast('已建立依赖：「' + shortTitle(after.title) + '」排在「' + shortTitle(before.title) + '」之后');
  }

  /* 拖到空白处 → 就在落点那个位置新建任务：日期取落点那天，行插到落点那一行
     （其他任务会自动让位），再按落点那一侧接上依赖。 */
  function doNew(src, side, dateStr, rowT, yInRow, cx, cy, atEnd, proj) {
    /* proj = 落点是「项目分组行」时那个项目的 id（新任务加到它末尾；跨项目就不连依赖了） */
    const cross = !!(proj && proj !== src.projectId);
    const sameProj = !!(rowT && rowT.projectId === src.projectId);
    const tpl = defaultTpl();
    /* 落点就是任务的锚点：右圆点 → 从这天开始；左圆点 → 到这天结束 */
    const nt = {
      id: uid(), projectId: proj || (sameProj ? rowT.projectId : src.projectId), parentId: null,
      title: side === 'r' ? '新任务（后续）' : '新任务（前置）', note: '',
      status: 'todo', priority: src.priority || 2,
      start: dateStr, end: dateStr,
      progress: 0, hours: 0, milestone: false, deps: [], order: 0, doneAt: null
    };
    if (tpl) nt.title = tpl.title || nt.title;
    applyTemplate(nt, tpl, { side, anchor: dateStr });
    /* 没有模板时的兜底工期（正常情况下 normalize 一定会补上内置模板） */
    if (!tpl) {
      if (side === 'r') nt.end = addDays(dateStr, 3);
      else nt.start = addDays(dateStr, -3);
    }
    /* 行位置：落在某行上半 → 插到该行前；下半 → 插到该行后；落在阶段行下半 → 成为它的子任务 */
    const firstHalf = yInRow == null ? true : (yInRow % ROW_H) < ROW_H / 2;
    let placed = false;
    /* 落在行下方的留白里 = 追加到列表末尾（顶层，不挂到任何阶段下） */
    if (atEnd) {
      nt.parentId = null;
      nt.order = nextOrder(nt.projectId);
      placed = true;
    }
    if (!placed && rowT && rowT.id !== src.id) {
      if (sameProj && !firstHalf && hasKids(rowT.id) && !isProgeny(src.id, rowT.id)) {
        appendUnder(nt, rowT.id);
        placed = true;
      } else if (sameProj) {
        placed = insertTaskNear(nt, rowT, firstHalf);
      }
    }
    if (!placed) {
      if (cross) {
        /* 落到别的项目的分组行上 → 直接追加到那个项目末尾，不跨项目连依赖 */
        nt.parentId = null;
        nt.order = nextOrder(nt.projectId);
        placed = true;
      } else {
        placed = insertTaskNear(nt, src, side === 'r');
        if (!placed) {
          nt.parentId = src.parentId; nt.order = nextOrder(nt.projectId);
        }
      }
    }
    if (!cross) {
      if (side === 'r') nt.deps = [src.id];
      else src.deps = (src.deps || []).concat(nt.id);
    }
    /* 落到（或收起的）项目分组里会看不见 → 顺手把那组展开 */
    revealTask(nt);
    DB.tasks.push(nt);
    commit('新建任务');
    toast('已新建' + (side === 'r' ? '后续' : '前置') + '任务' + (tpl ? '（' + tpl.name + '模板）' : '') +
      (cross ? '，已加到「' + ((projById(nt.projectId) || {}).name || '该项目') + '」末尾'
        : atEnd ? '，已追加到列表末尾' : '，依赖已连好'));
    /* 就在鼠标松手的位置弹模板选择菜单；关掉这个开关则回到「按默认模板直接建好」 */
    if (UI.tplMenu && (DB.templates || []).length) {
      const ex = cx == null ? window.innerWidth / 2 : cx;
      const ey = cy == null ? window.innerHeight / 2 : cy;
      setTimeout(() => openTplMenu(nt.id, dateStr, side, ex, ey), 40);
    } else if (UI.autoOpen) {
      setTimeout(() => openTaskModal(nt.id), 60);
    }
  }

  /* 在列表末尾新建一条顶层任务：留白区双击、以及拖放到留白区都用它 */
  function createEndTask(dateStr, refT, cx, cy) {
    const pid = refT ? refT.projectId
      : ((UI.project && UI.project !== 'all' && UI.project !== '__archived') ? UI.project
        : ((DB.projects.find(p => !p.archived) || {}).id));
    if (!pid) { toast('请先创建一个项目'); return; }
    const tpl = defaultTpl();
    const nt = {
      id: uid(), projectId: pid, parentId: null, title: '新任务', note: '',
      status: firstStatusOfMode('todo'), priority: 2,
      start: dateStr, end: dateStr, progress: 0, hours: 0,
      milestone: false, deps: [], order: nextOrder(pid), doneAt: null, color: null, attachments: []
    };
    if (tpl) {
      if (tpl.title) nt.title = tpl.title;
      applyTemplate(nt, tpl, { side: 'r', anchor: dateStr });
    }
    if (!/^\d{4}-\d{2}-\d{2}$/.test(nt.end) || nt.end < nt.start) nt.end = addDays(nt.start, 3);
    revealTask(nt);
    DB.tasks.push(nt);
    commit('新建任务');
    toast('已在末尾新建任务（' + nt.start + ' 起）');
    if (UI.tplMenu && (DB.templates || []).length) {
      setTimeout(() => openTplMenu(nt.id, nt.start, 'r', cx == null ? window.innerWidth / 2 : cx,
        cy == null ? window.innerHeight / 2 : cy), 40);
    } else if (UI.autoOpen) setTimeout(() => openTaskModal(nt.id), 60);
  }

  /* 鼠标位置弹出「模板选择菜单」：选一个模板就套到刚建好的这条任务上 */
  function openTplMenu(id, dateStr, side, x, y) {
    const nt = taskById(id);
    if (!nt) return;
    const items = [{ head: '选择模板：' + shortTitle(nt.title) }];
    (DB.templates || []).forEach(tp => {
      items.push({
        label: tp.name + (tp.title ? ' — ' + tp.title : ''),
        k: tp.days + ' 天',
        onClick: () => {
          const cur = taskById(id) || nt;
          /* 还挂着「新任务（后续）」这种自动名字的话，顺便换成模板里的任务名 */
          if (tp.title && (cur.title === '新任务（后续）' || cur.title === '新任务（前置）')) cur.title = tp.title;
          applyTemplate(cur, tp, { side, anchor: dateStr });
          commit('套用模板');
          toast('已套用模板「' + tp.name + '」');
          if (UI.autoOpen) setTimeout(() => openTaskModal(id), 50);
        }
      });
    });
    items.push({ sep: true });
    items.push({ label: '不用模板，直接编辑这条任务…', onClick: () => openTaskModal(id) });
    items.push({ label: '管理模板…', onClick: () => openSidebar('tpl') });
    openCtxMenu(x, y, items);
  }

  let drag = null;
  function paintLink(e) {
    const br = body.getBoundingClientRect();
    const x = clamp(e.clientX - br.left - NAME_W, 0, trackW);
    const y = clamp(e.clientY - br.top, 0, bodyH);
    const p0 = drag.origin, c = Math.max(24, Math.min(88, Math.abs(x - p0.x) * 0.5));
    const dir = drag.side === 'r' ? 1 : -1;
    path.setAttribute('d', 'M' + p0.x + ' ' + p0.y + ' C' + (p0.x + c * dir) + ' ' + p0.y + ' ' + (x - c * dir) + ' ' + y + ' ' + x + ' ' + y);
  }
  function paintSnap(e) {
    $$('.g-link-target', root).forEach(el => el.classList.remove('g-link-target'));
    const r = resolveDrop(e);
    const blankEl = root.querySelector('.g-blank');
    if (blankEl) blankEl.classList.toggle('hot', !!(r && r.blank));
    /* 落在项目分组行上 → 把那一行也点亮，让人知道松手会加到哪个项目里 */
    $$('.g-prow', root).forEach(el => el.classList.toggle('hot', !!(r && r.proj && el.dataset.projrow === r.proj)));
    if (!r) { snap.style.display = 'none'; return; }
    if (r.kind === 'link') {
      snap.style.display = 'none';
      if (r.row.id !== drag.src.id) {
        const el = root.querySelector('.g-bar[data-task="' + r.row.id + '"],.g-sum[data-task="' + r.row.id + '"],.g-ms[data-task="' + r.row.id + '"]');
        if (el) el.classList.add('g-link-target');
      }
      return;
    }
    /* 预览：新建任务会落在哪一天（和真正新建时用的是同一套计算） */
    const span = newTaskSpan(drag.side, r.date);
    const st = span.st, en = span.en;
    const tplName = (defaultTpl() || {}).name;
    const txt = (drag.side === 'r' ? '新建后续 ' : '新建前置 ') + st.slice(5) + ' → ' + en.slice(5) +
      (tplName ? ' · ' + tplName : '');
    snap.style.display = 'block';
    snap.style.left = (NAME_W + X(clamp(diffDays(range.min, st), 0, range.total - 1))) + 'px';
    const cw = textW(txt, '650 11.5px system-ui, sans-serif') + 22;
    const sx = parseFloat(snap.style.left) - NAME_W;
    let cl = 0;
    if (sx - cw / 2 < 0) cl = cw / 2 - sx;
    if (sx + cw / 2 > trackW) cl = trackW - cw / 2 - sx;
    snapChip.textContent = txt;
    snapChip.style.left = cl.toFixed(1) + 'px';
    snapChip.style.top = clamp(r.y, 22, bodyH - 22) + 'px';
  }
  function endDrag(e, cancelled) {
    if (!drag) return;
    const d = drag; drag = null;
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    window.removeEventListener('pointercancel', onCancel);
    window.removeEventListener('keydown', onKey);
    path.setAttribute('d', '');
    snap.style.display = 'none';
    $$('.g-link-target', root).forEach(el => el.classList.remove('g-link-target'));
    const blankEl = root.querySelector('.g-blank');
    if (blankEl) blankEl.classList.remove('hot');
    $$('.g-prow.hot', root).forEach(el => el.classList.remove('hot'));
    (d.els || []).forEach(el => el.classList.remove('act'));
    pinned = null;
    if (cancelled) { refresh(e); return; }
    const r = resolveDrop(e);
    if (!r) { refresh(e); return; }
    if (r.kind === 'link') doLink(d.src, d.side, r.row);
    else doNew(d.src, d.side, r.date, r.row, r.y, e.clientX, e.clientY, !!r.blank, r.proj);
  }
  function onMove(e) { if (!drag) return; paintLink(e); refresh(e); paintSnap(e); }
  function onUp(e) { endDrag(e, false); }
  function onCancel(e) { endDrag(e, true); }
  function onKey(e) { if (e.key === 'Escape') { e.preventDefault(); endDrag(e, true); } }

  $$('.g-node', root).forEach(el => {
    el.addEventListener('pointerdown', ev => {
      if (ev.button !== 0 || drag) return;
      ev.preventDefault(); ev.stopPropagation();
      const t = taskById(el.dataset.task);
      if (!t) return;
      const rr = el.getBoundingClientRect(), br = body.getBoundingClientRect();
      drag = {
        src: t, side: el.dataset.node, els: nodeEls[t.id] || [],
        origin: { x: rr.left + rr.width / 2 - br.left - NAME_W, y: rr.top + rr.height / 2 - br.top }
      };
      pinned = t.id;
      drag.els.forEach(x => x.classList.add('act'));
      try { el.setPointerCapture(ev.pointerId); } catch (err) { /* ignore */ }
      paintLink(ev); refresh(ev); paintSnap(ev);
      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp);
      window.addEventListener('pointercancel', onCancel);
      window.addEventListener('keydown', onKey);
    });
  });

  /* ==================== 缩放 / 中键平移 / 框选 / 右键菜单 ==================== */
  bindGanttZoom(sc);
  bindGanttPan(sc);
  bindGanttMarquee(root, rows, range, dayW, geo, trackW, sc, body, head);
  bindGanttCtx(root, rows, range, dayW, geo, body);
  bindGanttPaint(root, rows, range, dayW, sc, body);
}

/* ==================== 甘特图：缩放（Alt+滚轮 / 工具栏按钮） ==================== */
let zoomHudT = 0;
function showZoomHud(zoom) {
  const el = document.getElementById('gZoomHud');
  if (!el) return;
  el.textContent = '缩放 ' + Math.round(zoom * 100) + '%';
  el.classList.add('on');
  clearTimeout(zoomHudT);
  zoomHudT = setTimeout(() => { el.classList.remove('on'); }, 900);
}
/* mxClient 为空则以「可视轨道正中」为锚点；否则以该视口横坐标处的日期为锚点 */
function applyZoom(newZoom, mxClient) {
  const base = DAY_W[ganttScale()];
  const oldW = dayWOf();
  const nz = clamp(newZoom, ZOOM_MIN, ZOOM_MAX);
  const newW = clamp(base * nz, DAYW_MIN, DAYW_MAX);
  if (Math.abs(newW - oldW) < 0.01 && Math.abs(nz - (Number(UI.zoom) || 1)) < 1e-9) return;
  const container = document.querySelector('#ganttRoot .g-scroll');
  let mx = 0, anchor = null;
  if (container) {
    const r = container.getBoundingClientRect();
    mx = mxClient == null ? NAME_W + Math.max(0, r.width - NAME_W) / 2 : clamp(mxClient - r.left, NAME_W, Math.max(NAME_W, r.width));
    anchor = (container.scrollLeft + mx - NAME_W) / oldW;      /* 锚点处是「第几天」（连续值） */
  }
  UI.zoom = nz;
  if (container && anchor != null) ganttScroll.l = Math.max(0, Math.round(anchor * newW - (mx - NAME_W)));
  ganttScroll.init = true;
  clearTimeout(window.__zoomSaveT);
  window.__zoomSaveT = setTimeout(saveUI, 400);
  render();
  showZoomHud(UI.zoom);
}
function zoomStep(dir) {
  const cur = Number(UI.zoom) || 1;
  if (dir === 'reset') applyZoom(1, null);
  else if (dir === 'in') applyZoom(cur * 1.25, null);
  else applyZoom(cur / 1.25, null);
}
function bindGanttZoom(sc) {
  sc.addEventListener('wheel', ev => {
    if (!ev.altKey) return;
    ev.preventDefault();
    let d = ev.deltaY;
    if (ev.deltaMode === 1) d *= 16; else if (ev.deltaMode === 2) d *= 100;
    const cur = Number(UI.zoom) || 1;
    applyZoom(cur * Math.exp(-d * 0.0018), ev.clientX);
  }, { passive: false });
}

/* ==================== 甘特图：中键拖拽平移整个视图 ==================== */
function bindGanttPan(el) {
  let pan = null;
  el.addEventListener('pointerdown', ev => {
    if (ev.button !== 1) return;
    ev.preventDefault();
    pan = { x: ev.clientX, y: ev.clientY, l: el.scrollLeft, t: el.scrollTop };
    el.classList.add('panning');
    document.body.classList.add('panning');
    try { el.setPointerCapture(ev.pointerId); } catch (e) { /* ignore */ }
    const mv = e2 => {
      if (!pan) return;
      el.scrollLeft = pan.l - (e2.clientX - pan.x);
      el.scrollTop = pan.t - (e2.clientY - pan.y);
    };
    const up = () => {
      pan = null;
      el.classList.remove('panning');
      document.body.classList.remove('panning');
      el.removeEventListener('pointermove', mv);
      el.removeEventListener('pointerup', up);
      el.removeEventListener('pointercancel', up);
    };
    el.addEventListener('pointermove', mv);
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
  });
  /* 屏蔽 Windows 上中键的「自动滚动」圆盘 */
  el.addEventListener('mousedown', ev => { if (ev.button === 1) ev.preventDefault(); });
  el.addEventListener('auxclick', ev => { if (ev.button === 1) ev.preventDefault(); });
}

/* ==================== 甘特图：框选多个任务 ==================== */
function bindGanttMarquee(root, rows, range, dayW, geo, trackW, sc, body, head) {
  const box = root.querySelector('.g-marquee');
  if (!box) return;
  const bodyH = rows.length * ROW_H;
  const EDGE = 52, MAXV = 20;
  const ease = d => MAXV * Math.pow(1 - clamp(d / EDGE, 0, 1), 2);
  let drag = null, raf = 0;

  const local = (cx, cy) => {
    const br = body.getBoundingClientRect();
    return { x: cx - br.left - NAME_W, y: cy - br.top };
  };
  const paint = () => {
    const p = local(drag.cx, drag.cy);
    const x1 = Math.min(drag.x0, p.x), x2 = Math.max(drag.x0, p.x);
    const y1 = clamp(Math.min(drag.y0, p.y), 0, bodyH), y2 = clamp(Math.max(drag.y0, p.y), 0, bodyH);
    box.style.left = (NAME_W + x1) + 'px';
    box.style.top = y1 + 'px';
    box.style.width = Math.max(0, x2 - x1) + 'px';
    box.style.height = Math.max(0, y2 - y1) + 'px';
    const next = new Set();
    rows.forEach((r, i) => {
      const g = geo[i];
      if (!g || !g.t) return;                          /* 项目分组行不参与框选 */
      const top = i * ROW_H, bot = top + ROW_H;
      if (bot < y1 || top > y2) return;
      if (g.rr < x1 || g.rl > x2) return;
      next.add(g.t.id);
    });
    setSelection(next, root);
  };
  const tick = () => {
    if (!drag) return;
    const r = sc.getBoundingClientRect();
    const hh = head ? head.offsetHeight : 56;
    let vx = 0, vy = 0;
    const lx = r.left + NAME_W + EDGE;
    if (drag.cx < lx) vx = -ease(lx - drag.cx);
    else if (drag.cx > r.right - EDGE) vx = ease(drag.cx - (r.right - EDGE));
    const ty = r.top + hh + EDGE;
    if (drag.cy < ty) vy = -ease(ty - drag.cy);
    else if (drag.cy > r.bottom - EDGE) vy = ease(drag.cy - (r.bottom - EDGE));
    if (vx || vy) {
      sc.scrollLeft += vx;
      sc.scrollTop += vy;
      ganttScroll.l = sc.scrollLeft; ganttScroll.t = sc.scrollTop;
      paint();
    }
    raf = requestAnimationFrame(tick);
  };
  const onMove = e2 => {
    if (!drag) return;
    drag.cx = e2.clientX; drag.cy = e2.clientY;
    if (Math.abs(drag.cx - drag.sx) > 3 || Math.abs(drag.cy - drag.sy) > 3) drag.moved = true;
    paint();
  };
  const onUp = () => {
    if (!drag) return;
    const wasMoved = drag.moved;
    drag = null;
    cancelAnimationFrame(raf);
    box.style.display = 'none';
    document.body.classList.remove('marquee-on');
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    window.removeEventListener('pointercancel', onUp);
    if (!wasMoved) { setSelection(new Set(), root); clearDepSel(); }   /* 空白处单击 = 取消选择 */
  };
  sc.addEventListener('pointerdown', ev => {
    if (ev.button !== 0) return;
    if (ev.target.closest('.g-bar,.g-sum,.g-ms,.g-lbl,.g-node,.g-name,.g-head,.st-dot,.tw,.kb-card,.g-prow')) return;
    if (!ev.target.closest('.g-body')) return;
    const p = local(ev.clientX, ev.clientY);
    if (p.y < 0 || p.y > bodyH) return;
    /* 画笔开着的时候，轨道区域交给画笔，不再起框选 */
    if (paintOn) return;
    /* 点在依赖线上 → 选中这条线（而不是起框选） */
    const hit = ev.altKey || ev.ctrlKey || ev.metaKey || ev.shiftKey ? null : depHit(p.x, p.y, 8);
    if (hit) { ev.preventDefault(); selectDep(hit.after, hit.before); return; }
    if (ev.altKey || ev.ctrlKey || ev.metaKey || ev.shiftKey) return;
    ev.preventDefault();
    drag = { x0: p.x, y0: p.y, cx: ev.clientX, cy: ev.clientY, sx: ev.clientX, sy: ev.clientY, moved: false };
    box.style.display = 'block';
    document.body.classList.add('marquee-on');
    paint();
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
    raf = requestAnimationFrame(tick);
  });
}

/* ==================== 甘特图：背景画笔（涂色 / 橡皮，可自动隐藏） ==================== */
let ptOpen = false, ptBarEl = null, ptHideT = 0, ptHover = false;

/* 画笔的所有视觉状态都收在这一个函数里：圆按钮、面板、色板、画布上的状态条 */
function ptSync() {
  const bar = ptBarEl;
  const er = UI.brushTool === 'eraser';
  if (bar && bar.isConnected) {
    bar.classList.toggle('open', ptOpen);
    const fab = bar.querySelector('.pt-fab');
    if (fab) {
      fab.classList.toggle('on', paintOn);
      fab.classList.toggle('er', paintOn && er);
      /* 开启时圆按钮直接铺成当前笔色 —— 不用看面板也知道在用什么颜色 */
      fab.style.background = (paintOn && !er) ? UI.brushColor : '';
      const ic = fab.querySelector('.ic');
      if (ic) ic.textContent = (paintOn && er) ? '🧽' : '🖌';
      const bd = fab.querySelector('.pt-badge');
      if (bd) bd.style.background = er ? 'var(--danger)' : UI.brushColor;
      fab.title = paintOn
        ? (er ? '橡皮已开启 · 点击关闭' : '画笔已开启（' + UI.brushColor + '）· 点击关闭')
        : '点击开启背景画笔（选色 / 橡皮在面板里）';
    }
    const st = bar.querySelector('#ptState');
    if (st) {
      st.textContent = paintOn ? (er ? '开启中 · 橡皮' : '开启中 · 涂色') : '未开启';
      st.classList.toggle('on', paintOn);
    }
    const cur = bar.querySelector('#ptCur'), curTxt = bar.querySelector('#ptCurTxt');
    if (cur) cur.style.background = er ? 'var(--danger)' : UI.brushColor;
    if (curTxt) curTxt.textContent = er ? '当前：橡皮（擦掉已有涂色）' : '当前颜色：' + UI.brushColor;
    const exitBtn = bar.querySelector('[data-pt="exit"]');
    if (exitBtn) exitBtn.style.display = paintOn ? '' : 'none';
    $$('[data-pt="brush"],[data-pt="eraser"]', bar).forEach(b => {
      const isEr = b.dataset.pt === 'eraser';
      b.classList.toggle('on', paintOn && isEr === er);
    });
    $$('.pt-sw', bar).forEach(b => b.classList.toggle('on',
      paintOn && !er && b.dataset.ptc === UI.brushColor));
    /* 自定义取色器那一颗：里面那个小圆点跟着当前笔色走 */
    const cdot = bar.querySelector('[data-ptcpick] i');
    if (cdot) cdot.style.background = er ? 'var(--danger)' : UI.brushColor;
  }
  const sc = document.querySelector('#ganttRoot .g-scroll');
  if (sc) sc.classList.toggle('paintmode', paintOn);
  const hud = $('#ptHud');
  if (hud) {
    hud.classList.toggle('on', paintOn);
    const dot = hud.querySelector('#ptHudDot'), txt = hud.querySelector('#ptHudTxt');
    if (dot) dot.style.background = er ? 'var(--danger)' : UI.brushColor;
    if (txt) txt.textContent = er ? '橡皮已开启 · 按住左键擦除' : '画笔已开启 · 按住左键涂色';
  }
  armPtHide();
}
/* 面板「自动隐藏」：鼠标不在面板上时，静置几秒就自己收起来（鼠标一靠近又会展开） */
function armPtHide() {
  clearTimeout(ptHideT);
  if (!ptOpen || ptHover) return;
  ptHideT = setTimeout(() => { ptOpen = false; ptSync(); }, 2600);
}
function setPaint(on, tool) {
  const was = paintOn;
  paintOn = !!on;
  if (tool) UI.brushTool = tool;
  saveUI();
  ptSync();
  if (paintOn) {
    const tip = UI.brushTool === 'eraser' ? '橡皮' : '涂色（' + UI.brushColor + '）';
    toast(was ? '已切换为：' + tip
              : '背景画笔已开启：' + tip + ' · 在轨道上按住左键拖动（再点右下角圆按钮或按 Esc 退出）');
  } else if (was) {
    toast('已退出画笔，涂色仍保留在背景上');
  }
}
/* 点面板以外任何地方都收起面板（画笔保持开启，状态条会一直提示） */
document.addEventListener('pointerdown', e => {
  if (!ptOpen) return;
  if (ptBarEl && ptBarEl.contains(e.target)) return;
  ptOpen = false; ptHover = false; ptSync();
}, true);

function bindGanttPaint(root, rows, range, dayW, sc, body) {
  const bar = root.querySelector('#ptBar');
  if (!bar) return;
  ptBarEl = bar;
  const bodyH = rows.length * ROW_H;
  const X = i => Math.round(i * dayW);
  const layerBox = body.querySelector('.g-layer');
  const todayLine = layerBox.querySelector('.todayline');

  /* 鼠标一靠近就展开面板（离开后静置几秒再收），所以「选颜色」不用先点开 */
  bar.addEventListener('pointerenter', () => {
    ptHover = true;
    clearTimeout(ptHideT);
    if (!ptOpen) { ptOpen = true; ptSync(); }
  });
  bar.addEventListener('pointerleave', () => { ptHover = false; armPtHide(); });
  const hudEl = root.querySelector('#ptHud');
  if (hudEl) hudEl.addEventListener('click', () => setPaint(false));
  /* 面板里的 RGB 取色器：选完立刻换色并进入涂色。
     注意 input 会连续触发几百次，这里只做预览，落盘 / 提示留给 change。 */
  const cpIn = bar.querySelector('[data-ptcpick] input');
  if (cpIn) {
    let saveT = 0;
    const apply = () => {
      const h = normHex(cpIn.value);
      if (!h) return false;
      UI.brushColor = h; UI.brushTool = 'brush';
      if (!paintOn) setPaint(true); else ptSync();
      return true;
    };
    cpIn.addEventListener('input', () => {
      if (!apply()) return;
      if (saveT) clearTimeout(saveT);
      saveT = setTimeout(() => { saveT = 0; saveUI(); }, 260);
    });
    cpIn.addEventListener('change', () => {
      if (saveT) { clearTimeout(saveT); saveT = 0; }
      if (!apply()) return;
      saveUI();
      toast('画笔颜色：' + UI.brushColor);
    });
  }
  bar.addEventListener('click', ev => {
    const sw = ev.target.closest('[data-ptc]');
    if (sw) {
      ev.stopPropagation();
      const was = paintOn;
      UI.brushColor = sw.dataset.ptc; UI.brushTool = 'brush';
      if (was) { saveUI(); ptSync(); toast('画笔颜色：' + UI.brushColor); }  /* 已经在涂色，只换色 */
      else setPaint(true);                                                  /* 选中颜色即开始涂色，少一步 */
      return;
    }
    const b = ev.target.closest('[data-pt]');
    if (!b) return;
    ev.stopPropagation();
    const k = b.dataset.pt;
    if (k === 'toggle') { setPaint(!paintOn); return; } /* 圆按钮 = 一键开 / 关画笔 */
    if (k === 'close') { ptOpen = false; ptSync(); return; }
    if (k === 'brush') { setPaint(true, 'brush'); return; }
    if (k === 'eraser') { setPaint(true, 'eraser'); return; }
    if (k === 'exit') { setPaint(false); return; }
    if (k === 'clear') {
      const n = Object.keys(DB.paint || {}).length;
      if (!n) { toast('还没有涂过色'); return; }
      confirmBox('要清空全部背景涂色吗？共 ' + n + ' 个色块。', () => {
        DB.paint = {};
        commit('清空背景涂色');
        toast('已清空背景涂色');
      }, { title: '清空涂色', okText: '确认清空' });
    }
  });

  /* —— 在轨道上按住左键拖动 = 一笔涂色 / 一笔擦除 —— */
  const cellAt = (cx, cy) => {
    const br = body.getBoundingClientRect();
    const x = cx - br.left - NAME_W, y = cy - br.top;
    if (x < 0 || y < 0 || y >= bodyH) return null;
    const ri = Math.floor(y / ROW_H);
    if (ri < 0 || ri >= rows.length) return null;
    if (!rows[ri].t) return null;                     /* 项目分组行不吃涂色 */
    const di = clamp(Math.floor(x / dayW), 0, Math.max(0, range.total - 1));
    return { key: addDays(range.min, di) + '|' + rows[ri].t.id, di, ri };
  };
  let stroke = null;
  const paintCell = c => {
    const cur = DB.paint[c.key];
    if (UI.brushTool === 'eraser') {
      if (!cur) return;
      delete DB.paint[c.key];
      const el = body.querySelector('[data-pc="' + c.key + '"]');
      if (el) el.remove();
      pcFixEdges(c.key, body);            /* 擦掉中间一格后，左右两格要重新变成「带」的端点 */
      if (stroke) stroke.changed = true;
      return;
    }
    if (cur === UI.brushColor) return;
    DB.paint[c.key] = UI.brushColor;
    let el = body.querySelector('[data-pc="' + c.key + '"]');
    if (!el) {
      el = document.createElement('i');
      el.className = pcClass(c.key);
      el.dataset.pc = c.key;
      el.style.left = X(c.di) + 'px';
      el.style.width = (X(c.di + 1) - X(c.di)) + 'px';
      el.style.top = (c.ri * ROW_H) + 'px';
      el.style.height = ROW_H + 'px';
      layerBox.insertBefore(el, todayLine);
    }
    el.style.background = UI.brushColor;
    pcFixEdges(c.key, body);
    if (stroke) stroke.changed = true;
  };
  sc.addEventListener('pointerdown', ev => {
    if (!paintOn || ev.button !== 0) return;
    if (ev.target.closest('.g-name,.g-head,.g-corner,.st-dot,.tw,.g-node,.g-lbl,.g-snap,.g-zoomhud,.pt')) return;
    const c = cellAt(ev.clientX, ev.clientY);
    if (!c) return;
    ev.preventDefault(); ev.stopPropagation();
    stroke = { changed: false };
    document.body.classList.add('painting');
    try { sc.setPointerCapture(ev.pointerId); } catch (e) { /* ignore */ }
    paintCell(c);
    const mv = e2 => { const c2 = cellAt(e2.clientX, e2.clientY); if (c2) paintCell(c2); };
    const up = () => {
      document.body.classList.remove('painting');
      sc.removeEventListener('pointermove', mv);
      sc.removeEventListener('pointerup', up);
      sc.removeEventListener('pointercancel', up);
      try { sc.releasePointerCapture(ev.pointerId); } catch (e) { /* ignore */ }
      const changed = stroke && stroke.changed;
      stroke = null;
      if (changed) commit('背景涂色');      /* 整笔合成一个撤销步骤 */
    };
    sc.addEventListener('pointermove', mv);
    sc.addEventListener('pointerup', up);
    sc.addEventListener('pointercancel', up);
  });

  /* 每渲染一次就把画笔的视觉状态同步一遍（圆按钮颜色 / 状态条 / 面板文案） */
  ptSync();
}

/* ==================== 甘特图：右键菜单（任务条 / 依赖线） ==================== */
function segDist(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1, l2 = dx * dx + dy * dy;
  const t = l2 ? clamp(((px - x1) * dx + (py - y1) * dy) / l2, 0, 1) : 0;
  return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
}
function depHit(px, py, tol) {
  /* 容差给得宽一些：线本体才 2px，用户是「瞄着它点」的，太窄会点不中 */
  let best = null, bd = tol == null ? 9 : tol;
  ganttDeps.forEach(d => {
    d.segs.forEach(s => {
      const dd = segDist(px, py, s[0], s[1], s[2], s[3]);
      if (dd <= bd) { bd = dd; best = d; }
    });
  });
  return best;
}
function removeDep(afterId, beforeId) {
  const t = taskById(afterId), b = taskById(beforeId);
  if (!t) return;
  t.deps = (t.deps || []).filter(d => d !== beforeId);
  commit('删除依赖');
  toast('已删除依赖：' + shortTitle(b ? b.title : '?') + ' → ' + shortTitle(t.title));
}
function bindGanttCtx(root, rows, range, dayW, geo, body) {
  const sc = root.querySelector('.g-scroll');
  if (!sc) return;
  sc.addEventListener('contextmenu', ev => {
    const br = body.getBoundingClientRect();
    const px = ev.clientX - br.left - NAME_W, py = ev.clientY - br.top;
    const barEl = ev.target.closest('.g-bar,.g-sum,.g-ms');
    let t = barEl ? taskById(barEl.dataset.task) : null;
    /* 项目分组行：一整套「这一组怎么摆」的操作 */
    const prowEl = ev.target.closest('.g-prow');
    if (!t && prowEl && prowEl.dataset.projrow) {
      ev.preventDefault();
      const gp = prowEl.dataset.projrow;
      const shut = isProjCollapsed(gp);
      openCtxMenu(ev.clientX, ev.clientY, [
        { head: (projById(gp) || {}).name || '项目' },
        { label: shut ? '展开这组任务' : '收起这组任务', k: '单击', onClick: () => { toggleProjCollapse(gp); render(); } },
        { label: '只看这个项目', k: '双击', onClick: () => { UI.project = gp; UI.collapsed = []; saveUI(); render(); } },
        { sep: true },
        { label: '展开全部（含所有项目分组）', onClick: () => expandAllGroups() },
        { label: '全部收起（只留项目分组）', onClick: () => collapseAllGroups() },
        { sep: true },
        { label: '重命名项目…', onClick: () => renameProject(gp) },
        { label: '管理项目…', onClick: () => openProjectModal() }
      ]);
      return;
    }
    if (!t) {
      /* 依赖线优先于「所在行」：线只有 1.4px，用户是专门瞄准它右键的 */
      const hit = depHit(px, py);
      if (hit) {
        ev.preventDefault();
        const after = taskById(hit.after), before = taskById(hit.before);
        if (!after || !before) return;
        /* 右键也顺手把这条线「选中」——高亮起来，之后按 Delete 就能删 */
        clearDepSel();
        depSel = { after: hit.after, before: hit.before };
        paintDepSel();
        const cx = ev.clientX, cy = ev.clientY;
        const dKey = hit.after + '|' + hit.before;
        const dCur = (DB.depColors || {})[dKey] || null;
        openCtxMenu(cx, cy, [
          { head: shortTitle(before.title) + ' → ' + shortTitle(after.title) },
          { label: '编辑后置任务「' + shortTitle(after.title) + '」…', onClick: () => openTaskModal(after.id) },
          { label: '编辑前置任务「' + shortTitle(before.title) + '」…', onClick: () => openTaskModal(before.id) },
          { sep: true },
          {
            label: dCur ? '改这条线的颜色…（当前 ' + dCur + '）' : '给这条线单独指定颜色…',
            onClick: () => openColorPickerAt(cx, cy, dCur, v => {
              DB.depColors = DB.depColors || {};
              if (v) DB.depColors[dKey] = v; else delete DB.depColors[dKey];
              commit('依赖线颜色');
              toast(v ? '这条依赖线已改用 ' + v : '这条依赖线已恢复默认颜色');
            }, colorHead('依赖线颜色', !!dCur),
            /* 拖色相条时只给这一条线换色做预览 */
            v => {
              DB.depColors = DB.depColors || {};
              if (v) DB.depColors[dKey] = v; else delete DB.depColors[dKey];
              const g = document.querySelector('.dep-g[data-dep-after="' + after.id +
                '"][data-dep-before="' + before.id + '"]');
              if (!g) return;
              if (v) { g.classList.add('has-c'); g.style.setProperty('--dc', v); }
              else { g.classList.remove('has-c'); g.style.removeProperty('--dc'); }
            })
          },
          { label: '只删除这条依赖', danger: true, onClick: () => removeDep(after.id, before.id) }
        ]);
        return;
      }
      const rowEl = ev.target.closest('.g-row');
      if (rowEl && rowEl.dataset.rowtask) t = taskById(rowEl.dataset.rowtask);
    }
    if (!t) return;
    ev.preventDefault();
    const cx = ev.clientX, cy = ev.clientY;
    /* 落在多选集合里 → 给批量菜单 */
    if (ganttSel.size > 1 && ganttSel.has(t.id)) {
      const n = ganttSel.size;
      openCtxMenu(cx, cy, [
        { head: '已选中 ' + n + ' 个任务' },
        { label: '批量删除选中的 ' + n + ' 个任务', danger: true, onClick: () => deleteTasks(Array.from(ganttSel)) },
        { sep: true },
        { label: '取消选择', k: 'Esc', onClick: () => setSelection(new Set(), root) }
      ]);
      return;
    }
    const isParent = hasKids(t.id);
    openCtxMenu(cx, cy, [
      { head: t.title },
      { label: '编辑任务详情…', k: '双击', onClick: () => openTaskModal(t.id) },
      { label: '新建子任务…', onClick: () => openTaskModal(null, { parentId: t.id }) },
      { sep: true },
      {
        label: t.color ? '改任务条颜色…（当前 ' + t.color + '）' : '给任务条单独指定颜色…',
        onClick: () => openColorPickerAt(cx, cy, t.color, v => {
          t.color = v;
          commit('任务条颜色');
          toast(v ? '任务条已改用 ' + v : '任务条已恢复跟随项目颜色');
        }, colorHead('任务条颜色', !!t.color),
        /* 拖色相条时只给这一条换色做预览，不提交、不提示 */
        v => {
          t.color = v;
          const b = document.querySelector('.g-bar[data-task="' + t.id + '"]');
          if (b) b.style.background = v || (projById(t.projectId) || {}).color || PALETTE[0];
        })
      },
      { sep: true },
      {
        label: t.milestone ? '取消里程碑' : '设为里程碑',
        onClick: () => {
          t.milestone = !t.milestone;
          if (t.milestone && t.end !== t.start) t.end = t.start;
          commit(t.milestone ? '设为里程碑' : '取消里程碑');
          toast(t.milestone ? '已设为里程碑' : '已取消里程碑');
        }
      },
      (t.deps || []).length ? {
        label: '清空它的 ' + t.deps.length + ' 条前置依赖',
        onClick: () => { t.deps = []; commit('清空依赖'); toast('已清空前置依赖'); }
      } : null,
      { sep: true },
      { label: '删除任务', danger: true, k: 'Del', onClick: () => deleteTask(t.id) }
    ].filter(Boolean));
  });
}

/* ==================== 通用：整行上下拖拽排序（甘特图大纲 / 列表视图共用） ==================== */
let sideRows = [];            /* 列表视图当前可见行，供排序换算 */

function selectRow(t, root, ev) {
  /* 统一入口：支持 Ctrl/⌘ 多选、Shift 追加，行为与看板 / 列表一致 */
  pickTask(t.id, ev, root || document.getElementById('ganttRoot'));
}

/* 把某一行提起来上下拖：行脱离文档流跟着光标，占位条在容器里实时换位。
   松手时把占位条的序号交给 cfg.onDrop(第 k 行之前)。 */
function startRowReorder(ev, rowEl, t, cfg) {
  const box = cfg.box || rowEl.parentElement;
  if (!box || !rowEl.parentElement) return;
  const cls = cfg.cls;
  const H = rowEl.offsetHeight || ROW_H;
  const top0 = rowEl.offsetTop;
  const y0 = ev.clientY;
  let active = false, ph = null, k = -2, moved = false, dy = 0, raf = 0;
  /* 起拖时一次性量测，之后只比数字：
     占位条和被拖的行等高、行又脱了文档流，所以换位不会改变其它行的位置 —— 量一次就够。
     原先每次 pointermove 都逐行 getBoundingClientRect() 再写样式，读写交替会把布局反复作废，
     行一多就明显卡顿。 */
  let others = [], centers = [], baseTop = 0;
  const begin = () => {
    if (active) return;
    active = true;
    baseTop = box.getBoundingClientRect().top;
    others = [];
    centers = [];
    let idx = 0, origIdx = 0;
    Array.from(box.children).forEach(x => {
      if (!x.classList || !x.classList.contains(cls)) return;
      if (x === rowEl) { origIdx = idx; return; }
      others.push(x);
      const r = x.getBoundingClientRect();
      centers.push(r.top + r.height / 2 - baseTop);
      idx++;
    });
    ph = document.createElement('div');
    ph.className = cls + ' ' + (cfg.phCls || 'ph');
    ph.style.height = H + 'px';
    box.insertBefore(ph, rowEl);
    rowEl.classList.add('drag-row');
    rowEl.style.top = top0 + 'px';
    rowEl.style.willChange = 'transform';
    document.body.classList.add('rowdrag');
    k = origIdx;                       /* 占位条此刻就在原位，别白挪一次 */
  };
  /* 真正的样式写入 / 换位只放在动画帧上跑，一帧最多一次 */
  const paint = () => {
    raf = 0;
    rowEl.style.transform = 'translate3d(0,' + dy + 'px,0)';
    /* 光标相对容器顶部的位置（容器本身也可能被滚动带走，所以这里读一次 rect） */
    const rel = y0 + dy - box.getBoundingClientRect().top;
    let kk = others.length;
    for (let i = 0; i < centers.length; i++) {
      if (rel < centers[i]) { kk = i; break; }
    }
    if (kk !== k) {
      k = kk;
      if (k >= others.length) box.appendChild(ph);
      else box.insertBefore(ph, others[k]);
    }
  };
  const onMove = e2 => {
    dy = e2.clientY - y0;
    if (Math.abs(dy) > 3) moved = true;
    if (!active) {
      if (Math.abs(dy) < H * 0.45) return;
      begin();
    }
    e2.preventDefault();
    if (!raf) raf = requestAnimationFrame(paint);
  };
  const onUp = () => {
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    window.removeEventListener('pointercancel', onUp);
    /* 落帧是异步的：松手时先把最后一次位移补上，否则读到的占位条位置是上一帧的 */
    if (raf) { cancelAnimationFrame(raf); raf = 0; paint(); }
    document.body.classList.remove('rowdrag');
    /* 占位条的序号要在把它摘掉之前取，摘掉之后就找不到它了 */
    let kTarget = -1;
    if (active) {
      kTarget = Array.from(box.children)
        .filter(x => x.classList && x.classList.contains(cls) && x !== rowEl).indexOf(ph);
    }
    if (ph) ph.remove();
    rowEl.classList.remove('drag-row');
    rowEl.style.top = '';
    rowEl.style.transform = '';
    rowEl.style.willChange = '';
    if (!active || !moved) return;
    cfg.onDrop(kTarget, t);
  };
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);
}

/* 把「眼下看到的顺序」固化成 order 值。
   视图可能是按开始日 / 优先级 / 进度 / 状态排出来的，而手动顺序存在 order 字段里，
   两者不一致时挪 order 就等于白挪 —— 所以拖排序之前先冻结一次，做到所见即所得。 */
function bakeOrder() {
  const cmp = cmpFor();
  const walk = parentId => {
    const kids = DB.tasks.filter(x => (x.parentId || null) === parentId).sort(cmp);
    kids.forEach((x, i) => { x.order = (i + 1) * 10; });
    kids.forEach(x => walk(x.id));
  };
  DB.projects.forEach(p => {
    const roots = DB.tasks.filter(x => !x.parentId && x.projectId === p.id).sort(cmp);
    roots.forEach((x, i) => { x.order = (i + 1) * 10; });
    roots.forEach(x => walk(x.id));
  });
}

/* 按「rest（＝去掉自己之后的可见行）里的第 k 行之前」把 t 落位，返回给用户看的说明。
   甘特大纲拖行、甘特条纵向换行、列表拖行三处共用，保证行为完全一致。

   关键取舍：只在「同级（同一个父任务）之内」换位，绝不改变层级。
   行是缩进着排的，最后一行往往是别的任务的子任务；如果直接拿「落点那一行」当锚点去插，
   拖到列表底部就会把任务整棵子树悄悄塞到某个父任务下面 —— 不是用户要的「上下移动位置」，
   而且会连带影响汇总进度和依赖。所以这里只在同级兄弟里就近取锚点。 */
function dropRowNear(t, rest, k) {
  if (!t || !rest || !rest.length) return '（这里只有它一个任务，位置没法再动）';
  const np = t.parentId || null;
  /* 同级兄弟（在可见行里的序号 + 任务本体），顺序就是所见顺序 */
  const sibs = [];
  rest.forEach((r, i) => {
    if ((r.t.parentId || null) === np && r.t.projectId === t.projectId) sibs.push({ i, t: r.t });
  });
  if (!sibs.length) {
    const par = np ? (taskById(np) || {}).title : '';
    return np
      ? '（它是「' + shortTitle(par || '父任务') + '」下唯一能看见的子任务，同一层没有别的行可换位）'
      : '（这个项目里没有和它同级的任务可以换位）';
  }
  /* 落点 k = 插到 rest[k] 之前。找同级里第一条「落在落点或其后面」的行，插到它前面；
     找不到（拖过了整组）就排到同级最后。 */
  let anchor = null, before = true;
  for (let i = 0; i < sibs.length; i++) { if (sibs[i].i >= k) { anchor = sibs[i].t; break; } }
  if (!anchor) { anchor = sibs[sibs.length - 1].t; before = false; }
  if (!anchor || anchor.id === t.id) return '';
  /* 先把可见顺序冻结成手动顺序，再落位 —— 否则「按日期排序」的视图里拖了等于白拖 */
  if (UI.sort !== 'manual') { bakeOrder(); UI.sort = 'manual'; saveUI(); }
  const seq = () => DB.tasks
    .filter(x => (x.parentId || null) === np && x.projectId === t.projectId)
    .sort(byOrder).map(x => x.id).join(',');
  const was = seq();
  if (!insertTaskNear(t, anchor, before)) return '（不能把任务移到自己的子任务下面）';
  if (seq() === was) return '（位置没有变化）';
  return '，已移到「' + shortTitle(anchor.title) + '」' + (before ? '之前' : '之后');
}

/* where: 'gantt' = 甘特大纲，其它 = 列表视图 */
function applyRowDrop(t, k, where) {
  const src = (where === 'gantt' ? ganttRows : sideRows) || [];
  if (src.length < 2) { toast('这里只有它一个任务，位置没法再动了'); return; }
  const rest = src.filter(r => r.t.id !== t.id);
  const note = dropRowNear(t, rest, k);
  commit('调整任务顺序');
  toast('已调整「' + shortTitle(t.title) + '」的位置' + note);
}

function startBarDrag(ev, el, t, range, dayW) {
  if (ev.button !== 0) return;
  if (paintOn) return;                       /* 画笔模式下轨道区域只画不拖 */
  ev.preventDefault();
  clearDepSel();
  const isSum = el.classList.contains('g-sum') || hasKids(t.id);
  let mode = 'm';
  if (!isSum) {
    if (ev.target.classList.contains('h')) mode = ev.target.classList.contains('l') ? 'l' : 'r';
  }
  const x0 = ev.clientX, y0 = ev.clientY;
  const s0 = t.start || today(), e0 = t.end || s0;
  const off0 = diffDays(range.min, s0);
  const dur = Math.max(0, diffDays(s0, e0));
  const left0 = el.offsetLeft, w0 = el.offsetWidth;
  const kids = isSum ? descendants(t.id) : [];
  let moved = false, dd = 0, dy = 0, raf = 0;
  /* —— 纵向换行：拖起整行离开文档流，占位条在列表里实时换位，其他行就「自适应」让开 —— */
  const row = el.closest('.g-row');
  const rowsBox = row ? row.parentElement : null;
  const drag = (mode === 'm' && row && rowsBox && ganttRows.length > 1)
    ? { row, box: rowsBox, top0: row.offsetTop, ph: null, k: -2, active: false, others: [], centers: [], baseTop: 0 } : null;
  const startRowDrag = () => {
    if (!drag || drag.active) return;
    drag.active = true;
    /* 一次性量测：占位条与行等高、行已脱流，换位不会改变其它行的位置 */
    drag.baseTop = rowsBox.getBoundingClientRect().top;
    drag.others = []; drag.centers = [];
    let idx = 0, origIdx = 0;
    Array.from(rowsBox.children).forEach(x => {
      if (!x.classList || !x.classList.contains('g-row')) return;
      if (x === row) { origIdx = idx; return; }
      drag.others.push(x);
      const r = x.getBoundingClientRect();
      drag.centers.push(r.top + r.height / 2 - drag.baseTop);
      idx++;
    });
    const ph = document.createElement('div');
    ph.className = 'g-row ph';
    ph.style.height = ROW_H + 'px';
    rowsBox.insertBefore(ph, row);
    row.classList.add('drag-row');
    row.style.top = drag.top0 + 'px';
    row.style.willChange = 'transform';
    drag.ph = ph;
    drag.k = origIdx;                  /* 占位条此刻就在原位 */
    document.body.classList.add('rowdrag');
    /* 行脱离文档流后，行内条形不能再被别的行盖住 */
    el.style.zIndex = 9;
  };
  try { el.setPointerCapture(ev.pointerId); } catch (e) { /* ignore */ }
  /* withPh = 其余行（把占位条也算进去），收尾时用它读占位条的真实序号 */
  const withPh = () => Array.from(rowsBox.children)
    .filter(x => x.classList.contains('g-row') && x !== drag.row);
  /* 样式写入 / 换位只在动画帧上跑：原先每个 pointermove 都逐行读 rect 再写样式，
     读写交替会让浏览器反复重算布局，行一多就卡 */
  const paint = () => {
    raf = 0;
    if (mode === 'm') el.style.left = (left0 + dd * dayW) + 'px';
    else if (mode === 'l') { el.style.left = (left0 + dd * dayW) + 'px'; el.style.width = Math.max(dayW, w0 - dd * dayW) + 'px'; }
    else el.style.width = Math.max(dayW, w0 + dd * dayW) + 'px';
    el.style.zIndex = 9;
    if (drag && drag.active) {
      drag.row.style.transform = 'translate3d(0,' + dy + 'px,0)';
      const rel = (y0 + dy) - rowsBox.getBoundingClientRect().top;
      let k = drag.others.length;
      for (let i = 0; i < drag.centers.length; i++) { if (rel < drag.centers[i]) { k = i; break; } }
      if (k !== drag.k) {
        drag.k = k;
        if (k >= drag.others.length) rowsBox.appendChild(drag.ph);
        else rowsBox.insertBefore(drag.ph, drag.others[k]);
      }
    }
  };
  const onMove = e2 => {
    const raw = Math.round((e2.clientX - x0) / dayW);
    const dyp = e2.clientY - y0;
    if (Math.abs(e2.clientX - x0) > 3 || Math.abs(dyp) > 3) moved = true;
    if (mode === 'l') dd = clamp(raw, -off0, dur);
    else if (mode === 'r') dd = Math.max(raw, -dur);
    else dd = raw;
    dy = dyp;
    el.style.cursor = 'grabbing';
    /* 纵向：够远了才真正把行提起来 */
    if (drag && !drag.active && Math.abs(dyp) >= ROW_H * 0.7) startRowDrag();
    e2.preventDefault();
    if (!raf) raf = requestAnimationFrame(paint);
  };
  const onUp = () => {
    el.removeEventListener('pointermove', onMove);
    el.removeEventListener('pointerup', onUp);
    el.removeEventListener('pointercancel', onUp);
    /* 落帧是异步的：松手时先把最后一次位移补上，否则读到的占位条位置是上一帧的 */
    if (raf) { cancelAnimationFrame(raf); raf = 0; paint(); }
    el.style.cursor = '';
    document.body.classList.remove('rowdrag');
    const rowMoved = !!(drag && drag.active);
    /* 占位条的兄弟序号要在把它摘掉之前取，摘掉之后就找不到它了 */
    const kTarget = rowMoved ? withPh().indexOf(drag.ph) : -1;
    if (drag) {
      if (drag.ph) drag.ph.remove();
      drag.row.classList.remove('drag-row');
      drag.row.style.top = '';
      drag.row.style.transform = '';
      drag.row.style.willChange = '';
    }
    /* 单击（没拖动）= 选中这一行；要编辑请双击 */
    if (!moved) { el.style.zIndex = ''; setSelection(new Set([t.id])); return; }
    if (mode === 'm') {
      t.start = addDays(s0, dd); t.end = addDays(e0, dd);
      kids.forEach(k => { k.start = addDays(k.start, dd); k.end = addDays(k.end, dd); });
    } else if (mode === 'l') { t.start = addDays(s0, dd); }
    else { t.end = addDays(e0, dd); }
    if (t.start > t.end) { const tmp = t.start; t.start = t.end; t.end = tmp; }
    let rowNote = '';
    if (rowMoved) {
      /* kTarget = 占位条在「其余可见行」里的序号：表示插到第 kTarget 行之前（越界则排到最后） */
      rowNote = dropRowNear(t, ganttRows.filter(r => r.t.id !== t.id), kTarget);
    }
    commit(rowMoved ? '移动任务' : '调整时间');
    toast('时间已更新：' + t.start + ' → ' + t.end + rowNote);
  };
  el.addEventListener('pointermove', onMove);
  el.addEventListener('pointerup', onUp);
  el.addEventListener('pointercancel', onUp);
}
/* 把 t 挪到「与 anchor 同级、排在 anchor 之前/之后」的位置，同级兄弟重排 order */
function insertTaskNear(t, anchor, before) {
  if (!t || !anchor || anchor.id === t.id) return false;
  if (anchor.projectId !== t.projectId) return false;
  if (isProgeny(t.id, anchor.id)) return false;                 /* 不能塞进自己的后代里 */
  const np = anchor.parentId || null;
  if (np && (np === t.id || isProgeny(t.id, np))) return false;
  t.parentId = np;
  const sibs = DB.tasks
    .filter(x => (x.parentId || null) === np && (np ? true : x.projectId === t.projectId) && x.id !== t.id)
    .sort(byOrder);
  let i = sibs.findIndex(x => x.id === anchor.id);
  if (i < 0) i = sibs.length;
  if (!before) i += 1;
  sibs.splice(clamp(i, 0, sibs.length), 0, t);
  sibs.forEach((x, k) => { x.order = (k + 1) * 10; });
  return true;
}
/* 把 t 挂成 parentId 的最后一个子任务 */
function appendUnder(t, parentId) {
  t.parentId = parentId;
  const kids = DB.tasks.filter(x => x.parentId === parentId && x.id !== t.id).sort(byOrder);
  kids.forEach((x, k) => { x.order = (k + 1) * 10; });
  t.order = (kids.length + 1) * 10;
  return true;
}
/* 把模板的工期 / 优先级 / 状态 / 工时 / 备注套到任务上
   side='l' 表示「落点是结束日」，工期往前推；否则落点是开始日 */
function applyTemplate(t, tpl, opt) {
  if (!tpl) return t;
  /* opt 只接受对象：传字符串进来时 opt.anchor 会命中原生的 String.prototype.anchor()，
     那是个函数、恒为真值，会让日期变成 NaN —— 这里兜一层 */
  opt = (opt && typeof opt === 'object') ? opt : { side: opt };
  const days = Math.max(1, Number(tpl.days) || 1);
  const raw = opt.anchor || t.start || t.end || today();
  const anchor = /^\d{4}-\d{2}-\d{2}$/.test(String(raw)) ? String(raw) : today();
  let start, end;
  if (opt.side === 'l') { end = anchor; start = addDays(end, -(days - 1)); }
  else { start = anchor; end = addDays(start, days - 1); }
  if (tpl.milestone) end = start;
  t.start = start; t.end = end;
  t.milestone = !!tpl.milestone;
  t.priority = [1, 2, 3].includes(Number(tpl.priority)) ? Number(tpl.priority) : t.priority;
  t.hours = Number(tpl.hours) || 0;
  if (tpl.note) t.note = tpl.note;
  if (statusById(tpl.status)) t.status = tpl.status;
  if (isDoneKey(t.status)) { t.progress = 100; t.doneAt = t.doneAt || new Date().toISOString(); }
  else { t.progress = 0; t.doneAt = null; }
  return t;
}
/* ==================== 八、看板 ==================== */
/* 父任务的状态/进度由子任务推导，但保留用户在父任务上自定义的状态（只要其类型一致） */
function syncParents(list) {
  const src = list || DB.tasks;
  src.forEach(p => {
    const kids = src.filter(c => c.parentId === p.id);
    if (!kids.length) return;
    const allDone = kids.every(k => isDoneKey(k.status));
    const anyRun = kids.some(k => !isTodoKey(k.status));
    const cur = statusById(p.status);
    if (allDone) {
      if (!cur || cur.mode !== 'done') { p.status = firstStatusOfMode('done'); p.doneAt = new Date().toISOString(); }
      else if (!p.doneAt) p.doneAt = new Date().toISOString();
    } else if (cur && cur.mode === 'done') {
      p.status = firstStatusOfMode(anyRun ? 'doing' : 'todo');
      p.doneAt = null;
    } else if (cur && cur.id === 'todo' && anyRun) {
      /* 父任务仍是默认「待办」、子任务却已启动 → 自动进入「进行中」
         （只处理默认核心状态，用户手动选的「待排期」等自定义状态保留不动） */
      p.status = firstStatusOfMode('doing');
      p.doneAt = null;
    }
    p.progress = Math.round(sum(kids, k => isDoneKey(k.status) ? 100 : clamp(k.progress, 0, 100)) / kids.length);
  });
}
/* 卡片 / 子任务行上共用的「附件 / 链接」角标 */
function kbAttChips(t) {

/* 当前作用域下应展示的状态列（通用状态 + 命中该范围的项目专属状态） */
function boardStatuses() {
  const pid = UI.project;
  let list = scopeStatuses(pid);
  if (pid === 'all' || pid === '__archived') {
    /* 「全部项目」视图里只留核心状态 + 真的有人在用的状态，别把各项目的专属状态全铺出来 */
    const used = new Set(DB.tasks.filter(t => inProject(t, pid)).map(t => t.status));

/* ==================== 看板：拖拽靠边自动滚动 ==================== */
const KB_EDGE_X = 100;  // 距左右边缘多远开始横向滚
const KB_EDGE_Y = 64;   // 距列内上下边缘多远开始纵向滚
const KB_MAX_X = 24;    // 横向每帧最大位移(px)
const KB_MAX_Y = 15;    // 纵向每帧最大位移(px)
const kbScroll = { l: 0, tops: {} };   // 跨渲染保留的滚动位置
let kbAuto = null;                     // { sc, list, x, y, raf }

/* 越贴近边缘越快：0 距离 = 满速，达到触发距离 = 停（外圈很慢，便于微调） */
function kbEase(dist, trigger, max) {
  return Math.max(1.2, max * Math.pow(1 - clamp(dist, 0, trigger) / trigger, 2));
}
function kbAutoStop() {
  if (kbAuto && kbAuto.raf) cancelAnimationFrame(kbAuto.raf);
  const sc = kbAuto && kbAuto.sc;
  if (sc && sc.isConnected) {
    const wrap = sc.parentElement;
    if (wrap) wrap.classList.remove('edge-l', 'edge-r');
    $$('.kb-col', sc).forEach(c => c.classList.remove('edge-t', 'edge-b'));
  }
  kbAuto = null;
}
function kbAutoTick() {
  if (!kbAuto) return;
  const sc = kbAuto.sc;
  if (!sc || !sc.isConnected) { kbAutoStop(); return; }
  const wrap = sc.parentElement;
  kbAuto.raf = requestAnimationFrame(kbAutoTick);
  /* 横向：整块看板左右滚 */
  const r = sc.getBoundingClientRect();
  let vx = 0;
  if (kbAuto.x - r.left < KB_EDGE_X) vx = -kbEase(kbAuto.x - r.left, KB_EDGE_X, KB_MAX_X);
  else if (r.right - kbAuto.x < KB_EDGE_X) vx = kbEase(r.right - kbAuto.x, KB_EDGE_X, KB_MAX_X);
  const maxL = sc.scrollWidth - sc.clientWidth;
  if (wrap) {
    if (maxL > 1 && vx) {
      sc.scrollLeft = clamp(sc.scrollLeft + vx, 0, maxL);
      wrap.classList.toggle('edge-l', vx < 0 && sc.scrollLeft > 1);
      wrap.classList.toggle('edge-r', vx > 0 && sc.scrollLeft < maxL - 1);
    } else wrap.classList.remove('edge-l', 'edge-r');
  }
  /* 纵向：光标所在那一列内部滚 */
  const list = kbAuto.list;
  if (!list || !list.isConnected) return;
  const col = list.closest('.kb-col');
  const lr = list.getBoundingClientRect();
  let vy = 0;
  if (kbAuto.y - lr.top < KB_EDGE_Y) vy = -kbEase(kbAuto.y - lr.top, KB_EDGE_Y, KB_MAX_Y);
  else if (lr.bottom - kbAuto.y < KB_EDGE_Y) vy = kbEase(lr.bottom - kbAuto.y, KB_EDGE_Y, KB_MAX_Y);
  const maxT = list.scrollHeight - list.clientHeight;
  if (col) {
    if (maxT > 1 && vy) {
      list.scrollTop = clamp(list.scrollTop + vy, 0, maxT);
      col.classList.toggle('edge-t', vy < 0 && list.scrollTop > 1);
      col.classList.toggle('edge-b', vy > 0 && list.scrollTop < maxT - 1);
    } else col.classList.remove('edge-t', 'edge-b');
  }
}
/* 拖拽过程中持续喂入光标坐标（dragover 会被节流，所以由 rAF 自己跑） */
function kbAutoTrack(sc, x, y, list) {
  if (!sc) return;
  if (!kbAuto || kbAuto.sc !== sc) {
    kbAutoStop();
    kbAuto = { sc, list, x, y, raf: 0 };
    kbAuto.raf = requestAnimationFrame(kbAutoTick);
    return;
  }
  kbAuto.x = x; kbAuto.y = y; kbAuto.list = list;
}
/* 兜底：拖拽在任何地方结束都收工 */
document.addEventListener('dragend', kbAutoStop, true);
document.addEventListener('drop', kbAutoStop, true);

/* ==================== 全站统一交互：单击高亮 / 双击编辑 ==================== */
/* 所有视图（甘特 / 看板 / 列表 / 仪表盘）都走这一个入口，行为完全一致 */
function pickTask(id, ev, root) {
  if (!id || !taskById(id)) return;
  if (depSel) clearDepSel();                       /* 选任务就放开依赖线，免得 Delete 语义打架 */
  const multi = !!(ev && (ev.ctrlKey || ev.metaKey));
  const range = !!(ev && ev.shiftKey && ganttSel.size);
  if (multi) {
    const next = new Set(ganttSel);
    if (next.has(id)) next.delete(id); else next.add(id);
    setSelection(next, root);
  } else if (range) {
    const next = new Set(ganttSel); next.add(id); setSelection(next, root);
  } else {
    setSelection(new Set([id]), root);
  }
}

/* ==================== 看板：子任务展开 / 就地新建 ==================== */
function kbOpened(id) { return Array.isArray(UI.kbOpen) && UI.kbOpen.indexOf(id) >= 0; }
function kbToggleOpen(id) {

/* 真正「加一条子任务」：继承父任务的项目，日期跟着父任务，状态与父任务一致 */
function addSubtask(parent, title) {
  if (!parent || !title) return null;
  const sibs = kidsOf(parent.id);
  const ord = sibs.length ? Math.max.apply(null, sibs.map(x => x.order || 0)) + 10 : 10;
  const st = statusById(parent.status) || {};
  const done = st.mode === 'done';
  const start = parent.start || today();
  const nt = {
    id: uid(), projectId: parent.projectId, parentId: parent.id, title, note: '',
    status: parent.status, priority: parent.priority || 2,
    start, end: addDays(start, 2), progress: done ? 100 : 0,
    hours: 0, milestone: false, deps: [], order: ord,
    doneAt: done ? new Date().toISOString() : null, color: null, attachments: []
  };
  revealTask(nt);
  DB.tasks.push(nt);
  commit('新建子任务');
  toast('已给「' + shortTitle(parent.title) + '」加子任务「' + title + '」');

}
/* 在卡片 / 子任务行里就地插入一个输入框 */
function openSubInput(root, pid) {
  const t = taskById(pid);
  if (!t) return;
  root.querySelectorAll('.kb-newsub').forEach(el => el.remove());
  if (!kbOpened(pid)) { kbToggleOpen(pid); renderKanban(root); return openSubInput(root, pid); }
  let card = root.querySelector('.kb-card[data-task="' + pid + '"]');
  let box = card ? card.querySelector('.kb-subs') : null;
  if (!box) {
    const sub = root.querySelector('.kb-sub[data-subrow="' + pid + '"]');
    box = document.createElement('div');
    box.className = 'kb-subs';
    if (card) card.insertBefore(box, card.querySelector('.meta'));

  }

    '<button class="btn sm primary" type="button">加</button>' +

  box.appendChild(wrap);

  inp.addEventListener('pointerdown', e => e.stopPropagation());
  const doAdd = () => {

  wrap.querySelector('.btn.primary').addEventListener('click', doAdd);
